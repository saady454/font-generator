<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="fnCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="fnStyleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="fnTileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#fnCompBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#a855f7" fill-opacity="0.10"/>
  <circle cx="1000" cy="460" r="240" fill="#06b6d4" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e1b4b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#c084fc" letter-spacing="2">GAMING SCHRIFT-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      4 beliebte <tspan fill="url(#fnStyleGrad)">Schriftstile für deinen Fortnite Nickname</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie unterschiedliche Unicode-Varianten die optische Wirkung deines Spielernamens prägen
    </text>
  </g>

  <!-- 4 Style Cards Arranged Horizontally / 2x2 Grid -->
  <g transform="translate(70, 155)">
    
    <!-- Card 1: Clean -->
    <g transform="translate(0, 0)" filter="url(#fnTileShadow)">
      <rect width="510" height="205" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="90" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">1. CLEAN</text>
      
      <rect x="20" y="55" width="470" height="65" rx="12" fill="#090d16" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="255" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">ShadowNova</text>

      <g transform="translate(20, 135)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Direkt, maximal lesbar &amp; kompetitiv</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Ideal für: <tspan fill="#94a3b8" font-weight="400">Ranked Matches, Turniere &amp; Clan-Tags</tspan></text>
      </g>
    </g>

    <!-- Card 2: Fett -->
    <g transform="translate(550, 0)" filter="url(#fnTileShadow)">
      <rect width="510" height="205" rx="20" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="80" height="24" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="60" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">2. FETT</text>
      
      <rect x="20" y="55" width="470" height="65" rx="12" fill="#090d16" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="255" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#ffffff">𝐒𝐡𝐚𝐝𝐨𝐰</text>

      <g transform="translate(20, 135)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Prägnant, kraftvoll &amp; sofort auffallend</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Ideal für: <tspan fill="#94a3b8" font-weight="400">Kurze Nicks (3-8 Zeichen), Kill-Feeds</tspan></text>
      </g>
    </g>

    <!-- Card 3: Kursiv -->
    <g transform="translate(0, 230)" filter="url(#fnTileShadow)">
      <rect width="510" height="205" rx="20" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="85" height="24" rx="6" fill="#c084fc" fill-opacity="0.15"/>
      <text x="62" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">3. KURSIV</text>
      
      <rect x="20" y="55" width="470" height="65" rx="12" fill="#090d16" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="255" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" font-weight="700" fill="#ffffff">𝑺𝒉𝒂𝒅𝒐𝒘</text>

      <g transform="translate(20, 135)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Dynamisch, elegant &amp; stilbewusst</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Ideal für: <tspan fill="#94a3b8" font-weight="400">Aesthetic Gaming-Profile &amp; Content Creator</tspan></text>
      </g>
    </g>

    <!-- Card 4: Gotisch -->
    <g transform="translate(550, 230)" filter="url(#fnTileShadow)">
      <rect width="510" height="205" rx="20" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="95" height="24" rx="6" fill="#f43f5e" fill-opacity="0.15"/>
      <text x="67" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f43f5e">4. GOTISCH</text>
      
      <rect x="20" y="55" width="470" height="65" rx="12" fill="#090d16" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="255" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#ffffff">𝔖𝔥𝔞𝔡𝔬𝔴</text>

      <g transform="translate(20, 135)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Düster, mystisch &amp; unverwechselbar</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f43f5e">Ideal für: <tspan fill="#94a3b8" font-weight="400">Dark Gaming, Horror-Maps &amp; epische Nicks</tspan></text>
      </g>
    </g>

  </g>
</svg>

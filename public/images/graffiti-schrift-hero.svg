<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="graffitiHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="50%" stop-color="#141424"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="neonOrangePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sprayCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="graffitiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Concrete Texture Simulation -->
  <rect width="1200" height="675" fill="url(#graffitiHeroBg)"/>

  <!-- Ambient Spray Glows -->
  <circle cx="250" cy="220" r="280" fill="#f97316" fill-opacity="0.12"/>
  <circle cx="950" cy="450" r="300" fill="#a855f7" fill-opacity="0.12"/>
  <circle cx="600" cy="300" r="240" fill="#06b6d4" fill-opacity="0.08"/>

  <!-- Spray Splatters &amp; Decorative Street-Art Drips -->
  <g fill="#ec4899" fill-opacity="0.25">
    <circle cx="150" cy="120" r="14"/>
    <circle cx="170" cy="140" r="6"/>
    <circle cx="140" cy="150" r="4"/>
    <circle cx="1060" cy="180" r="16"/>
    <circle cx="1080" cy="210" r="8"/>
    <circle cx="1040" cy="220" r="5"/>
  </g>
  <g fill="#06b6d4" fill-opacity="0.25">
    <circle cx="200" cy="550" r="12"/>
    <circle cx="1000" cy="540" r="15"/>
    <circle cx="980" cy="570" r="7"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#fb923c" letter-spacing="2">🎨 URBAN STREET ART STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Graffiti Schrift: <tspan fill="url(#neonOrangePink)">Graffiti Text online erstellen</tspan>
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Urbane Styles, Tags, Bubble Letters &amp; Street-Art-Looks für Social Media &amp; Designs
  </text>

  <!-- Main Wall Display Card -->
  <g transform="translate(100, 215)" filter="url(#graffitiShadow)">
    <rect width="1000" height="400" rx="28" fill="#141422" stroke="#f97316" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Concrete Wall Inner Box -->
    <rect x="25" y="25" width="950" height="350" rx="20" fill="#0d0d16" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- Large Stylized Graffiti Lettering Display: "URBAN STYLE" -->
    <g transform="translate(500, 150)" text-anchor="middle">
      <!-- Glow Drop Shadow Behind Text -->
      <text y="10" font-family="Impact, 'Arial Black', sans-serif" font-size="92" font-weight="900" fill="#000000" fill-opacity="0.8" letter-spacing="8">GRAFFITI</text>
      <!-- Main Spray Gradient Fill -->
      <text y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="92" font-weight="900" fill="url(#neonOrangePink)" letter-spacing="8" stroke="#ffffff" stroke-width="2">GRAFFITI</text>
      <text y="65" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" letter-spacing="6">𝒰𝓇𝒷𝒶𝓃 𝒮𝒸𝓇𝒾𝓅𝓉 &amp; 𝕭𝖑𝖔𝖈𝖐 𝕿𝖆𝖌𝖘</text>
    </g>

    <!-- 4 Tag Style Chips Below -->
    <g transform="translate(60, 265)">
      <g transform="translate(0, 0)">
        <rect width="205" height="65" rx="14" fill="#18182a" stroke="#f97316" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fb923c" letter-spacing="1">TAG STYLE</text>
        <text x="20" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">𝒢𝓇𝒶𝒻𝒻𝒾𝓉𝒾 𝒯𝒶𝑔</text>
      </g>

      <g transform="translate(225, 0)">
        <rect width="205" height="65" rx="14" fill="#18182a" stroke="#ec4899" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="1">BUBBLE LETTERS</text>
        <text x="20" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ⓑⓤⓑⓑⓛⓔ</text>
      </g>

      <g transform="translate(450, 0)">
        <rect width="205" height="65" rx="14" fill="#18182a" stroke="#a855f7" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="1">BLOCK / GOTHIC</text>
        <text x="20" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">𝕲𝖗𝖆𝖋𝖋𝖎𝖙𝖎</text>
      </g>

      <g transform="translate(675, 0)">
        <rect width="205" height="65" rx="14" fill="#18182a" stroke="#06b6d4" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="1">DOUBLE-STRUCK</text>
        <text x="20" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">𝔾𝕣𝕒𝕗𝕗𝕚𝕥𝕚</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ttBioGuideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060b"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#06070e"/>
    </linearGradient>
    <linearGradient id="ttNeonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25f4ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#fe2c55"/>
    </linearGradient>
    <filter id="ttBioShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#ttBioGuideBg)"/>

  <!-- Ambient Lights -->
  <circle cx="300" cy="200" r="260" fill="#25f4ee" fill-opacity="0.08"/>
  <circle cx="900" cy="450" r="280" fill="#fe2c55" fill-opacity="0.08"/>

  <!-- Badge &amp; Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#141926" stroke="#25f4ee" stroke-opacity="0.35"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#25f4ee" letter-spacing="1.5">BEST PRACTICE BIO GUIDE</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff">
    TikTok Bio: Ausgefallene Schrift mit Lesbarkeit kombinieren
  </text>
  <text x="600" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Gezielte Akzente für Schlüsselwörter – klarer Text für maximale Klickrate und Reichweite
  </text>

  <!-- Side-by-Side Comparison (Normal vs. Überladen vs. Optimal Gestylt) -->
  <g transform="translate(80, 185)">
    
    <!-- Card 1: Zu schlicht / Standard -->
    <g transform="translate(0, 0)" filter="url(#ttBioShadow)">
      <rect width="320" height="420" rx="20" fill="#0d111a" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="20" y="20" width="100" height="26" rx="6" fill="#1e2433"/>
      <text x="70" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">STANDARDFONT</text>
      
      <!-- Profile Simulation -->
      <g transform="translate(20, 65)">
        <circle cx="30" cy="30" r="24" fill="#182030"/>
        <text x="30" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">👤</text>
        <text x="68" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Alex Müller</text>
        <text x="68" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">@alex_mueller</text>
      </g>

      <rect x="20" y="140" width="280" height="180" rx="12" fill="#06080d" stroke="#ffffff" stroke-opacity="0.04"/>
      <text x="36" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Creator | Gaming | Videos</text>
      <text x="36" y="205" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Willkommen auf meinem Kanal.</text>
      <text x="36" y="228" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Streame jeden Tag ab 18 Uhr.</text>
      <text x="36" y="258" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">discord.gg/alexgaming</text>

      <g transform="translate(20, 340)">
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">⚡ Wirkung: <tspan fill="#e2e8f0" font-weight="600">Unauffällig &amp; generisch</tspan></text>
        <text x="10" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Keine visuellen Blickfänger.</text>
      </g>
    </g>

    <!-- Card 2: Zu überladen (Negativbeispiel) -->
    <g transform="translate(360, 0)" filter="url(#ttBioShadow)">
      <rect width="320" height="420" rx="20" fill="#0d111a" stroke="#fe2c55" stroke-opacity="0.3"/>
      <rect x="20" y="20" width="130" height="26" rx="6" fill="#fe2c55" fill-opacity="0.15"/>
      <text x="85" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fe2c55">⚠️ ZU ÜBERLADEN</text>
      
      <!-- Profile Simulation -->
      <g transform="translate(20, 65)">
        <circle cx="30" cy="30" r="24" fill="#182030"/>
        <text x="30" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">💀</text>
        <text x="68" y="26" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#ffffff">𝕬𝖑𝖊𝖝 𝕸𝖚̈𝖑𝖑𝖊𝖗</text>
        <text x="68" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">@alex_mueller</text>
      </g>

      <rect x="20" y="140" width="280" height="180" rx="12" fill="#06080d" stroke="#fe2c55" stroke-opacity="0.2"/>
      <text x="36" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fe2c55">꧁★ 𝓒𝓻𝓮𝓪𝓽𝓸𝓻 𝓖𝓪𝓶𝓲𝓷𝓰 ★꧂</text>
      <text x="36" y="205" font-family="Georgia, serif" font-size="11" fill="#ffffff">𝔚𝔦𝔩𝔩𝔨𝔬𝔪𝔪𝔢𝔫 𝔞𝔲𝔣 𝔪𝔢𝔦𝔫𝔢𝔪 𝔎𝔞𝔫𝔞𝔩</text>
      <text x="36" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff">𝘚𝘵𝘳𝘦𝘢𝘮𝘦 𝘫𝘦𝘥𝘦𝘯 𝘛𝘢𝘨 𝘢𝘣 18 𝘜𝘩𝘳</text>
      <text x="36" y="258" font-family="Courier New, monospace" font-size="11" fill="#25f4ee">【 𝚍𝚒𝚜𝚌𝚘𝚛𝚍.𝚐𝚐/𝚊𝚕𝚎𝚡 】</text>

      <g transform="translate(20, 340)">
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#fe2c55" font-weight="700">❌ Schlechte Lesbarkeit</text>
        <text x="10" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Screenreader &amp; Nutzer überfordert.</text>
      </g>
    </g>

    <!-- Card 3: Perfekte Balance (Empfohlen) -->
    <g transform="translate(720, 0)" filter="url(#ttBioShadow)">
      <rect width="320" height="420" rx="20" fill="#0f1624" stroke="#25f4ee" stroke-width="2"/>
      <rect x="20" y="20" width="135" height="26" rx="6" fill="#25f4ee" fill-opacity="0.2"/>
      <text x="87" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#25f4ee">✨ IDEALE BALANCE</text>
      
      <!-- Profile Simulation -->
      <g transform="translate(20, 65)">
        <circle cx="30" cy="30" r="24" fill="#1b2438" stroke="url(#ttNeonBar)" stroke-width="2"/>
        <text x="30" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🔥</text>
        <text x="68" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">𝗔𝗹𝗲𝘅 𝗠𝘂̈𝗹𝗹𝗲𝗿 ✨</text>
        <text x="68" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#25f4ee">@alex_mueller</text>
      </g>

      <rect x="20" y="140" width="280" height="180" rx="12" fill="#070a12" stroke="#25f4ee" stroke-opacity="0.3"/>
      <text x="36" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#25f4ee">𝗖𝗿𝗲𝗮𝘁𝗼𝗿 | 𝙂𝙖𝙢𝙞𝙣𝙜 | Videos 🎬</text>
      <text x="36" y="205" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Täglich neue Clips &amp; Highlights ✨</text>
      <text x="36" y="228" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Community Streams ab 18 Uhr</text>
      <text x="36" y="258" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fe2c55">🔗 discord.gg/alexgaming</text>

      <g transform="translate(20, 340)">
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#25f4ee" font-weight="800">✅ Maximaler Impact</text>
        <text x="10" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Blickfang + 100% verständlich.</text>
      </g>
    </g>

  </g>
</svg>

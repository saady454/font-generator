<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="dcCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="50%" stop-color="#121524"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#dcCompBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#5865F2" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="240" fill="#808bf5" fill-opacity="0.08"/>

  <!-- Section Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#181b30" stroke="#5865F2" stroke-opacity="0.4"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#808bf5" letter-spacing="1.5">DISCORD STILE IM VERGLEICH</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff">
    Welche Schriftarten eignen sich für Discord?
  </text>
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    Wirkung, Lesbarkeit und empfohlene Einsatzbereiche für Namen, Server &amp; Rollen
  </text>

  <!-- 5 Typography Comparison Cards Grid -->
  <g transform="translate(100, 180)">
    <!-- Column Headers -->
    <rect width="1000" height="36" rx="8" fill="#141727"/>
    <text x="30" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#808bf5" letter-spacing="1">STIL</text>
    <text x="280" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#808bf5" letter-spacing="1">BEISPIEL (UNICODE)</text>
    <text x="680" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#808bf5" letter-spacing="1">GEEIGNET FÜR</text>

    <!-- Row 1: Fett -->
    <g transform="translate(0, 48)">
      <rect width="1000" height="64" rx="12" fill="#0f1220" stroke="#5865F2" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="18" width="90" height="28" rx="8" fill="#5865F2" fill-opacity="0.2"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#808bf5">Fett</text>
      <text x="280" y="40" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff">𝗗𝗶𝘀𝗰𝗼𝗿𝗱</text>
      <text x="680" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Namen und Akzente</text>
    </g>

    <!-- Row 2: Kursiv -->
    <g transform="translate(0, 122)">
      <rect width="1000" height="64" rx="12" fill="#0f1220" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="20" y="18" width="90" height="28" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Kursiv</text>
      <text x="280" y="40" font-family="system-ui, sans-serif" font-size="24" font-style="italic" font-weight="700" fill="#ffffff">𝘋𝘪𝘴𝘤𝘰𝘳𝘥</text>
      <text x="680" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Status und kurze Texte</text>
    </g>

    <!-- Row 3: Gotisch -->
    <g transform="translate(0, 196)">
      <rect width="1000" height="64" rx="12" fill="#0f1220" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="20" y="18" width="90" height="28" rx="8" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24">Gotisch</text>
      <text x="280" y="40" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff">𝔇𝔦𝔰𝔠𝔬𝔯𝔡</text>
      <text x="680" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Gaming und Fantasy</text>
    </g>

    <!-- Row 4: Monospace -->
    <g transform="translate(0, 270)">
      <rect width="1000" height="64" rx="12" fill="#0f1220" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="20" y="18" width="105" height="28" rx="8" fill="#34d399" fill-opacity="0.15"/>
      <text x="72" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34d399">Monospace</text>
      <text x="280" y="40" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#ffffff">𝙳𝚒𝚜𝚌𝚘𝚛𝚍</text>
      <text x="680" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">technischen Look, Bots</text>
    </g>

    <!-- Row 5: Bubble -->
    <g transform="translate(0, 344)">
      <rect width="1000" height="64" rx="12" fill="#0f1220" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="20" y="18" width="90" height="28" rx="8" fill="#f472b6" fill-opacity="0.15"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">Bubble</text>
      <text x="280" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Ⓓⓘⓢⓒⓞⓡⓓ</text>
      <text x="680" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">auffällige Namen &amp; Rollen</text>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="compBgDeco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14"/>
      <stop offset="50%" stop-color="#141226"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="decoFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="tileShadowDeco" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#compBgDeco)"/>

  <!-- Ambient Glows -->
  <circle cx="250" cy="200" r="240" fill="#ec4899" fill-opacity="0.08"/>
  <circle cx="950" cy="450" r="260" fill="#c084fc" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">TYPOGRAFIE-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Normale Standardschrift vs. <tspan fill="url(#decoFlow)">Dekorative Schmuckschrift</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie Ornamente, Rahmen &amp; Sonderzeichen einen einfachen Namen visuell transformieren
    </text>
  </g>

  <!-- Comparison Split Cards (Left: Plain / Right: Decorative) -->
  <g transform="translate(80, 160)">
    
    <!-- LEFT CARD: Normale Standardschrift -->
    <g transform="translate(0, 0)" filter="url(#tileShadowDeco)">
      <rect width="500" height="440" rx="24" fill="#121424" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
      <rect x="25" y="24" width="200" height="28" rx="14" fill="#ffffff" fill-opacity="0.08"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#94a3b8">NORMALE SCHRIFT</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" font-weight="700">Neutral &amp; Schlicht</text>

      <!-- Specimen Box -->
      <rect x="25" y="70" width="450" height="150" rx="16" fill="#080a12" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="225" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Prinzessin Sarah</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Reiner ASCII-Text ohne Verzierungen</text>

      <!-- Feature List -->
      <g transform="translate(25, 250)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften:</text>
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#94a3b8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Maximale Lesbarkeit für Fließtexte</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#94a3b8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Kein optischer Wiedererkennungswert</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#94a3b8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Wirkt in Bios und Nicknames unauffällig</text>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: Dekorative Schmuckschrift -->
    <g transform="translate(540, 0)" filter="url(#tileShadowDeco)">
      <rect width="500" height="440" rx="24" fill="#151226" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="25" y="24" width="220" height="28" rx="14" fill="#ec4899" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">DEKORATIVE SCHRIFT</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#f472b6" font-weight="700">Visueller Akzent</text>

      <!-- Specimen Box -->
      <rect x="25" y="70" width="450" height="150" rx="16" fill="#0b0816" stroke="#ec4899" stroke-opacity="0.3"/>
      <text x="225" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="url(#decoFlow)">꧁ 𝒫𝓇𝒾𝓃𝓏𝑒𝓈𝓈𝒾𝓃 𝒮𝒶𝓇𝒶𝒽 ꧂</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f472b6" font-weight="600">✓ Engelsflügel, Script-Codepoints &amp; Glanz</text>

      <!-- Feature List -->
      <g transform="translate(25, 250)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften &amp; Vorteile:</text>
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#ec4899"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Zieht Blicke in Feeds &amp; Rankings magisch an</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#ec4899"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Perfekt für Instagram-Bios, TikTok &amp; Discord</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#ec4899"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">1-Klick Copy &amp; Paste direkt im Browser</text>
        </g>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="50%" stop-color="#0d111e"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <filter id="cyberShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#cyberBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#06b6d4" fill-opacity="0.1"/>
  <circle cx="920" cy="450" r="260" fill="#ec4899" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">PRAXIS &amp; GAMING</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Glitch-Schrift in <tspan fill="#38bdf8">Discord, Gaming &amp; Bios</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Auffällige Cyberpunk-Profile, Gamertags und geheimnisvolle Chat-Botschaften
    </text>
  </g>

  <!-- 3 Mockup Applications -->
  <g transform="translate(80, 160)">
    
    <!-- Phone 1: Discord Profile Mockup -->
    <g transform="translate(0, 0)" filter="url(#cyberShadow)">
      <rect width="325" height="440" rx="24" fill="#101524" stroke="#5865f2" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#181f34"/>
      <rect y="20" width="325" height="20" fill="#181f34"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#5865f2">🎮 DISCORD PROFIL &amp; ROLLEN</text>

      <!-- Banner &amp; Avatar -->
      <g transform="translate(20, 55)">
        <rect width="285" height="70" rx="10" fill="#1e1830"/>
        <circle cx="50" cy="70" r="28" fill="#5865f2" fill-opacity="0.3" stroke="#5865f2" stroke-width="2"/>
        <text x="50" y="78" text-anchor="middle" font-size="20">⚡</text>
      </g>

      <!-- Profile Details -->
      <g transform="translate(20, 150)">
        <rect width="285" height="195" rx="14" fill="#080a12" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">N̵E̵O̵N̵_̵G̵H̵O̵S̵T̵</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#5865f2">@cyber_phantom</text>
        
        <line x1="20" y1="65" x2="265" y2="65" stroke="#ffffff" stroke-opacity="0.08"/>
        
        <text x="20" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ABOUT ME:</text>
        <text x="20" y="112" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">C̵y̵b̵e̵r̵p̵u̵n̵k̵ Developer 🦾</text>
        <text x="20" y="136" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">E̵R̵R̵O̵R̵ 404: Sleep not found</text>
        
        <rect x="20" y="152" width="130" height="26" rx="6" fill="#5865f2" fill-opacity="0.2"/>
        <text x="85" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8">[ 𝐻𝒜𝒞𝒦𝐸𝑅 ]</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#141c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">✓ Unverwechselbar</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Fällt in Server-Mitgliederlisten sofort auf</text>
    </g>

    <!-- Phone 2: Gaming Lobby Gamertag Mockup -->
    <g transform="translate(355, 0)" filter="url(#cyberShadow)">
      <rect width="325" height="440" rx="24" fill="#101524" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#181f34"/>
      <rect y="20" width="325" height="20" fill="#181f34"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">🎯 GAMING SCOREBOARD</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#080a12" stroke="#ec4899" stroke-opacity="0.3"/>
        
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">MATCH SCOREBOARD:</text>
        
        <!-- Scoreboard Row 1 (Player 1 with Glitch) -->
        <rect x="15" y="45" width="255" height="48" rx="8" fill="#1e1828" stroke="#ec4899" stroke-opacity="0.4"/>
        <text x="25" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#f472b6">#1 V̵O̵I̵D̵_̵K̵I̵N̵G̵</text>
        <text x="255" y="74" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">24 Kills</text>

        <!-- Scoreboard Row 2 -->
        <rect x="15" y="102" width="255" height="45" rx="8" fill="#121626"/>
        <text x="25" y="130" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">#2 ShadowStrike</text>
        <text x="255" y="130" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">18 Kills</text>

        <!-- Scoreboard Row 3 -->
        <rect x="15" y="155" width="255" height="45" rx="8" fill="#121626"/>
        <text x="25" y="183" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">#3 PhantomBlade</text>
        <text x="255" y="183" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">15 Kills</text>

        <rect x="15" y="215" width="255" height="55" rx="8" fill="#1a121e"/>
        <text x="25" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">Tipp für Spiele:</text>
        <text x="25" y="256" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Kurze Namen nutzen, um Filter zu umgehen</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#141c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">✓ Gaming-Kompatibilität</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Beliebt in CS2, Fortnite, Roblox &amp; Valorant</text>
    </g>

    <!-- Phone 3: Social Media Post / Chat Mockup -->
    <g transform="translate(710, 0)" filter="url(#cyberShadow)">
      <rect width="325" height="440" rx="24" fill="#101524" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#181f34"/>
      <rect y="20" width="325" height="20" fill="#181f34"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#06b6d4">📱 HORROR &amp; MYSTERY POST</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#080a12" stroke="#06b6d4" stroke-opacity="0.3"/>
        
        <circle cx="40" cy="35" r="16" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="40" y="41" text-anchor="middle" font-size="12">👁️</text>
        <text x="68" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">mystery_tales</text>
        <text x="68" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Creepypasta Story</text>

        <!-- Post Content -->
        <rect x="15" y="65" width="255" height="150" rx="10" fill="#0d111e"/>
        <text x="25" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ef4444">H̵E̵ ̵C̵O̵M̵E̵S̵...</text>
        <text x="25" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">T̵h̵e̵ ̵s̵i̵g̵n̵a̵l̵ ̵i̵s̵ ̵l̵o̵s̵t̵.</text>
        <text x="25" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">W̵a̵t̵c̵h̵ ̵y̵o̵u̵r̵ ̵b̵a̵c̵k̵.̵</text>
        <text x="25" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#06b6d4">#Glitch #Cyberpunk #Horror</text>

        <rect x="15" y="230" width="255" height="42" rx="8" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="142" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Audio Anhören 🎧</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#141c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#06b6d4">✓ Storytelling &amp; Memes</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Faszinierender Mystik-Effekt</text>
    </g>

  </g>
</svg>

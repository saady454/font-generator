<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="transBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2538"/>
      <stop offset="100%" stop-color="#131724"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#transBg)"/>

  <!-- Title -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="sans-serif" font-size="13" font-weight="800" fill="#60a5fa" letter-spacing="1.5">UNICODE-TRANSFORMATION</text>
    
    <text y="55" font-family="sans-serif" font-size="32" font-weight="900" fill="#ffffff">
      Wie funktioniert <tspan fill="#f59e0b">Unicode-Fettschrift</tspan> technisch?
    </text>
    <text y="85" font-family="sans-serif" font-size="14" fill="#94a3b8">
      Ersetzung von ASCII-Basiszeichen durch eigenständige mathematische Codepoints
    </text>
  </g>

  <!-- Transformation Flow -->
  <g transform="translate(100, 180)">
    
    <!-- Step 1: Normal ASCII Input -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="280" height="380" rx="20" fill="url(#boxGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="20" y="20" width="100" height="26" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="70" y="37" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">1. EINGABE</text>

      <text x="140" y="110" font-family="sans-serif" font-size="64" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
      <text x="140" y="150" font-family="monospace" font-size="15" fill="#94a3b8" text-anchor="middle">Codepoint: U+0041</text>
      <text x="140" y="175" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Standard Latin Letter</text>

      <line x1="25" y1="205" x2="255" y2="205" stroke="#ffffff" stroke-opacity="0.08"/>

      <g transform="translate(25, 230)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#ffffff">Tastatur-Standard:</text>
        <text y="24">• Kein Styling im Zeichen</text>
        <text y="48">• Benötigt normalerweise CSS</text>
        <text y="72" fill="#f87171">• Verliert Format im Chat</text>
      </g>
    </g>

    <!-- Arrow Bridge 1 -->
    <g transform="translate(300, 160)">
      <circle cx="25" cy="30" r="28" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="25" y="36" font-family="sans-serif" font-size="20" fill="#fbbf24" text-anchor="middle">→</text>
      <text x="25" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">Algorithmus</text>
    </g>

    <!-- Step 2: Offset Calculation (The Engine) -->
    <g transform="translate(370, 0)" filter="url(#boxShadow)">
      <rect width="280" height="380" rx="20" fill="url(#boxGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="85" y="37" font-family="sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">2. UMRECHNUNG</text>

      <text x="140" y="105" font-family="sans-serif" font-size="28" font-weight="800" fill="#fbbf24" text-anchor="middle">⚙️</text>
      <text x="140" y="145" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Offset: +119743</text>
      <text x="140" y="172" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Math Alphanumeric Block</text>

      <line x1="25" y1="205" x2="255" y2="205" stroke="#f59e0b" stroke-opacity="0.2"/>

      <g transform="translate(25, 230)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#fbbf24">Unicode-Standard:</text>
        <text y="24">• Block U+1D400 bis U+1D7FF</text>
        <text y="48">• Feste Glyphen im System</text>
        <text y="72">• Echtzeit-Mapping im Browser</text>
      </g>
    </g>

    <!-- Arrow Bridge 2 -->
    <g transform="translate(670, 160)">
      <circle cx="25" cy="30" r="28" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="36" font-family="sans-serif" font-size="20" fill="#34d399" text-anchor="middle">→</text>
      <text x="25" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Kopierbar</text>
    </g>

    <!-- Step 3: Bold Unicode Output -->
    <g transform="translate(740, 0)" filter="url(#boxShadow)">
      <rect width="260" height="380" rx="20" fill="url(#boxGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="110" height="26" rx="8" fill="#10b981" fill-opacity="0.2"/>
      <text x="75" y="37" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">3. FETT TEXT 📋</text>

      <text x="130" y="110" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#34d399" text-anchor="middle">𝐀</text>
      <text x="130" y="150" font-family="monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Codepoint: U+1D400</text>
      <text x="130" y="175" font-family="sans-serif" font-size="12" fill="#34d399" text-anchor="middle">MATHEMATICAL BOLD A</text>

      <line x1="25" y1="205" x2="235" y2="205" stroke="#10b981" stroke-opacity="0.2"/>

      <g transform="translate(25, 230)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#34d399">Echtes Zeichen:</text>
        <text y="24"><tspan fill="#34d399">✓</tspan> Bleibt dauerhaft fett</text>
        <text y="48"><tspan fill="#34d399">✓</tspan> 1-Klick in Zwischenablage</text>
        <text y="72"><tspan fill="#34d399">✓</tspan> Sofort einfügbar</text>
      </g>
    </g>

  </g>
</svg>

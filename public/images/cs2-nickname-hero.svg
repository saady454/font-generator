<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="cs2HeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cs2GoldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#de9b35"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cs2GoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cs2CardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#cs2HeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="220" r="300" fill="#f59e0b" fill-opacity="0.10"/>
  <circle cx="940" cy="450" r="280" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="600" cy="300" r="220" fill="#818cf8" fill-opacity="0.05"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-200" y="-18" width="400" height="36" rx="18" fill="#201810" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">💣 CS2 TACTICAL NICKNAME STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Counter-Strike 2 Nickname: <tspan fill="url(#cs2GoldBlue)">Coole CS2 Namen</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Finde deinen perfekten Steam- &amp; Premier-Namen für das Scoreboard &amp; Killfeed
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#cs2CardShadow)">
    <rect width="1020" height="420" rx="28" fill="#131926" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#090d15" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: CS2 Premier Profile Card Mockup -->
    <g transform="translate(50, 45)">
      <rect width="280" height="330" rx="20" fill="#151e30" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      
      <!-- Avatar &amp; Profile Header -->
      <g transform="translate(18, 18)">
        <circle cx="24" cy="24" r="23" fill="none" stroke="url(#cs2GoldBlue)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="20" fill="#1f293d"/>
        <text x="24" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🎯</text>
        <text x="58" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">ShadowTap</text>
        <text x="58" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Premier 24,500 ★ Global</text>
      </g>

      <!-- Stats Bar -->
      <g transform="translate(18, 70)" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
        <text x="20" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ffffff">1.38</tspan><tspan dy="12" x="20">K/D Rate</tspan></text>
        <text x="115" y="12" text-anchor="middle"><tspan font-weight="800" fill="#38bdf8">74.2%</tspan><tspan dy="12" x="115">HS-Rate</tspan></text>
        <text x="205" y="12" text-anchor="middle"><tspan font-weight="800" fill="#fbbf24">18</tspan><tspan dy="12" x="205">MVP Stars ★</tspan></text>
      </g>

      <!-- Display Name Simulation -->
      <g transform="translate(18, 110)">
        <rect width="244" height="135" rx="10" fill="#090d15" stroke="#f59e0b" stroke-opacity="0.3"/>
        
        <text x="12" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="1">STEAM PROFILNAME (CS2)</text>
        <text x="12" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#ffffff">ShadowTap</text>
        
        <rect x="12" y="70" width="220" height="24" rx="6" fill="#1b2438"/>
        <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">✓ 100% Killfeed Lesbar</text>
        <text x="145" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">✓ Pro Verified</text>
        
        <text x="12" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Steam-Status: Bereit für Premier 🛡️</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(18, 260)">
        <rect width="244" height="34" rx="8" fill="url(#cs2GoldBlue)"/>
        <text x="122" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">In Steam einfügen 📋</text>
      </g>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(365, 45)">
      <rect width="605" height="330" rx="20" fill="#151e30" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24" letter-spacing="1">CS2 NAME EINGEBEN</text>
        <rect x="0" y="24" width="555" height="42" rx="10" fill="#090d15" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Shadow</text>
        <rect x="465" y="32" width="80" height="26" rx="6" fill="url(#cs2GoldBlue)"/>
        <text x="505" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Generieren ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Style 1: Competitive -->
        <g transform="translate(0, 0)">
          <rect width="265" height="46" rx="10" fill="#1b2438" stroke="#f59e0b" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">COMPETITIVE (PRO-AIM)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">AimCore</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Kopie</text>
        </g>

        <!-- Style 2: Aggressiv -->
        <g transform="translate(285, 0)">
          <rect width="270" height="46" rx="10" fill="#1b2438" stroke="#ef4444" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f87171">AGGRESSIV (RUSH / FURY)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">RushFury</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ef4444" fill-opacity="0.2"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171">Kopie</text>
        </g>

        <!-- Style 3: Tactical -->
        <g transform="translate(0, 56)">
          <rect width="265" height="46" rx="10" fill="#1b2438" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">TACTICAL (SMOKE / MIND)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">SmokeMind</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 4: AWP -->
        <g transform="translate(285, 56)">
          <rect width="270" height="46" rx="10" fill="#1b2438" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">AWP (PRÄZISE &amp; FOKUS)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">FrostAWP</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 5: Clutch -->
        <g transform="translate(0, 112)">
          <rect width="265" height="46" rx="10" fill="#1b2438" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc">CLUTCH (LAST ROUND)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">LastRound</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 6: Stylish / Symbole -->
        <g transform="translate(285, 112)">
          <rect width="270" height="46" rx="10" fill="#1b2438" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#a78bfa">STYLISH (SYMBOLISCH)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">亗 Vex 亗</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Full width Bottom CTA -->
        <g transform="translate(0, 168)">
          <rect width="555" height="46" rx="10" fill="url(#cs2GoldBlue)"/>
          <text x="277" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">💣 500+ Counter-Strike 2 Namen &amp; Clantags kostenlos generieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

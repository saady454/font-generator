          <rect y="120" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="152" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">💖 Love 💖</text>
          <text x="430" y="152" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Glitzer-Emoji</text>

          <rect y="180" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="212" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f472b6">❥ Hallo ❥</text>
          <text x="430" y="212" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Filigran</text>


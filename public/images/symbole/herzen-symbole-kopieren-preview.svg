<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="heartPrevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="50%" stop-color="#1f0918"/>
      <stop offset="100%" stop-color="#050312"/>
    </linearGradient>
    <linearGradient id="heartPrevGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="heartPrevShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#heartPrevBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#ec4899" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#f43f5e" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ec4899" letter-spacing="2">♥ HERZ-SYMBOLE &amp; EMOJIS</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Romantische <tspan fill="url(#heartPrevGrad)">Herzen zum Kopieren</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Textzeichen ♥, Kontur-Herzen ♡ und bunte Emojis für Chats, Bios und Profile
    </text>
  </g>

  <!-- Heart Grid Cards -->
  <g transform="translate(80, 150)">
    

        <text x="95" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ec4899">1-KLICK HERZ-SAMMLUNG</text>

        <!-- Heart Pill Matrix -->
        <g transform="translate(0, 45)">
          <g transform="translate(0, 0)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#ec4899">♥</text>
          </g>
          <g transform="translate(115, 0)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#ec4899">♡</text>
          </g>
          <g transform="translate(230, 0)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#ec4899">❤</text>
          </g>
          <g transform="translate(345, 0)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#ec4899">❥</text>
          </g>

          <g transform="translate(0, 75)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#f472b6">❣</text>
          </g>
          <g transform="translate(115, 75)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#f472b6">💖</text>
          </g>
          <g transform="translate(230, 75)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#f472b6">💕</text>
          </g>
          <g transform="translate(345, 75)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#f472b6">💓</text>
          </g>

          <g transform="translate(0, 150)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fda4af">💗</text>
          </g>
          <g transform="translate(115, 150)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fda4af">💘</text>
          </g>
          <g transform="translate(230, 150)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fda4af">💝</text>
          </g>
          <g transform="translate(345, 150)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#ec4899" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fda4af">💟</text>
          </g>
        </g>

        <rect y="350" width="450" height="38" rx="8" fill="#1e293b"/>
        <text x="225" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ec4899">Sowohl Schwarz/Weiß als auch bunte Emojis</text>
      </g>
    </g>

    <!-- Right Box: Praxis-Kombinationen -->
    <g transform="translate(540, 0)" filter="url(#heartPrevShadow)">

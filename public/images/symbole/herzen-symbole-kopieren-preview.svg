        <text x="225" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ec4899">Einsatz: WhatsApp Status, TikTok Bio, Instagram &amp; Discord</text>
      </g>

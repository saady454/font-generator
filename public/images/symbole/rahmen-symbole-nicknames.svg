<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="framePrevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="50%" stop-color="#140a26"/>
      <stop offset="100%" stop-color="#050312"/>
    </linearGradient>
    <linearGradient id="framePrevGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="framePrevShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#framePrevBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#a855f7" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#a855f7" letter-spacing="2">꧁ RAHMEN &amp; KLAMMERN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Dekorative <tspan fill="url(#framePrevGrad)">Rahmen für Nicknames</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Flügel, asiatische Klammern und Schmuckzeichen für Gaming-Tags und Profilnamen
    </text>
  </g>

  <!-- Frame Grid Cards -->
  <g transform="translate(80, 150)">
    
    <!-- Left Box: Einzelzeichen Matrix -->
    <g transform="translate(0, 0)" filter="url(#framePrevShadow)">
      <rect width="500" height="440" rx="20" fill="#111827" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="190" height="26" rx="6" fill="#a855f7" fill-opacity="0.15"/>
        <text x="95" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a855f7">1-KLICK RAHMEN-PAARE</text>

        <!-- Frame Pill Matrix -->
        <g transform="translate(0, 45)">
          <g transform="translate(0, 0)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#c084fc">꧁ ꧂</text>
          </g>
          <g transform="translate(155, 0)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#c084fc">༺ ༻</text>
          </g>
          <g transform="translate(310, 0)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#c084fc">『 』</text>
          </g>

          <g transform="translate(0, 75)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#e9d5ff">〖 〗</text>
          </g>
          <g transform="translate(155, 75)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#e9d5ff">〔 〕</text>
          </g>
          <g transform="translate(310, 75)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#e9d5ff">⟦ ⟧</text>
          </g>

          <g transform="translate(0, 150)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#a855f7">【 】</text>
          </g>
          <g transform="translate(155, 150)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#a855f7">〚 〛</text>
          </g>
          <g transform="translate(310, 150)">
            <rect width="140" height="60" rx="12" fill="#080d1a" stroke="#a855f7" stroke-opacity="0.2"/>
            <text x="70" y="38" text-anchor="middle" font-size="20" fill="#a855f7">⫷ ⫸</text>
          </g>
        </g>

        <rect y="350" width="450" height="38" rx="8" fill="#1e293b"/>
        <text x="225" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a855f7">Symmetrische Rahmen für jeden Text</text>
      </g>
    </g>

    <!-- Right Box: Praxis-Kombinationen -->
    <g transform="translate(540, 0)" filter="url(#framePrevShadow)">
      <rect width="500" height="440" rx="20" fill="#111827" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="210" height="26" rx="6" fill="#a855f7" fill-opacity="0.15"/>
        <text x="105" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a855f7">BELIEBTE GAMING-TAGS</text>

        <g transform="translate(0, 45)">
          
          <rect y="0" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="32" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">꧁𝓓𝓪𝓻𝓴꧂</text>
          <text x="430" y="32" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Engelsflügel</text>

          <rect y="60" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="92" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#c084fc">༺★ Gamer ★༻</text>
          <text x="430" y="92" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Sterne &amp; Flügel</text>

          <rect y="120" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="152" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">『𝓝𝓲𝓬𝓴』</text>
          <text x="430" y="152" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Japanische Ecke</text>

          <rect y="180" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="212" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#e9d5ff">【👑 King 👑】</text>
          <text x="430" y="212" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Krone &amp; Kasten</text>

          <rect y="240" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="272" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#a855f7">⫷ Shadow_Hunter ⫸</text>
          <text x="430" y="272" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Pfeil-Klammern</text>

        </g>

        <rect y="350" width="450" height="38" rx="8" fill="#1e293b"/>
        <text x="225" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a855f7">Einsatz: Fortnite, Free Fire, Discord &amp; Clan-Namen</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="starPrevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="50%" stop-color="#181308"/>
      <stop offset="100%" stop-color="#050312"/>
    </linearGradient>
    <linearGradient id="starPrevGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="starPrevShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#starPrevBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#fbbf24" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#f59e0b" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">★ STERN-SYMBOLE</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Klassische &amp; dekorative <tspan fill="url(#starPrevGrad)">Sterne zum Kopieren</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Beliebte Zeichen für Profilnamen, Bewertungen ★★★★★ und Bio-Trenner
    </text>
  </g>

  <!-- Star Grid Cards -->
  <g transform="translate(80, 150)">
    
    <!-- Left Box: Einzelzeichen Matrix -->
    <g transform="translate(0, 0)" filter="url(#starPrevShadow)">
      <rect width="500" height="440" rx="20" fill="#111827" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="190" height="26" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="95" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">1-KLICK EINZELZEICHEN</text>

        <!-- Star Pill Matrix -->
        <g transform="translate(0, 45)">
          <g transform="translate(0, 0)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fbbf24">★</text>
          </g>
          <g transform="translate(115, 0)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fbbf24">☆</text>
          </g>
          <g transform="translate(230, 0)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fbbf24">✦</text>
          </g>
          <g transform="translate(345, 0)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fbbf24">✧</text>
          </g>

          <g transform="translate(0, 75)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fef08a">✩</text>
          </g>
          <g transform="translate(115, 75)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fef08a">✪</text>
          </g>
          <g transform="translate(230, 75)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fef08a">✫</text>
          </g>
          <g transform="translate(345, 75)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fef08a">✨</text>
          </g>

          <g transform="translate(0, 150)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fbbf24">✬</text>
          </g>
          <g transform="translate(115, 150)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fbbf24">✭</text>
          </g>
          <g transform="translate(230, 150)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fbbf24">✮</text>
          </g>
          <g transform="translate(345, 150)">
            <rect width="95" height="60" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
            <text x="47" y="40" text-anchor="middle" font-size="28" fill="#fbbf24">✯</text>
          </g>
        </g>

        <rect y="350" width="450" height="38" rx="8" fill="#1e293b"/>
        <text x="225" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Kopieren per Klick &amp;bull; Funktioniert überall</text>
      </g>
    </g>

    <!-- Right Box: Praxis-Kombinationen -->
    <g transform="translate(540, 0)" filter="url(#starPrevShadow)">
      <rect width="500" height="440" rx="20" fill="#111827" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="210" height="26" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="105" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">BELIEBTE KOMBINATIONEN</text>

        <g transform="translate(0, 45)" space="y-3">
          
          <rect y="0" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">★ Dein Name ★</text>
          <text x="430" y="32" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Klassisch</text>

          <rect y="60" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="92" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24">✦ Dein Name ✦</text>
          <text x="430" y="92" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Modern Pro</text>

          <rect y="120" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="152" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">☆ 𝓝𝓪𝓶𝓮 ☆</text>
          <text x="430" y="152" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Kursive Schrift</text>

          <rect y="180" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="212" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fef08a">✨ Dreamer ✨</text>
          <text x="430" y="212" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Aesthetic Bio</text>

          <rect y="240" width="450" height="50" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
          <text x="20" y="272" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24">★★★★★</text>
          <text x="430" y="272" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">5-Sterne Rating</text>

        </g>

        <rect y="350" width="450" height="38" rx="8" fill="#1e293b"/>
        <text x="225" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Einsatz: Instagram Bio, Valorant, Discord &amp; WhatsApp</text>
      </g>
    </g>

  </g>
</svg>

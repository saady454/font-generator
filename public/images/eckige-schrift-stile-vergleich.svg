<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="compBgBox6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#101426"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <filter id="tileShadowBox6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#compBgBox6)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="160" r="220" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="1000" cy="480" r="240" fill="#818cf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">6 ECKIGE STILE IM VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Die wichtigsten <tspan fill="#38bdf8">eckigen Schriftstile</tspan> im Überblick
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Schwarze Boxen, Weiße Rahmen, Monospace, Fullwidth, Blockschrift und Doppellinien
    </text>
  </g>

  <!-- 6 Grid Cards (2 rows of 3) -->
  <g transform="translate(60, 145)">
    
    <!-- Row 1, Col 1: Schwarze Boxen -->
    <g transform="translate(0, 0)" filter="url(#tileShadowBox6)">
      <rect width="345" height="225" rx="14" fill="#121728" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="15" y="15" width="135" height="22" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="82" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">SCHWARZE BOXEN</text>
      
      <rect x="15" y="45" width="315" height="65" rx="8" fill="#080c16"/>
      <text x="172" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff">🅴🅲🅺🅸🅶</text>

      <g transform="translate(15, 125)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#cbd5e1" font-weight="400">Stark und auffällig</tspan></text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Geeignet für: <tspan fill="#cbd5e1" font-weight="400">Nicknames, kurze Namen</tspan></text>
      </g>
    </g>

    <!-- Row 1, Col 2: Weiße Boxen -->
    <g transform="translate(365, 0)" filter="url(#tileShadowBox6)">
      <rect width="345" height="225" rx="14" fill="#121728" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="15" y="15" width="125" height="22" rx="6" fill="#818cf8" fill-opacity="0.15"/>
      <text x="77" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a5b4fc">WEISSE BOXEN</text>
      
      <rect x="15" y="45" width="315" height="65" rx="8" fill="#080c16"/>
      <text x="172" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">🄴🄲🄺🄸🄶</text>

      <g transform="translate(15, 125)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#cbd5e1" font-weight="400">Klar und modern</tspan></text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Geeignet für: <tspan fill="#cbd5e1" font-weight="400">Bios, Profile, Trenner</tspan></text>
      </g>
    </g>

    <!-- Row 1, Col 3: Monospace -->
    <g transform="translate(730, 0)" filter="url(#tileShadowBox6)">
      <rect width="345" height="225" rx="14" fill="#121728" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="15" y="15" width="115" height="22" rx="6" fill="#34d399" fill-opacity="0.15"/>
      <text x="72" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399">MONOSPACE</text>
      
      <rect x="15" y="45" width="315" height="65" rx="8" fill="#080c16"/>
      <text x="172" y="88" text-anchor="middle" font-family="monospace, Courier" font-size="22" font-weight="700" fill="#34d399">𝚎𝚌𝚔𝚒𝚐_𝚌𝚘𝚍𝚎</text>

      <g transform="translate(15, 125)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#cbd5e1" font-weight="400">Technisch und ruhig</tspan></text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Geeignet für: <tspan fill="#cbd5e1" font-weight="400">Gaming, Tech-Themen</tspan></text>
      </g>
    </g>

    <!-- Row 2, Col 1: Fullwidth -->
    <g transform="translate(0, 245)" filter="url(#tileShadowBox6)">
      <rect width="345" height="225" rx="14" fill="#121728" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="15" y="15" width="115" height="22" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="72" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24">FULLWIDTH</text>
      
      <rect x="15" y="45" width="315" height="65" rx="8" fill="#080c16"/>
      <text x="172" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fbbf24">ｅｃｋｉｇ</text>

      <g transform="translate(15, 125)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#cbd5e1" font-weight="400">Breit und präsent</tspan></text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Geeignet für: <tspan fill="#cbd5e1" font-weight="400">Überschriften, kurze Texte</tspan></text>
      </g>
    </g>

    <!-- Row 2, Col 2: Blockschrift -->
    <g transform="translate(365, 245)" filter="url(#tileShadowBox6)">
      <rect width="345" height="225" rx="14" fill="#121728" stroke="#f472b6" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="15" y="15" width="125" height="22" rx="6" fill="#f472b6" fill-opacity="0.15"/>
      <text x="77" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f472b6">BLOCKSCHRIFT</text>
      
      <rect x="15" y="45" width="315" height="65" rx="8" fill="#080c16"/>
      <text x="172" y="88" text-anchor="middle" font-family="Impact, sans-serif" font-size="24" font-weight="900" fill="#ffffff">【 ＥＣＫＩＧ 】</text>

      <g transform="translate(15, 125)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#cbd5e1" font-weight="400">Kräftig und direkt</tspan></text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">Geeignet für: <tspan fill="#cbd5e1" font-weight="400">Namen und Highlights</tspan></text>
      </g>
    </g>

    <!-- Row 2, Col 3: Doppellinien -->
    <g transform="translate(730, 245)" filter="url(#tileShadowBox6)">
      <rect width="345" height="225" rx="14" fill="#121728" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="15" y="15" width="125" height="22" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="77" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">DOPPELLINIEN</text>
      
      <rect x="15" y="45" width="315" height="65" rx="8" fill="#080c16"/>
      <text x="172" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">𝕖𝕔𝕜𝕚𝕘</text>

      <g transform="translate(15, 125)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#cbd5e1" font-weight="400">Dekorativ &amp; geometrisch</tspan></text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Geeignet für: <tspan fill="#cbd5e1" font-weight="400">Social-Media-Profile</tspan></text>
      </g>
    </g>

  </g>
</svg>

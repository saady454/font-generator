<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="starHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080914"/>
      <stop offset="50%" stop-color="#121630"/>
      <stop offset="100%" stop-color="#060710"/>
    </linearGradient>
    <linearGradient id="starGoldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="starIndigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="starCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#starHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="220" r="300" fill="#fbbf24" fill-opacity="0.10"/>
  <circle cx="940" cy="450" r="280" fill="#818cf8" fill-opacity="0.10"/>
  <circle cx="600" cy="300" r="220" fill="#ec4899" fill-opacity="0.04"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e1f38" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">✨ STERNE SYMBOLE STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Sterne Symbole: <tspan fill="url(#starGoldGlow)">★ ☆ ✦ ✧ ⭐ zum Kopieren</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Schöne Sternzeichen, Bewertungssterne &amp; Emojis mit 1 Klick in die Zwischenablage
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#starCardShadow)">
    <rect width="1020" height="420" rx="28" fill="#13172e" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#080a15" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Star Showcase Card Mockup -->
    <g transform="translate(50, 45)">
      <rect width="280" height="330" rx="20" fill="#171b36" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <g transform="translate(18, 18)">
        <circle cx="24" cy="24" r="23" fill="none" stroke="url(#starGoldGlow)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="20" fill="#22284d"/>
        <text x="24" y="32" text-anchor="middle" font-size="18" fill="#fbbf24">★</text>
        <text x="58" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">Sternzeichen</text>
        <text x="58" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">1-Klick Copy &amp; Paste</text>
      </g>

      <!-- Symbol Quick Display Grid -->
      <g transform="translate(18, 70)">
        <rect width="244" height="175" rx="12" fill="#0b0d1e" stroke="#fbbf24" stroke-opacity="0.25"/>
        
        <text x="12" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="1">BELIEBTE STERNE</text>
        
        <!-- Big Stars Display -->
        <g transform="translate(12, 38)" font-size="28">
          <text x="15" y="30" fill="#ffffff">★</text>
          <text x="65" y="30" fill="#94a3b8">☆</text>
          <text x="115" y="30" fill="#38bdf8">✦</text>
          <text x="165" y="30" fill="#c084fc">✧</text>

          <text x="15" y="75" fill="#ffffff">✩</text>
          <text x="65" y="75" fill="#fbbf24">✪</text>
          <text x="115" y="75" fill="#f472b6">✮</text>
          <text x="165" y="75" fill="#fbbf24">⭐</text>
        </g>

        <!-- Rating Stars -->
        <rect x="12" y="132" width="220" height="30" rx="8" fill="#1a1e3b"/>
        <text x="122" y="152" text-anchor="middle" font-size="14" fill="#fbbf24">★★★★★ <tspan fill="#94a3b8" font-size="11">5/5 Rating</tspan></text>
      </g>

      <!-- Action Button -->
      <g transform="translate(18, 265)">
        <rect width="244" height="36" rx="10" fill="url(#starGoldGlow)"/>
        <text x="122" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0b0d1e">★ Symbol kopiert! 📋</text>
      </g>
    </g>

    <!-- Right: Star Generator &amp; Categories Showcase Card -->
    <g transform="translate(365, 45)">
      <rect width="605" height="330" rx="20" fill="#171b36" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24" letter-spacing="1">TEXT MIT STERNEN DEKORIEREN</text>
        <rect x="0" y="24" width="555" height="42" rx="10" fill="#080a15" stroke="#fbbf24" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Sarah</text>
        <rect x="445" y="32" width="100" height="26" rx="6" fill="url(#starGoldGlow)"/>
        <text x="495" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0b0d1e">★ Kopieren</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Combination 1: Minimal -->
        <g transform="translate(0, 0)">
          <rect width="265" height="46" rx="10" fill="#1f2549" stroke="#fbbf24" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">MINIMALER SCHWARZER STERN</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">★ Sarah ★</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#fbbf24" fill-opacity="0.2"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Kopie</text>
        </g>

        <!-- Combination 2: Weißer Stern -->
        <g transform="translate(285, 0)">
          <rect width="270" height="46" rx="10" fill="#1f2549" stroke="#38bdf8" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">DEZENTER WEISSER STERN</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">☆ Sarah ☆</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Kopie</text>
        </g>

        <!-- Combination 3: Vierzackig -->
        <g transform="translate(0, 56)">
          <rect width="265" height="46" rx="10" fill="#1f2549" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc">VIERZACKIGER STERN (AESTHETIC)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">✦ Sarah ✦</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Combination 4: Schöne Flügel -->
        <g transform="translate(285, 56)">
          <rect width="270" height="46" rx="10" fill="#1f2549" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f472b6">FLÜGEL &amp; STERNE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">★彡 Sarah 彡★</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Combination 5: Mond &amp; Sterne -->
        <g transform="translate(0, 112)">
          <rect width="265" height="46" rx="10" fill="#1f2549" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">KOSMISCHE SYMBOLE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">⋆｡°✩ Sarah ✩°｡⋆</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Combination 6: Funkelnde Emojis -->
        <g transform="translate(285, 112)">
          <rect width="270" height="46" rx="10" fill="#1f2549" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">EMOJIS &amp; GLOW</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">⭐ Sarah 🌟</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Full width Bottom CTA -->
        <g transform="translate(0, 168)">
          <rect width="555" height="46" rx="10" fill="url(#starGoldGlow)"/>
          <text x="277" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#0b0d1e">✨ Über 100+ Sterne Symbole &amp; Kombinationen jetzt kopieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

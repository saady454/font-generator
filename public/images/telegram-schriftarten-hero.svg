<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tgHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0a1426"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="tgCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE"/>
      <stop offset="100%" stop-color="#229ED9"/>
    </linearGradient>
    <linearGradient id="tgAccentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2AABEE"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="tgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#tgHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="280" fill="#229ED9" fill-opacity="0.10"/>
  <circle cx="920" cy="460" r="300" fill="#7dd3fc" fill-opacity="0.06"/>
  <circle cx="600" cy="340" r="200" fill="#0284c7" fill-opacity="0.05"/>

  <!-- Top Header Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#0f1f38" stroke="#229ED9" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" letter-spacing="2">✈️ TELEGRAM SCHRIFTEN STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Telegram Schriftarten: <tspan fill="url(#tgAccentLight)">Stylische Texte zum Kopieren</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Fette, kursive, Gothic- &amp; Bubble-Stile für Chats, Gruppen-Überschriften, Kanäle &amp; Bio
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#tgShadow)">
    <rect width="1020" height="420" rx="28" fill="#0c1424" stroke="#229ED9" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#060b16" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Telegram Chat View Mockup Card -->
    <g transform="translate(50, 45)">
      <rect width="280" height="330" rx="20" fill="#0e1a2f" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      
      <!-- Chat Header -->
      <g transform="translate(18, 18)">
        <circle cx="20" cy="20" r="18" fill="url(#tgCyanGrad)"/>
        <text x="20" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">✈️</text>
        <text x="48" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Alex &amp;bull; 𝗞𝗮𝗻𝗮𝗹-𝗔𝗱𝗺𝗶𝗻</text>
        <text x="48" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">online &amp;bull; @alex_vip</text>
      </g>

      <!-- Message Bubbles -->
      <!-- Message 1 (Received) -->
      <g transform="translate(15, 70)">
        <rect width="220" height="48" rx="12" fill="#16233b" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">📢 𝗪𝗶𝗰𝗵𝘁𝗶𝗴𝗲 𝗔𝗻𝗸ü𝗻𝗱𝗶𝗴𝘂𝗻𝗴:</text>
        <text x="12" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">Community Call startet um 20:00 Uhr!</text>
      </g>

      <!-- Message 2 (Sent with Unicode Styling) -->
      <g transform="translate(45, 130)">
        <rect width="220" height="70" rx="12" fill="#1e3a5f" stroke="#229ED9" stroke-opacity="0.4"/>
        <text x="12" y="22" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#ffffff">𝔊𝔬𝔱𝔦𝔰𝔠𝔥 &amp;bull; 𝘒𝘶𝘳𝘴𝘪𝘷 &amp;bull; 𝙼𝚘𝚗𝚘</text>
        <text x="12" y="42" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#bae6fd">„𝘗𝘦𝘳𝘧𝘦𝘬𝘵 𝘧ü𝘳 𝘒𝘢𝘯ä𝘭𝘦 &amp; 𝘎𝘳𝘶𝘱𝘱𝘦𝘯“</text>
        <text x="175" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#7dd3fc">19:42 ✓✓</text>
      </g>

      <!-- Message 3 (Bubble / Fun) -->
      <g transform="translate(15, 212)">
        <rect width="250" height="44" rx="12" fill="#16233b" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="12" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Ⓣⓔⓛⓔⓖⓡⓐⓜ Ⓢⓣⓨⓛⓔ ✨</text>
      </g>

      <!-- Input Field Simulation -->
      <g transform="translate(15, 275)">
        <rect width="250" height="36" rx="18" fill="#0a101d" stroke="#229ED9" stroke-opacity="0.3"/>
        <text x="18" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Nachricht schreiben...</text>
        <circle cx="230" cy="18" r="12" fill="#229ED9"/>
        <text x="230" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">➤</text>
      </g>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(365, 45)">
      <rect width="605" height="330" rx="20" fill="#0d182b" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" letter-spacing="1">EINGABETEXT</text>
        <rect x="0" y="24" width="555" height="42" rx="10" fill="#060c18" stroke="#229ED9" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Telegram Chat</text>
        <rect x="475" y="32" width="70" height="26" rx="6" fill="#229ED9"/>
        <text x="510" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Live ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Style 1: Fett Sans -->
        <g transform="translate(0, 0)">
          <rect width="265" height="46" rx="10" fill="#13233c" stroke="#229ED9" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#7dd3fc">FETT (ÜBERSCHRIFTEN)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">𝗧𝗲𝗹𝗲𝗴𝗿𝗮𝗺 𝗖𝗵𝗮𝘁</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#229ED9" fill-opacity="0.2"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">Kopie</text>
        </g>

        <!-- Style 2: Kursiv -->
        <g transform="translate(285, 0)">
          <rect width="270" height="46" rx="10" fill="#13233c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">KURSIV (BETONUNG)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-style="italic" font-weight="600" fill="#ffffff">𝘛𝘦𝘭𝘦𝘨𝘳𝘢𝘮 𝘊𝘩𝘢𝘵</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 3: Gothic / Fraktur -->
        <g transform="translate(0, 56)">
          <rect width="265" height="46" rx="10" fill="#13233c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">GOTISCH / FRAKTUR</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝔗𝔢𝔩𝔢𝔤𝔯𝔞𝔪 ℭ𝔥𝔞𝔱</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 4: Monospace -->
        <g transform="translate(285, 56)">
          <rect width="270" height="46" rx="10" fill="#13233c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">MONOSPACE</text>
          <text x="12" y="36" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#ffffff">𝚃𝚎𝚕𝚎𝚐𝚛𝚊𝚖 𝙲𝚑𝚊𝚝</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 5: Bubble -->
        <g transform="translate(0, 112)">
          <rect width="265" height="46" rx="10" fill="#13233c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f472b6">BUBBLE / KREISE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Ⓣⓔⓛⓔⓖⓡⓐⓜ Ⓒⓗⓐⓣ</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 6: Script -->
        <g transform="translate(285, 112)">
          <rect width="270" height="46" rx="10" fill="#13233c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc">SCRIPT / DEKORATIV</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝓣𝓮𝓵𝓮𝓰𝓻𝓪𝓶 𝓒𝓱𝓪𝓽</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Full width Bottom CTA -->
        <g transform="translate(0, 168)">
          <rect width="555" height="46" rx="10" fill="#229ED9"/>
          <text x="277" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">⚡ 500+ Stile für Telegram im Schriftarten Generator ausprobieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBgHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#121426"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="flowGradHand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="cardShadowHand" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#flowBgHand)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#c084fc" fill-opacity="0.08"/>
  <circle cx="1000" cy="480" r="240" fill="#f472b6" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#d8b4fe" letter-spacing="2">3-SCHRITTE-WORKFLOW</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Handschrift online <tspan fill="url(#flowGradHand)">erstellen &amp; kopieren</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      In wenigen Sekunden vom normalen Text zum geschwungenen Handschrift-Design
    </text>
  </g>

  <!-- 3 Step Flow Columns Grid -->
  <g transform="translate(70, 160)">
    
    <!-- Step 1: Text eingeben -->
    <g transform="translate(0, 0)" filter="url(#cardShadowHand)">
      <rect width="335" height="440" rx="22" fill="#121526" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="25" y="24" width="130" height="28" rx="14" fill="#c084fc" fill-opacity="0.15"/>
      <text x="90" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#d8b4fe">1. TEXT EINGEBEN</text>

      <rect x="20" y="70" width="295" height="130" rx="14" fill="#080a12" stroke="#c084fc" stroke-opacity="0.2"/>
      <text x="20" y="30" transform="translate(20, 70)" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c084fc">NORMALER INPUT</text>
      <text x="20" y="75" transform="translate(20, 70)" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Schöne Grüße</text>
      <line x1="40" y1="160" x2="165" y2="160" stroke="#c084fc" stroke-dasharray="3 3"/>

      <g transform="translate(25, 230)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#d8b4fe">ANLEITUNG:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Namen, Zitate oder Grüße tippen</text>
        <text x="0" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Automatische Echtzeit-Vorschau</text>
        <text x="0" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Keine Registrierung nötig</text>
      </g>

      <rect x="20" y="340" width="295" height="75" rx="12" fill="#171a2e"/>
      <text x="35" y="368" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">Tipp:</text>
      <text x="35" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Kurze Worte wirken am elegantesten</text>
    </g>

    <!-- Step 2: Stil auswählen -->
    <g transform="translate(365, 0)" filter="url(#cardShadowHand)">
      <rect width="335" height="440" rx="22" fill="#121526" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="25" y="24" width="140" height="28" rx="14" fill="#f472b6" fill-opacity="0.15"/>
      <text x="95" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">2. STIL AUSWÄHLEN</text>

      <rect x="20" y="70" width="295" height="130" rx="14" fill="#080a12" stroke="#f472b6" stroke-opacity="0.2"/>
      <text x="20" y="30" transform="translate(20, 70)" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f472b6">SCHÖNE VORSCHAUEN</text>
      <text x="20" y="65" transform="translate(20, 70)" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#ffffff">𝒮𝒸𝒽ö𝓃𝑒 𝒢𝓇üß𝑒</text>
      <text x="20" y="100" transform="translate(20, 70)" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f472b6">𝓢𝓬𝓱𝓸𝓮𝓷𝓮 𝓖𝓻𝓾𝓮𝓼𝓼𝓮</text>

      <g transform="translate(25, 230)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6">ANLEITUNG:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Kalligrafie, Script &amp; Brush</text>
        <text x="0" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Lesbarkeit und Schwung prüfen</text>
        <text x="0" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Passenden Look finden</text>
      </g>

      <rect x="20" y="340" width="295" height="75" rx="12" fill="#171a2e"/>
      <text x="35" y="368" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">Vielfalt:</text>
      <text x="35" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Über 10 verschiedene Schriftstile</text>
    </g>

    <!-- Step 3: Kopieren &amp; Einfügen -->
    <g transform="translate(730, 0)" filter="url(#cardShadowHand)">
      <rect width="335" height="440" rx="22" fill="#121526" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="25" y="24" width="160" height="28" rx="14" fill="#22c55e" fill-opacity="0.15"/>
      <text x="105" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#4ade80">3. KOPIEREN &amp; NUTZEN</text>

      <rect x="20" y="70" width="295" height="130" rx="14" fill="#080a12" stroke="#22c55e" stroke-opacity="0.2"/>
      <rect x="40" y="105" width="255" height="45" rx="10" fill="#22c55e"/>
      <text x="167" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">📋 1-KLICK KOPIEREN</text>
      <text x="167" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#22c55e">✓ Sofort in Zwischenablage</text>

      <g transform="translate(25, 230)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">ANLEITUNG:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Klick auf Kopieren</text>
        <text x="0" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Einfügen in Instagram Bio</text>
        <text x="0" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Nutzen in WhatsApp &amp; TikTok</text>
      </g>

      <rect x="20" y="340" width="295" height="75" rx="12" fill="#171a2e"/>
      <text x="35" y="368" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ade80">Sofort startklar:</text>
      <text x="35" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Funktioniert überall ohne Installation</text>
    </g>

  </g>
</svg>

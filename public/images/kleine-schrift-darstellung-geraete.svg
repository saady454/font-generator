<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="renderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121626"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <filter id="renderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#renderBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="300" r="260" fill="#22c55e" fill-opacity="0.08"/>
  <circle cx="920" cy="300" r="260" fill="#ef4444" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#a5b4fc" letter-spacing="2">UNICODE-RENDERING IM CHECK</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Geräte-Kompatibilität bei <tspan fill="#818cf8">kleinen Buchstaben</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Warum nicht jedes System jedes hoch- oder tiefgestellte Sonderzeichen gleichermaßen unterstützt
    </text>
  </g>

  <!-- Comparison Split Screen (Left: Supported / Right: Missing Glyph Fallback) -->
  <g transform="translate(80, 160)">
    
    <!-- LEFT CARD: Modernes System (Vollständig unterstützt) -->
    <g transform="translate(0, 0)" filter="url(#renderGlow)">
      <rect width="500" height="420" rx="24" fill="#141828" stroke="#22c55e" stroke-opacity="0.35" stroke-width="1.5"/>
      
      <!-- Top Badge -->
      <rect x="25" y="24" width="220" height="28" rx="14" fill="#22c55e" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#4ade80">✓ MODERNE BROWSER &amp; APPS</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e" font-weight="700">100% Rendering</text>

      <!-- Visual Display Screen Mockup -->
      <rect x="25" y="68" width="450" height="150" rx="16" fill="#0c0e18" stroke="#22c55e" stroke-opacity="0.2"/>
      
      <!-- Big Character Demonstration -->
      <rect x="50" y="95" width="80" height="95" rx="12" fill="#101424" stroke="#4ade80" stroke-width="2"/>
      <text x="90" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff">ᴋ</text>
      
      <text x="155" y="125" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">ᴋʟᴇɪɴᴇ ꜱᴄʜʀɪꜰᴛ</text>
      <text x="155" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#4ade80" font-weight="600">✓ Small Caps Codepoints vorhanden</text>
      <text x="155" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Unicode Latin Letter Small Capital K (U+1D0B)</text>

      <!-- Feature List -->
      <g transform="translate(25, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Erfolgreiches Rendering bei:</text>
        
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#22c55e"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">iOS (Instagram, TikTok, WhatsApp, Safari)</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#22c55e"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Android 9+ und moderne Chrome/Edge Browser</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#22c55e"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Windows 10/11 Segoe UI &amp; macOS San Francisco</text>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: Älteres Gerät / Unvollständige Glyphen (Missing Glyphs) -->
    <g transform="translate(540, 0)" filter="url(#renderGlow)">
      <rect width="500" height="420" rx="24" fill="#141828" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5"/>
      
      <!-- Top Badge -->
      <rect x="25" y="24" width="240" height="28" rx="14" fill="#ef4444" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f87171">⚠️ FEHLENDE GLYPHEN / TOFU</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="700">Subscript Lücken</text>

      <!-- Visual Display Screen Mockup with Tofu Box -->
      <rect x="25" y="68" width="450" height="150" rx="16" fill="#0c0e18" stroke="#ef4444" stroke-opacity="0.2"/>
      
      <!-- Big Tofu Box -->
      <rect x="50" y="95" width="80" height="95" rx="12" fill="#1e1820" stroke="#f87171" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="90" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#f87171">☐</text>
      
      <text x="155" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f87171">ₖₗₑᵢ☐ₑ</text>
      <text x="155" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#f87171" font-weight="600">❌ Nicht alle Tiefgestellt-Zeichen existieren</text>
      <text x="155" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Subscript besitzt keine vollständigen A-Z Codes</text>

      <!-- Solutions List -->
      <g transform="translate(25, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Praxis-Tipps &amp; Empfehlungen:</text>
        
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#f87171"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Small Caps (Kapitälchen) als stabilsten Stil wählen</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#f87171"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Bei deutschen Umlauten (ä, ö, ü) Vorschau prüfen</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#f87171"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Wichtige Kontaktdaten immer in Normaltext belassen</text>
        </g>
      </g>
    </g>

  </g>
</svg>

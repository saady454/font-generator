<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="boxSocialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#101426"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <filter id="boxSocialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#boxSocialBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#38bdf8" fill-opacity="0.10"/>
  <circle cx="920" cy="450" r="260" fill="#34d399" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">PRAXIS-EINSATZ</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Eckige Schrift in <tspan fill="#38bdf8">Gaming, Bios &amp; Chats</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Markante Clan-Tags, geordnete Discord-Server und strukturierte Instagram-Profile
    </text>
  </g>

  <!-- 3 Showcase Columns -->
  <g transform="translate(80, 160)">
    
    <!-- Card 1: Gaming Clan-Tags &amp; Nicknames -->
    <g transform="translate(0, 0)" filter="url(#boxSocialShadow)">
      <rect width="325" height="440" rx="16" fill="#121728" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="16" fill="#161c30"/>
      <rect y="20" width="325" height="20" fill="#161c30"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">🎮 GAMING &amp; CLAN-TAGS</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="12" fill="#080c16" stroke="#38bdf8" stroke-opacity="0.2"/>
        
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">VALORANT / CS2 / FORTNITE:</text>
        
        <g transform="translate(15, 45)">
          <rect width="255" height="45" rx="8" fill="#161c30"/>
          <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#38bdf8">【VIP】 🅴🅻🅸🆃🅴</text>
        </g>

        <g transform="translate(15, 100)">
          <rect width="255" height="45" rx="8" fill="#161c30"/>
          <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">🄲🄻🄰🄽 🄻🄴🄰🄳🄴🅁</text>
        </g>

        <g transform="translate(15, 155)">
          <rect width="255" height="45" rx="8" fill="#161c30"/>
          <text x="20" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">〖FPS_GHOST〗</text>
        </g>

        <g transform="translate(15, 210)">
          <rect width="255" height="60" rx="8" fill="#1b2138"/>
          <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Taktischer Vorteil:</text>
          <text x="15" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Hebt Teamkürzel in Lobbys &amp; Scoreboards hervor</text>
        </g>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="10" fill="#161c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">✓ Klare Abgrenzung</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Boxen trennen Name und Clan sauber ab</text>
    </g>

    <!-- Card 2: Instagram Bio &amp; Profile Highlights -->
    <g transform="translate(355, 0)" filter="url(#boxSocialShadow)">
      <rect width="325" height="440" rx="16" fill="#121728" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="16" fill="#161c30"/>
      <rect y="20" width="325" height="20" fill="#161c30"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#a5b4fc">📸 INSTAGRAM BIO &amp; HIGHLIGHTS</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="12" fill="#080c16" stroke="#818cf8" stroke-opacity="0.2"/>
        
        <g transform="translate(20, 30)">
          <text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">🅼🅰🆁🅲🅾 🅵🅸🆃🅽🅴🆂🆂</text>
          <text x="0" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">📍 🄱🄴🅁🄻🄸🄽</text>
          <text x="0" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">💪 🄲🄾🄰🄲🄷 &amp; 🄽🅄🅃🅁🄸🅃🄸🄾🄽</text>
          <text x="0" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#a5b4fc">📦 🄽🄴🅆 🄳🅁🄾🄿 🄾🅄🅃 🄽🄾🅆</text>

          <line x1="0" y1="95" x2="245" y2="95" stroke="#ffffff" stroke-opacity="0.1"/>

          <!-- Story Highlights in Boxed Style -->
          <text x="0" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">HIGHLIGHT-TITEL:</text>
          <text x="0" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🄵🄰🅀 &amp;bull; 🄶🅈🄼 &amp;bull; 🄵🄾🄾🄳 &amp;bull; 🅅🄻🄾🄶</text>
          
          <rect x="0" y="175" width="245" height="40" rx="8" fill="#161c30"/>
          <text x="122" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">🔗 marco-fitness.de/shop</text>
        </g>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="10" fill="#161c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">✓ Moderner Feed-Stil</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Gibt Texten eine saubere, geordnete Struktur</text>
    </g>

    <!-- Card 3: Discord Server Categories -->
    <g transform="translate(710, 0)" filter="url(#boxSocialShadow)">
      <rect width="325" height="440" rx="16" fill="#121728" stroke="#5865f2" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="16" fill="#161c30"/>
      <rect y="20" width="325" height="20" fill="#161c30"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#5865f2">🎮 DISCORD KANÄLE &amp; ROLLEN</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="12" fill="#080c16" stroke="#5865f2" stroke-opacity="0.2"/>
        
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SERVER-KATEGORIEN:</text>
        
        <g transform="translate(15, 45)">
          <rect width="255" height="35" rx="6" fill="#5865f2" fill-opacity="0.15"/>
          <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">▼ 【 🄸🄽🄵🄾🅁🄼🄰🅃🄸🄾🄽 】</text>
        </g>
        <g transform="translate(15, 90)">
          <text x="15" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8"># 🄲🄷🄰🅃-🅁🄴🄶🄴🄻🄽</text>
          <text x="15" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8"># 🅰🅽🅺🆄🅴🅽🅳🅸🅶🆄🅽🅶</text>
        </g>

        <g transform="translate(15, 150)">
          <rect width="255" height="35" rx="6" fill="#5865f2" fill-opacity="0.15"/>
          <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">▼ 【 🄲🄾🄼🄼🅄🄽🄸🅃🅈 】</text>
        </g>
        <g transform="translate(15, 195)">
          <text x="15" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8"># 🄷🄰🅄🄿🅃-🄲🄷🄰🅃</text>
          <text x="15" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8"># 🅼🅴🅼🅴🆂-🆃🅰🅻🅺</text>
        </g>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="10" fill="#161c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#5865f2">✓ Übersichtliche Navigation</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Struktur für große Gaming-Communities</text>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="game14Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#14142b"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="game14Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="game14Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#game14Bg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#a855f7" fill-opacity="0.08"/>
  <circle cx="920" cy="460" r="260" fill="#3b82f6" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#a855f7" letter-spacing="2">GAMING &amp; ESPORTS NICKNAMES</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Stylische Schriftarten für <tspan fill="url(#game14Grad)">Gamer &amp; Clans</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Gotische Fraktur, Glitch-Effekte und dekorative Symbole für Discord, Steam, CS2 und Fortnite
    </text>
  </g>

  <!-- 6 Game Nickname Cards Grid -->
  <g transform="translate(100, 150)">
    
    <!-- Game 1: Fortnite -->
    <g transform="translate(0, 0)" filter="url(#game14Shadow)">
      <rect width="310" height="210" rx="18" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <rect width="90" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="45" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">FORTNITE</text>
        
        <rect y="35" width="270" height="75" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Glitch &amp; Symbole:</text>
        <text x="15" y="60" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">꧁ঔৣ☬V̶i̶p̶e̶r̶☬ঔৣ꧂</text>
        
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Stil: Glitch &amp; Flügel-Symbole</text>
      </g>
    </g>

    <!-- Game 2: Minecraft -->
    <g transform="translate(345, 0)" filter="url(#game14Shadow)">
      <rect width="310" height="210" rx="18" fill="#111827" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <rect width="105" height="24" rx="6" fill="#22c55e" fill-opacity="0.15"/>
        <text x="52" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">MINECRAFT</text>
        
        <rect y="35" width="270" height="75" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Small Caps &amp; Sterne:</text>
        <text x="15" y="60" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">★ sʜᴀᴅᴏᴡ_ʟᴏʀᴅ ★</text>
        
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Stil: Kleine Schrift &amp; Stern-Sterne</text>
      </g>
    </g>

    <!-- Game 3: Valorant -->
    <g transform="translate(690, 0)" filter="url(#game14Shadow)">
      <rect width="310" height="210" rx="18" fill="#111827" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <rect width="90" height="24" rx="6" fill="#f43f5e" fill-opacity="0.15"/>
        <text x="45" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f43f5e">VALORANT</text>
        
        <rect y="35" width="270" height="75" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Gotisch &amp; Fraktur:</text>
        <text x="15" y="60" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">𝕻𝖍𝖔𝖊𝖓𝖎𝖝#𝕰𝖀𝖂</text>
        
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Stil: Gotische Fraktur-Buchstaben</text>
      </g>
    </g>

    <!-- Game 4: CS2 / Counter-Strike -->
    <g transform="translate(0, 235)" filter="url(#game14Shadow)">
      <rect width="310" height="210" rx="18" fill="#111827" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <rect width="125" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="62" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f59e0b">CS2 / STEAM</text>
        
        <rect y="35" width="270" height="75" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Eckig &amp; Techno:</text>
        <text x="15" y="60" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">[🄲🄻🄰🄽] 🄽🄸🄽🄹🄰</text>
        
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Stil: Eckige Schrift für Clan-Tags</text>
      </g>
    </g>

    <!-- Game 5: Roblox -->
    <g transform="translate(345, 235)" filter="url(#game14Shadow)">
      <rect width="310" height="210" rx="18" fill="#111827" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <rect width="80" height="24" rx="6" fill="#e11d48" fill-opacity="0.15"/>
        <text x="40" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#e11d48">ROBLOX</text>
        
        <rect y="35" width="270" height="75" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Bubble &amp; Herzen:</text>
        <text x="15" y="60" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">❤ Ⓟⓡⓘⓝⓒⓔⓢⓢ ❤</text>
        
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Stil: Bubble-Font &amp; Herz-Symbole</text>
      </g>
    </g>

    <!-- Game 6: Discord &amp; Steam -->
    <g transform="translate(690, 235)" filter="url(#game14Shadow)">
      <rect width="310" height="210" rx="18" fill="#111827" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <rect width="140" height="24" rx="6" fill="#818cf8" fill-opacity="0.15"/>
        <text x="70" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#818cf8">DISCORD &amp; CLANS</text>
        
        <rect y="35" width="270" height="75" rx="10" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Tattoo &amp; Kronen:</text>
        <text x="15" y="60" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">👑 𝔎𝔦𝔫𝔤_𝔖𝔩𝔞𝔶𝔢𝔯 👑</text>
        
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Stil: Old English Tattoo-Schrift</text>
      </g>
    </g>

  </g>
</svg>

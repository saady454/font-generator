<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="rbxHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#06070d"/>
    </linearGradient>
    <linearGradient id="rbxRedPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="rbxCuteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="rbxCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#rbxHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="220" r="300" fill="#ec4899" fill-opacity="0.10"/>
  <circle cx="940" cy="450" r="280" fill="#3b82f6" fill-opacity="0.10"/>
  <circle cx="600" cy="300" r="220" fill="#8b5cf6" fill-opacity="0.05"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e1832" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">🎮 ROBLOX NICKNAME STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Roblox Nickname: <tspan fill="url(#rbxCuteGrad)">Coole Namen &amp; Ideen</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Entdecke kreative Gamertags, Benutzer- &amp; Anzeigenamen für dein Profil
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#rbxCardShadow)">
    <rect width="1020" height="420" rx="28" fill="#131024" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#080612" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Roblox Profile Card Mockup -->
    <g transform="translate(50, 45)">
      <rect width="280" height="330" rx="20" fill="#151228" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      
      <!-- Avatar &amp; Profile Header -->
      <g transform="translate(18, 18)">
        <circle cx="24" cy="24" r="23" fill="none" stroke="url(#rbxRedPurple)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="20" fill="#1e1836"/>
        <text x="24" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">✨</text>
        <text x="58" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">ShadowNova</text>
        <text x="58" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#a78bfa">@shadownova_pro</text>
      </g>

      <!-- Stats Bar -->
      <g transform="translate(18, 70)" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
        <text x="20" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ffffff">1.4k</tspan><tspan dy="12" x="20">Freunde</tspan></text>
        <text x="115" y="12" text-anchor="middle"><tspan font-weight="800" fill="#fbbf24">★ 94</tspan><tspan dy="12" x="115">Badges</tspan></text>
        <text x="205" y="12" text-anchor="middle"><tspan font-weight="800" fill="#38bdf8">320</tspan><tspan dy="12" x="205">Follower 🚀</tspan></text>
      </g>

      <!-- Display Name Simulation -->
      <g transform="translate(18, 110)">
        <rect width="244" height="135" rx="10" fill="#080612" stroke="#ec4899" stroke-opacity="0.3"/>
        
        <text x="12" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="1">ANZEIGENAME (DISPLAY NAME)</text>
        <text x="12" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">ShadowNova</text>
        
        <rect x="12" y="70" width="220" height="24" rx="6" fill="#1d1733"/>
        <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">✓ Kostenlos (alle 7 Tage)</text>
        <text x="145" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">✓ Nicht eindeutig</text>
        
        <text x="12" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Benutzername: @shadownova_pro</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(18, 260)">
        <rect width="244" height="34" rx="8" fill="url(#rbxRedPurple)"/>
        <text x="122" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">In Roblox einfügen 📋</text>
      </g>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(365, 45)">
      <rect width="605" height="330" rx="20" fill="#151228" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6" letter-spacing="1">ROBLOX NAME EINGEBEN</text>
        <rect x="0" y="24" width="555" height="42" rx="10" fill="#080612" stroke="#ec4899" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Luna</text>
        <rect x="465" y="32" width="80" height="26" rx="6" fill="url(#rbxRedPurple)"/>
        <text x="505" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Generieren ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Style 1: Cool -->
        <g transform="translate(0, 0)">
          <rect width="265" height="46" rx="10" fill="#1f1838" stroke="#8b5cf6" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#a78bfa">COOL (SHADOW / NOVA)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">LunaNova</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#a78bfa">Kopie</text>
        </g>

        <!-- Style 2: Cute -->
        <g transform="translate(285, 0)">
          <rect width="270" height="46" rx="10" fill="#1f1838" stroke="#ec4899" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f472b6">CUTE (BUNNY / STAR)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">CloudyCat</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ec4899" fill-opacity="0.2"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f472b6">Kopie</text>
        </g>

        <!-- Style 3: Lustig -->
        <g transform="translate(0, 56)">
          <rect width="265" height="46" rx="10" fill="#1f1838" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">LUSTIG (NINJA / OPA)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">WaffelNinja</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 4: Fantasy -->
        <g transform="translate(285, 56)">
          <rect width="270" height="46" rx="10" fill="#1f1838" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">FANTASY (DRAGON / FOX)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">MysticFox</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 5: Clean -->
        <g transform="translate(0, 112)">
          <rect width="265" height="46" rx="10" fill="#1f1838" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">CLEAN (MINIMALISTISCH)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Zeron &amp;bull; Vexo</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 6: Gaming -->
        <g transform="translate(285, 112)">
          <rect width="270" height="46" rx="10" fill="#1f1838" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f87171">GAMING (AIM / RUSH)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">AimMaster</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Full width Bottom CTA -->
        <g transform="translate(0, 168)">
          <rect width="555" height="46" rx="10" fill="url(#rbxRedPurple)"/>
          <text x="277" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">⚡ 500+ Roblox Namen &amp; Ideen im Generator kostenlos erstellen</text>
        </g>

      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="rfEckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="rfEckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="rfEckShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#rfEckBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="1000" cy="460" r="240" fill="#c084fc" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">BOX-DRAWING &amp; ECKZEICHEN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      4 Stile für <tspan fill="url(#rfEckGrad)">Rahmen &amp; Textboxen</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Von einfachen Box-Drawing-Linien bis zu aufwendigen asiatischen Klammern
    </text>
  </g>

  <!-- 4 Cards Grid (2x2) -->
  <g transform="translate(60, 145)">
    
    <!-- 1. Dünne Linien -->
    <g transform="translate(0, 0)" filter="url(#rfEckShadow)">
      <rect width="520" height="210" rx="18" fill="#111827" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <g transform="translate(25, 20)">
        <rect width="130" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="65" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">1. DÜNNE LINIEN</text>
        
        <!-- Box Visual -->
        <rect y="38" width="470" height="75" rx="10" fill="#090d16" stroke="#38bdf8" stroke-opacity="0.2"/>
        <text x="235" y="62" text-anchor="middle" font-family="monospace" font-size="14" fill="#38bdf8">┌──────────────────┐</text>
        <text x="235" y="80" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">│   Dein Text      │</text>
        <text x="235" y="98" text-anchor="middle" font-family="monospace" font-size="14" fill="#38bdf8">└──────────────────┘</text>

        <text x="0" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Perfekt für strukturierte Notizen, ASCII-Boxen &amp; Code.</text>
        <text x="0" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">✓ 100 % Monospace-Kompatibel</text>
      </g>
    </g>

    <!-- 2. Doppelte Linien -->
    <g transform="translate(560, 0)" filter="url(#rfEckShadow)">
      <rect width="520" height="210" rx="18" fill="#111827" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>
      <g transform="translate(25, 20)">
        <rect width="140" height="26" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="70" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24">2. DOPPELTE LINIEN</text>
        
        <!-- Box Visual -->
        <rect y="38" width="470" height="75" rx="10" fill="#090d16" stroke="#fbbf24" stroke-opacity="0.2"/>
        <text x="235" y="62" text-anchor="middle" font-family="monospace" font-size="14" fill="#fbbf24">╔══════════════════╗</text>
        <text x="235" y="80" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">║   Wichtiger Text ║</text>
        <text x="235" y="98" text-anchor="middle" font-family="monospace" font-size="14" fill="#fbbf24">╚══════════════════╝</text>

        <text x="0" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Starke Hervorhebung für WhatsApp-Status &amp; Ankündigungen.</text>
        <text x="0" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">★ Auffälliger Retro-Look</text>
      </g>
    </g>

    <!-- 3. Asiatische Klammern -->
    <g transform="translate(0, 230)" filter="url(#rfEckShadow)">
      <rect width="520" height="210" rx="18" fill="#111827" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.5"/>
      <g transform="translate(25, 20)">
        <rect width="165" height="26" rx="6" fill="#c084fc" fill-opacity="0.15"/>
        <text x="82" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#c084fc">3. JAPANISCHE KLAMMERN</text>
        
        <!-- Box Visual -->
        <rect y="38" width="470" height="75" rx="10" fill="#090d16" stroke="#c084fc" stroke-opacity="0.2"/>
        <text x="235" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">【 Highlight 】  『 Info 』  〖 Tag 〗</text>
        <text x="235" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c084fc">〘 Status 〙  ⟦ Level ⟧  ❴ Bio ❵</text>

        <text x="0" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Beliebt auf YouTube, TikTok-Titeln &amp; Gaming-Tags.</text>
        <text x="0" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">★ Massiv &amp; sofort sichtbar</text>
      </g>
    </g>

    <!-- 4. Symmetrische Ranken -->
    <g transform="translate(560, 230)" filter="url(#rfEckShadow)">
      <rect width="520" height="210" rx="18" fill="#111827" stroke="#f472b6" stroke-opacity="0.35" stroke-width="1.5"/>
      <g transform="translate(25, 20)">
        <rect width="160" height="26" rx="6" fill="#f472b6" fill-opacity="0.15"/>
        <text x="80" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f472b6">4. ORNAMENTE &amp; RANKEN</text>
        
        <!-- Box Visual -->
        <rect y="38" width="470" height="75" rx="10" fill="#090d16" stroke="#f472b6" stroke-opacity="0.2"/>
        <text x="235" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">꧁ Shadow ꧂   ༺ Phoenix ༻</text>
        <text x="235" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#f472b6">꧁༺ Elite Gamer ༻꧂</text>

        <text x="0" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Perfekt für Discord-Namen, Free Fire, CS2 &amp; Clan-Tags.</text>
        <text x="0" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">★ Höchster Wiedererkennungswert</text>
      </g>
    </g>

  </g>
</svg>

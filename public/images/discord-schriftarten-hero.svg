<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="dcHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="50%" stop-color="#111322"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="dcBlurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="50%" stop-color="#4752C4"/>
      <stop offset="100%" stop-color="#3b429f"/>
    </linearGradient>
    <linearGradient id="dcAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#808bf5"/>
    </linearGradient>
    <filter id="dcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#dcHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="280" fill="#5865F2" fill-opacity="0.10"/>
  <circle cx="920" cy="460" r="300" fill="#808bf5" fill-opacity="0.08"/>
  <circle cx="600" cy="340" r="200" fill="#a855f7" fill-opacity="0.04"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#181b30" stroke="#5865F2" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#808bf5" letter-spacing="2">🎮 DISCORD SCHRIFTEN STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Discord Schriftarten: <tspan fill="url(#dcAccentGrad)">Coole Schriften zum Kopieren</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Fette, kursive &amp; gotische Unicode-Schriften für Namen, Server, Rollen &amp; Profile
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#dcShadow)">
    <rect width="1020" height="420" rx="28" fill="#141727" stroke="#5865F2" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#0c0e18" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Discord UI Mockup (Server + Chat + Channels) -->
    <g transform="translate(50, 45)">
      <!-- Server Sidebar Strip -->
      <rect width="45" height="330" rx="14" fill="#080911"/>
      <circle cx="22" cy="30" r="16" fill="#5865F2"/>
      <text x="22" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">🎮</text>
      <circle cx="22" cy="72" r="14" fill="#1e2238"/>
      <text x="22" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">⚔️</text>
      <circle cx="22" cy="110" r="14" fill="#1e2238"/>
      <text x="22" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">✨</text>
      
      <!-- Channels Panel -->
      <g transform="translate(52, 0)">
        <rect width="135" height="330" rx="14" fill="#111320"/>
        
        <!-- Server Title -->
        <text x="12" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">𝕲𝖆𝖒𝖎𝖓𝖌 𝕷𝖔𝖚𝖓𝖌𝖊</text>
        <line x1="8" y1="36" x2="127" y2="36" stroke="#ffffff" stroke-opacity="0.08"/>

        <!-- Categories &amp; Channels -->
        <text x="10" y="54" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#64748b" letter-spacing="1">▼ ── ɪɴꜰᴏʀᴍᴀᴛɪᴏɴ ──</text>
        <g transform="translate(6, 62)">
          <rect width="123" height="24" rx="6" fill="#5865F2" fill-opacity="0.15"/>
          <text x="8" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#808bf5"># ┃📢-ᴀɴɴᴏᴜɴᴄᴇ</text>
        </g>
        <g transform="translate(6, 90)">
          <text x="8" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8"># ┃📜-ʀᴇɢᴇʟɴ</text>
        </g>

        <text x="10" y="130" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#64748b" letter-spacing="1">▼ ── ᴄᴏᴍᴍᴜɴɪᴛʏ ──</text>
        <g transform="translate(6, 138)">
          <text x="8" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8"># ┃💬-ʜᴀᴜᴘᴛᴄʜᴀᴛ</text>
        </g>
        <g transform="translate(6, 166)">
          <text x="8" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8"># ┃🎮-ɢᴀᴍɪɴɢ</text>
        </g>

        <!-- User Profile Card in Channels Strip -->
        <g transform="translate(6, 260)">
          <rect width="123" height="60" rx="10" fill="#080911" stroke="#5865F2" stroke-opacity="0.3"/>
          <circle cx="20" cy="22" r="12" fill="#5865F2"/>
          <circle cx="28" cy="30" r="4" fill="#22c55e"/>
          <text x="38" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#ffffff">𝕯𝖎𝔰𝔠𝔬𝔯𝔡 𝕻𝔯𝔬</text>
          <text x="38" y="30" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">@shadow_2026</text>
          <text x="10" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#808bf5">👑 Server Admin</text>
        </g>
      </g>

      <!-- Main Chat Area inside Mockup -->
      <g transform="translate(194, 0)">
        <rect width="165" height="330" rx="14" fill="#181a2b"/>
        
        <!-- Chat Header -->
        <text x="12" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff"># ┃📢-ᴀɴɴᴏᴜɴᴄᴇ</text>
        <line x1="8" y1="36" x2="157" y2="36" stroke="#ffffff" stroke-opacity="0.08"/>

        <!-- Message 1 -->
        <g transform="translate(8, 48)">
          <circle cx="14" cy="14" r="12" fill="#5865F2"/>
          <text x="32" y="12" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">𝕯𝖎𝔰𝔠𝔬𝔯𝔡 𝕻𝔯𝔬</text>
          <text x="105" y="12" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">18:45</text>
          <text x="32" y="28" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#808bf5">★ 𝗧𝗢𝗨𝗥𝗡𝗔𝗠𝗘𝗡𝗧 𝟮𝟬𝟮𝟲 ★</text>
          <text x="32" y="42" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">Anmeldung ab sofort live!</text>
        </g>

        <!-- Message 2 -->
        <g transform="translate(8, 105)">
          <circle cx="14" cy="14" r="12" fill="#a855f7"/>
          <text x="32" y="12" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">𝘌𝘭𝘦𝘨𝘢𝘯𝘵 𝘝𝘪𝘣𝘦𝘴</text>
          <text x="32" y="28" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#ffffff">𝓦𝓲𝓻 𝓼𝓲𝓷𝓭 𝓭𝓪𝓫𝓮𝓲! 🔥</text>
        </g>

        <!-- Input Box at Bottom -->
        <g transform="translate(8, 280)">
          <rect width="149" height="38" rx="8" fill="#0e101a" stroke="#5865F2" stroke-opacity="0.3"/>
          <text x="12" y="24" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Nachricht an #📢...</text>
        </g>
      </g>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(425, 45)">
      <rect width="545" height="330" rx="20" fill="#121526" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#808bf5" letter-spacing="1">EINGABETEXT</text>
        <rect x="0" y="24" width="495" height="42" rx="10" fill="#090b14" stroke="#5865F2" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Discord</text>
        <rect x="415" y="32" width="70" height="26" rx="6" fill="#5865F2"/>
        <text x="450" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Live ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Style 1: Fett Sans -->
        <g transform="translate(0, 0)">
          <rect width="238" height="46" rx="10" fill="#1a1e36" stroke="#5865F2" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#808bf5">FETT (NAMEN &amp; HOOKS)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">𝗗𝗶𝘀𝗰𝗼𝗿𝗱</text>
          <rect x="175" y="10" width="52" height="26" rx="6" fill="#5865F2" fill-opacity="0.2"/>
          <text x="201" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#808bf5">Kopie</text>
        </g>

        <!-- Style 2: Kursiv -->
        <g transform="translate(255, 0)">
          <rect width="240" height="46" rx="10" fill="#1a1e36" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">KURSIV (STATUS)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-style="italic" font-weight="600" fill="#ffffff">𝘋𝘪𝘴𝘤𝘰𝘳𝘥</text>
          <rect x="175" y="10" width="52" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="201" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 3: Gotisch -->
        <g transform="translate(0, 56)">
          <rect width="238" height="46" rx="10" fill="#1a1e36" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">GOTISCH / GAMING</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝔇𝔦𝔰𝔠𝔬𝔯𝔡</text>
          <rect x="175" y="10" width="52" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="201" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 4: Monospace -->
        <g transform="translate(255, 56)">
          <rect width="240" height="46" rx="10" fill="#1a1e36" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">MONOSPACE / TECH</text>
          <text x="12" y="36" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#ffffff">𝙳𝚒𝚜𝚌𝚘𝚛𝚍</text>
          <rect x="175" y="10" width="52" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="201" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 5: Bubble -->
        <g transform="translate(0, 112)">
          <rect width="238" height="46" rx="10" fill="#1a1e36" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f472b6">BUBBLE / KREISE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Ⓓⓘⓢⓒⓞⓡⓓ</text>
          <rect x="175" y="10" width="52" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="201" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 6: Kapitälchen -->
        <g transform="translate(255, 112)">
          <rect width="240" height="46" rx="10" fill="#1a1e36" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc">KAPITÄLCHEN (KANÄLE)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">ᴅɪꜱᴄᴏʀᴅ</text>
          <rect x="175" y="10" width="52" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="201" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 7: Schreibschrift -->
        <g transform="translate(0, 168)">
          <rect width="495" height="46" rx="10" fill="#1a1e36" stroke="#5865F2" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#808bf5">SCHREIBSCHRIFT (BIO &amp; PROFIL)</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝓓𝓲𝓼𝓬𝓸𝓻𝓭 𝓥𝓲𝓫𝓮𝓼 ✨</text>
          <rect x="425" y="10" width="58" height="26" rx="6" fill="#5865F2"/>
          <text x="454" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">Kopieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="decoHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14"/>
      <stop offset="50%" stop-color="#141226"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="decoPinkGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="decoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#decoHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#ec4899" fill-opacity="0.10"/>
  <circle cx="920" cy="460" r="280" fill="#c084fc" fill-opacity="0.08"/>

  <!-- Subtle Decorative Corner Borders -->
  <g stroke="#ec4899" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <path d="M50,80 L50,50 L80,50"/>
    <path d="M1150,80 L1150,50 L1120,50"/>
    <path d="M50,595 L50,625 L80,625"/>
    <path d="M1150,595 L1150,625 L1120,625"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#f472b6" letter-spacing="2">✨ ORNAMENT &amp; DISPLAY STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Dekorative Schrift: <tspan fill="url(#decoPinkGold)">Schöne Schrift zum Kopieren</tspan>
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Ornamente, Engelsflügel (꧁...꧂), Rahmen &amp; Schmuckschriften für Bios, Nicknames &amp; Chats
  </text>

  <!-- Main Generator Display Canvas Card -->
  <g transform="translate(100, 215)" filter="url(#decoShadow)">
    <rect width="1000" height="400" rx="28" fill="#141224" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Paper Board -->
    <rect x="25" y="25" width="950" height="350" rx="20" fill="#0b0914" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- Large Decorative Centerpiece Display: ꧁ Dekorative Schrift ꧂ -->
    <g transform="translate(500, 140)" text-anchor="middle">
      <text y="0" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="url(#decoPinkGold)" letter-spacing="2">꧁ 𝒟𝑒𝓀𝑜𝓇𝒶𝓉𝒾𝓋 ꧂</text>
      <text y="55" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" letter-spacing="6">👑 𝕺𝖗𝖓𝖆𝖒𝖊𝖓𝖙𝖊 &amp;bull; 🌸 𝓕𝓵𝓾𝓮𝓰𝓮𝓵 &amp;bull; ⭐ 𝒮𝓎𝓂𝒷𝑜𝓁𝑒</text>
    </g>

    <!-- 4 Decorative Style Showcase Tiles Below -->
    <g transform="translate(60, 260)">
      
      <g transform="translate(0, 0)">
        <rect width="205" height="70" rx="14" fill="#1b1730" stroke="#ec4899" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="1">ENGELSFLÜGEL</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">꧁ 𝒫𝓇𝒾𝓃𝒸𝑒𝓈𝓈 ꧂</text>
      </g>

      <g transform="translate(225, 0)">
        <rect width="205" height="70" rx="14" fill="#1b1730" stroke="#c084fc" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="1">STERNE &amp; FUNKELN</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">★彡 𝓚𝓲𝓷𝓰 彡★</text>
      </g>

      <g transform="translate(450, 0)">
        <rect width="205" height="70" rx="14" fill="#1b1730" stroke="#fbbf24" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="1">KRONEN-RAHMEN</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">👑 𝕷𝖊𝖌𝖊𝖓𝖉 👑</text>
      </g>

      <g transform="translate(675, 0)">
        <rect width="205" height="70" rx="14" fill="#1b1730" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="1">HERZEN &amp; BLUMEN</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">♡ 𝒞𝒽𝒶𝓇𝓁𝑜𝓉𝓉𝑒 ♡</text>
      </g>
    </g>
  </g>
</svg>

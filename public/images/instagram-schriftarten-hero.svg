<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="instaHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080711"/>
      <stop offset="50%" stop-color="#140f22"/>
      <stop offset="100%" stop-color="#06050e"/>
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="instaAccentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="instaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#instaHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="280" fill="#ec4899" fill-opacity="0.10"/>
  <circle cx="920" cy="460" r="300" fill="#8b5cf6" fill-opacity="0.08"/>
  <circle cx="600" cy="340" r="200" fill="#f59e0b" fill-opacity="0.05"/>

  <!-- Top Header Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1b122e" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">📸 INSTAGRAM FONT STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Instagram Schriftarten: <tspan fill="url(#instaAccentLight)">Schöne Schriften zum Kopieren</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Fette, kursive &amp; elegante Schriften für Bio (150 Zeichen), Namen, Captions &amp; Stories
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#instaShadow)">
    <rect width="1020" height="420" rx="28" fill="#130e24" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#090614" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Instagram Bio &amp; Profile Card Mockup -->
    <g transform="translate(50, 45)">
      <rect width="280" height="330" rx="20" fill="#140f26" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      
      <!-- Avatar &amp; Profile Header -->
      <g transform="translate(18, 18)">
        <!-- Instagram Gradient Avatar Ring -->
        <circle cx="24" cy="24" r="23" fill="none" stroke="url(#instaGrad)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="20" fill="#1e1638"/>
        <text x="24" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">✨</text>
        <text x="58" y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">ʟᴀᴜʀᴀ ᴡᴇɪss 📸</text>
        <text x="58" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#a78bfa">@laura.creative</text>
      </g>

      <!-- Stats Bar -->
      <g transform="translate(18, 70)" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
        <text x="15" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ffffff">48</tspan><tspan dy="12" x="15">Posts</tspan></text>
        <text x="110" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ffffff">14.8k</tspan><tspan dy="12" x="110">Follower</tspan></text>
        <text x="205" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ffffff">392</tspan><tspan dy="12" x="205">Gefolgt</tspan></text>
      </g>

      <!-- Profile Bio Simulation Box -->
      <g transform="translate(18, 110)">
        <rect width="244" height="135" rx="10" fill="#090614" stroke="#ec4899" stroke-opacity="0.2"/>
        
        <text x="12" y="24" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#f472b6">✧ ᴀʀᴄʜɪᴛᴇᴄᴛᴜʀᴇ &amp; ʟɪɢʜᴛ ✧</text>
        <text x="12" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">☕ 𝗖𝗿𝗲𝗮𝘁𝗶𝘃𝗲 𝗠𝗶𝗻𝗱 &amp;bull; ʙᴇʀʟɪɴ</text>
        <text x="12" y="68" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#cbd5e1">𝘕𝘦𝘸 𝘗𝘰𝘴𝘵𝘴 &amp; 𝘝𝘪𝘣𝘦𝘴 𝘦𝘷𝘦𝘳𝘺 𝘸𝘦𝘦𝘬 ✨</text>
        <text x="12" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">★ 𝓘𝓷𝓼𝓽𝓪𝓰𝓻𝓪𝓶 𝓢𝓽𝔂𝓵𝓮 ★</text>
        <text x="12" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">🔗 schriftarten.io/plattform/instagram</text>
      </g>

      <!-- Follow Button -->
      <g transform="translate(18, 260)">
        <rect width="244" height="34" rx="8" fill="url(#instaGrad)"/>
        <text x="122" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Folgen ✨</text>
      </g>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(365, 45)">
      <rect width="605" height="330" rx="20" fill="#140f26" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6" letter-spacing="1">EINGABETEXT</text>
        <rect x="0" y="24" width="555" height="42" rx="10" fill="#080512" stroke="#ec4899" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Instagram Bio</text>
        <rect x="475" y="32" width="70" height="26" rx="6" fill="url(#instaGrad)"/>
        <text x="510" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Live ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Style 1: Fett Sans -->
        <g transform="translate(0, 0)">
          <rect width="265" height="46" rx="10" fill="#1f1638" stroke="#ec4899" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f472b6">FETT (PROFILNAME)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">𝗜𝗻𝘀𝘁𝗮𝗴𝗿𝗮𝗺 𝗕𝗶𝗼</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ec4899" fill-opacity="0.2"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f472b6">Kopie</text>
        </g>

        <!-- Style 2: Kursiv -->
        <g transform="translate(285, 0)">
          <rect width="270" height="46" rx="10" fill="#1f1638" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">KURSIV (CAPTIONS)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-style="italic" font-weight="600" fill="#ffffff">𝘐𝘯𝘴𝘵𝘢𝘨𝘳𝘢𝘮 𝘉𝘪𝘰</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 3: Kapitälchen -->
        <g transform="translate(0, 56)">
          <rect width="265" height="46" rx="10" fill="#1f1638" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc">KAPITÄLCHEN (AESTHETIC)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ɪɴsᴛᴀɢʀᴀᴍ ʙɪᴏ</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 4: Schreibschrift -->
        <g transform="translate(285, 56)">
          <rect width="270" height="46" rx="10" fill="#1f1638" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">SCHREIBSCHRIFT</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝓘𝓷𝓼𝓽𝓪𝓰𝓻𝓪𝓶 𝓑𝓲𝓸</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 5: Fraktur -->
        <g transform="translate(0, 112)">
          <rect width="265" height="46" rx="10" fill="#1f1638" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f59e0b">FRAKTUR / GOTHIC</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝕴𝖓𝖘𝖙𝖆𝖌𝖗𝖆𝖒 𝕭𝖎𝖔</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 6: Bubble -->
        <g transform="translate(285, 112)">
          <rect width="270" height="46" rx="10" fill="#1f1638" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">BUBBLE / KREISE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Ⓘⓝⓢⓣⓐⓖⓡⓐⓜ Ⓑⓘⓞ</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Full width Bottom CTA -->
        <g transform="translate(0, 168)">
          <rect width="555" height="46" rx="10" fill="url(#instaGrad)"/>
          <text x="277" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">⚡ 500+ Stile für Instagram im Schriftarten Generator ausprobieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121222"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="urbanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#gridBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="220" fill="#f97316" fill-opacity="0.10"/>
  <circle cx="1000" cy="500" r="240" fill="#a855f7" fill-opacity="0.10"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-150" y="-16" width="300" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fb923c" letter-spacing="2">TYPOGRAFIE-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Die 6 wichtigsten <tspan fill="url(#urbanGrad1)">Graffiti-Stile</tspan> im Überblick
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Visueller Vergleich von Bubble, Tag, Brush, Block, Drip und Wildstyle
    </text>
  </g>

  <!-- 6 Grid Tiles (3x2 Layout) -->
  <g transform="translate(70, 155)">
    
    <!-- Tile 1: Bubble Letters -->
    <g transform="translate(0, 0)" filter="url(#tileShadow)">
      <rect width="335" height="215" rx="20" fill="#141424" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="13" fill="#f472b6" fill-opacity="0.15"/>
      <text x="85" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">1. BUBBLE LETTERS</text>
      
      <rect x="20" y="58" width="295" height="75" rx="12" fill="#0b0b14" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="167" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#f472b6" letter-spacing="3">ⓢⓣⓨⓛⓔ</text>

      <text x="20" y="158" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Eindruck: <tspan font-weight="400" fill="#94a3b8">Rund, weich &amp; verspielt</tspan></text>
      <text x="20" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Namen, Poster &amp; kreative Designs</tspan></text>
    </g>

    <!-- Tile 2: Tag Style -->
    <g transform="translate(365, 0)" filter="url(#tileShadow)">
      <rect width="335" height="215" rx="20" fill="#141424" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="20" width="115" height="26" rx="13" fill="#fb923c" fill-opacity="0.15"/>
      <text x="77" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fb923c">2. TAG STYLE</text>
      
      <rect x="20" y="58" width="295" height="75" rx="12" fill="#0b0b14" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="167" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" font-style="italic" fill="#fb923c">𝒮𝒯𝒴𝐿𝐸</text>

      <text x="20" y="158" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Eindruck: <tspan font-weight="400" fill="#94a3b8">Schnell, dynamisch &amp; handschriftlich</tspan></text>
      <text x="20" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fb923c">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Signaturen, Street-Art-Look</tspan></text>
    </g>

    <!-- Tile 3: Brush Style -->
    <g transform="translate(730, 0)" filter="url(#tileShadow)">
      <rect width="335" height="215" rx="20" fill="#141424" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="20" width="105" height="26" rx="13" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="72" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">3. BRUSH</text>
      
      <rect x="20" y="58" width="295" height="75" rx="12" fill="#0b0b14" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="167" y="108" text-anchor="middle" font-family="Impact, sans-serif" font-size="32" font-weight="900" fill="#38bdf8" letter-spacing="4">STYLE</text>

      <text x="20" y="158" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Eindruck: <tspan font-weight="400" fill="#94a3b8">Kräftig &amp; handgemalt</tspan></text>
      <text x="20" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Poster, Thumbnails &amp; Social Media</tspan></text>
    </g>

    <!-- Tile 4: Block Style -->
    <g transform="translate(0, 240)" filter="url(#tileShadow)">
      <rect width="335" height="215" rx="20" fill="#141424" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="20" width="120" height="26" rx="13" fill="#a855f7" fill-opacity="0.15"/>
      <text x="80" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">4. BLOCK STYLE</text>
      
      <rect x="20" y="58" width="295" height="75" rx="12" fill="#0b0b14" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="167" y="108" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="4">🅂🅃🅈🄻🄴</text>

      <text x="20" y="158" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Eindruck: <tspan font-weight="400" fill="#94a3b8">Groß, markant &amp; strukturiert</tspan></text>
      <text x="20" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Überschriften, Gamertags &amp; Titel</tspan></text>
    </g>

    <!-- Tile 5: Drip Style -->
    <g transform="translate(365, 240)" filter="url(#tileShadow)">
      <rect width="335" height="215" rx="20" fill="#141424" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="20" width="115" height="26" rx="13" fill="#22c55e" fill-opacity="0.15"/>
      <text x="77" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#4ade80">5. DRIP STYLE</text>
      
      <rect x="20" y="58" width="295" height="75" rx="12" fill="#0b0b14" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="167" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#4ade80" letter-spacing="2">S̸t̸y̸l̸e̸ 💧</text>

      <text x="20" y="158" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Eindruck: <tspan font-weight="400" fill="#94a3b8">Flüssig, verlaufend &amp; auffällig</tspan></text>
      <text x="20" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Künstlerische Designs &amp; Streetwear</tspan></text>
    </g>

    <!-- Tile 6: Wildstyle -->
    <g transform="translate(730, 240)" filter="url(#tileShadow)">
      <rect width="335" height="215" rx="20" fill="#141424" stroke="#eab308" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="20" width="115" height="26" rx="13" fill="#eab308" fill-opacity="0.15"/>
      <text x="77" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#facc15">6. WILDSTYLE</text>
      
      <rect x="20" y="58" width="295" height="75" rx="12" fill="#0b0b14" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="167" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#facc15" letter-spacing="2">⚡ 𝕾𝕿𝖄𝕷𝕰 ⚡</text>

      <text x="20" y="158" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Eindruck: <tspan font-weight="400" fill="#94a3b8">Komplex, verflochten &amp; intensiv</tspan></text>
      <text x="20" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#facc15">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Artwork, Murals &amp; Graffiti-Projekte</tspan></text>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="twHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="twBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d9bf0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="twAccentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#1d9bf0"/>
    </linearGradient>
    <filter id="twShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#twHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="280" fill="#1d9bf0" fill-opacity="0.08"/>
  <circle cx="920" cy="460" r="300" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="600" cy="340" r="200" fill="#38bdf8" fill-opacity="0.04"/>

  <!-- Top Header Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#0f141f" stroke="#1d9bf0" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1d9bf0" letter-spacing="2">✖️ TWITTER / X SCHRIFTEN STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Twitter / X Schriftarten: <tspan fill="url(#twAccentLight)">Coole Schrift zum Kopieren</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Fett, kursiv, Gothic &amp; Monospace für Tweets, Bio (160 Zeichen) &amp; Anzeigename (50 Zeichen)
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#twShadow)">
    <rect width="1020" height="420" rx="28" fill="#0d111a" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#05070c" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: X Tweet &amp; Profile Card Mockup -->
    <g transform="translate(50, 45)">
      <rect width="290" height="330" rx="20" fill="#0e131f" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      
      <!-- Post Author Header -->
      <g transform="translate(18, 18)">
        <circle cx="20" cy="20" r="18" fill="#182030" stroke="#ffffff" stroke-opacity="0.2"/>
        <text x="20" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">𝕏</text>
        <text x="48" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">𝗙𝗲𝘁𝘁 &amp;bull; 𝘒𝘶𝘳𝘴𝘪𝘷 𝕏</text>
        <text x="48" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#71767b">@creator_pro &amp;bull; 1h</text>
      </g>

      <!-- Tweet Body Text with Stylized Hook -->
      <g transform="translate(18, 70)">
        <rect width="254" height="36" rx="8" fill="#1d9bf0" fill-opacity="0.12" stroke="#1d9bf0" stroke-opacity="0.25"/>
        <text x="12" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#1d9bf0">🚀 𝗕𝗥𝗘𝗔𝗞𝗜𝗡𝗚: 𝘕𝘦𝘸 𝘜𝘱𝘥𝘢𝘵𝘦 𝘓𝘪𝘷𝘦!</text>
        
        <text x="4" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">Mit Unicode-Schriften stechen deine</text>
        <text x="4" y="78" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">Tweets &amp; Hooks sofort im Feed hervor.</text>
        <text x="4" y="98" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#cbd5e1">𝔊𝔬𝔱𝔦𝔰𝔠𝔥 &amp;bull; 𝙼𝚘𝚗𝚘𝚜𝚙𝚊𝚌𝚎 &amp;bull; Ⓑⓤⓑⓑⓛⓔ</text>
      </g>

      <!-- Profile Bio Simulation Box -->
      <g transform="translate(18, 185)">
        <rect width="254" height="75" rx="10" fill="#070a12" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="12" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1d9bf0" letter-spacing="0.5">X BIO (160 ZEICHEN LIMIT)</text>
        <text x="12" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">⚡ 𝗖𝗿𝗲𝗮𝘁𝗼𝗿 | 𝙂𝙖𝙢𝙞𝙣𝙜 | Tech 🎬</text>
        <text x="12" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#71767b">Täglich neue 𝘛𝘸𝘦𝘦𝘵𝘴 &amp; Insights ✨</text>
        <text x="12" y="68" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1d9bf0">🔗 schriftarten.io</text>
      </g>

      <!-- Tweet Action Metrics Bar -->
      <g transform="translate(18, 280)" font-family="system-ui, sans-serif" font-size="10" fill="#71767b">
        <text x="0" y="16">💬 48</text>
        <text x="65" y="16">🔁 192</text>
        <text x="135" y="16">❤️ 1.4k</text>
        <text x="205" y="16">📊 38k</text>
      </g>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(375, 45)">
      <rect width="595" height="330" rx="20" fill="#0e131f" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d9bf0" letter-spacing="1">EINGABETEXT</text>
        <rect x="0" y="24" width="545" height="42" rx="10" fill="#05070c" stroke="#1d9bf0" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Twitter Post</text>
        <rect x="465" y="32" width="70" height="26" rx="6" fill="#1d9bf0"/>
        <text x="500" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Live ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Style 1: Fett Sans -->
        <g transform="translate(0, 0)">
          <rect width="260" height="46" rx="10" fill="#141c2c" stroke="#1d9bf0" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1d9bf0">FETT (ANZEIGENAME)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">𝗧𝘄𝗶𝘁𝘁𝗲𝗿 𝗣𝗼𝘀𝘁</text>
          <rect x="195" y="10" width="55" height="26" rx="6" fill="#1d9bf0" fill-opacity="0.2"/>
          <text x="222" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1d9bf0">Kopie</text>
        </g>

        <!-- Style 2: Kursiv -->
        <g transform="translate(280, 0)">
          <rect width="265" height="46" rx="10" fill="#141c2c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">KURSIV (AKZENTE)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-style="italic" font-weight="600" fill="#ffffff">𝘛𝘸𝘪𝘵𝘵𝘦𝘳 𝘗𝘰𝘴𝘵</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 3: Gothic -->
        <g transform="translate(0, 56)">
          <rect width="260" height="46" rx="10" fill="#141c2c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">GOTHIC / PROFIL</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝔗𝔴𝔦𝔱𝔱𝔢𝔯 𝔓𝔬𝔰𝔱</text>
          <rect x="195" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="222" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 4: Monospace -->
        <g transform="translate(280, 56)">
          <rect width="265" height="46" rx="10" fill="#141c2c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">MONOSPACE / TECH</text>
          <text x="12" y="36" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#ffffff">𝚃𝚠𝚒𝚝𝚝𝚎𝚛 𝙿𝚘𝚜𝚝</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 5: Kreise / Bubble -->
        <g transform="translate(0, 112)">
          <rect width="260" height="46" rx="10" fill="#141c2c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f472b6">KREISE / STILVOLL</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Ⓣⓦⓘⓣⓣⓔⓡ Ⓟⓞⓢⓣ</text>
          <rect x="195" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="222" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 6: Aesthetic -->
        <g transform="translate(280, 112)">
          <rect width="265" height="46" rx="10" fill="#141c2c" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc">AESTHETIC / SCRIPT</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝓣𝔀𝓲𝓽𝓽𝓮𝓻 𝓟𝓸𝓼𝓽</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Bottom CTA -->
        <g transform="translate(0, 168)">
          <rect width="545" height="46" rx="10" fill="#1d9bf0"/>
          <text x="272" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">⚡ 500+ Stile für X im Schriftarten Generator ausprobieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tgFlowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="tgStepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2AABEE"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="tgFlowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#tgFlowBg)"/>

  <!-- Ambient Glows -->
  <circle cx="250" cy="220" r="240" fill="#229ED9" fill-opacity="0.08"/>
  <circle cx="950" cy="450" r="260" fill="#7dd3fc" fill-opacity="0.06"/>

  <!-- Badge &amp; Header -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#0f1f38" stroke="#229ED9" stroke-opacity="0.35"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" letter-spacing="1.5">TELEGRAM WORKFLOW</text>
  </g>

  <text x="600" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff">
    Wie erstelle ich eine Telegram Schrift?
  </text>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    In 4 einfachen Schritten vom Standardtext zum stylischen Telegram-Post &amp; Kanal-Namen
  </text>

  <!-- 4 Step Cards Grid -->
  <g transform="translate(70, 200)">
    
    <!-- Step 1: Text eingeben -->
    <g transform="translate(0, 0)" filter="url(#tgFlowShadow)">
      <rect width="245" height="400" rx="20" fill="#0d172a" stroke="#229ED9" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="url(#tgStepGrad)"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#000000">1</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Text eingeben</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Öffne den Generator und tippe deinen Kanal-Namen oder Nachricht ein.
      </text>

      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#060b16" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">EINGABETEXT</text>
        <rect x="15" y="42" width="175" height="45" rx="8" fill="#13233c" stroke="#229ED9" stroke-opacity="0.4"/>
        <text x="26" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Crypto News 🚀</text>
        
        <rect x="15" y="105" width="175" height="85" rx="8" fill="#13233c" stroke="#ffffff" stroke-opacity="0.04"/>
        <text x="26" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Für: Kanäle &amp; Gruppen</text>
        <text x="26" y="152" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">500+ Stile bereit</text>
        <text x="26" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#22c55e">✓ Sofort kopierbar</text>
      </g>
    </g>

    <!-- Step 2: Stil auswählen -->
    <g transform="translate(270, 0)" filter="url(#tgFlowShadow)">
      <rect width="245" height="400" rx="20" fill="#0d172a" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="#152640" stroke="#229ED9" stroke-width="2"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#7dd3fc">2</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Stil wählen</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Vergleiche fette, kursive, Fraktur- &amp; Monospace-Stile.
      </text>

      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#060b16" stroke="#ffffff" stroke-opacity="0.06"/>
        
        <rect x="15" y="15" width="175" height="42" rx="8" fill="#13233c"/>
        <text x="25" y="41" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">𝗖𝗿𝘆𝗽𝘁𝗼 𝗡𝗲𝘄𝘀 🚀</text>
        
        <rect x="15" y="66" width="175" height="42" rx="8" fill="#1b3658" stroke="#229ED9" stroke-width="1.5"/>
        <text x="25" y="92" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#7dd3fc">𝕮𝖗𝖞𝖕𝖙𝖔 𝕹𝖊𝖜𝖘</text>
        <circle cx="175" cy="87" r="6" fill="#229ED9"/>

        <rect x="15" y="117" width="175" height="42" rx="8" fill="#13233c"/>
        <text x="25" y="143" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#ffffff">𝙲𝚛𝚢𝚙𝚝𝚘 𝙽𝚎𝚠𝚜</text>
      </g>
    </g>

    <!-- Step 3: Kopieren -->
    <g transform="translate(540, 0)" filter="url(#tgFlowShadow)">
      <rect width="245" height="400" rx="20" fill="#0d172a" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="#152640" stroke="#229ED9" stroke-width="2"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#7dd3fc">3</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">1-Klick Kopieren</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Klicke auf den Button und kopiere das Unicode-Ergebnis sofort.
      </text>

      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#060b16" stroke="#ffffff" stroke-opacity="0.06"/>
        
        <rect x="25" y="30" width="155" height="80" rx="10" fill="#13233c" stroke="#229ED9" stroke-opacity="0.3"/>
        <text x="102" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="900" fill="#ffffff">𝕮𝖗𝖞𝖕𝖙𝖔 𝕹𝖊𝖜𝖘</text>
        <text x="102" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7dd3fc">Unicode UTF-8</text>

        <rect x="25" y="130" width="155" height="46" rx="10" fill="url(#tgStepGrad)"/>
        <text x="102" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#000000">📋 Kopiert!</text>
      </g>
    </g>

    <!-- Step 4: Bei Telegram einfügen -->
    <g transform="translate(810, 0)" filter="url(#tgFlowShadow)">
      <rect width="245" height="400" rx="20" fill="#0d172a" stroke="#229ED9" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="url(#tgStepGrad)"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#000000">4</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">In Telegram einfügen</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Füge den Text in Chats, Kanal-Titel oder Bio ein.
      </text>

      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#060b16" stroke="#229ED9" stroke-opacity="0.2"/>
        
        <circle cx="102" cy="45" r="24" fill="url(#tgCyanGrad)"/>
        <text x="102" y="53" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">✈️</text>

        <rect x="20" y="85" width="165" height="34" rx="6" fill="#13233c" stroke="#229ED9" stroke-opacity="0.4"/>
        <text x="102" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#ffffff">𝕮𝖗𝖞𝖕𝖙𝖔 𝕹𝖊𝖜𝖘</text>

        <rect x="20" y="130" width="165" height="60" rx="6" fill="#13233c" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="30" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">Kanal-Titel aktiv:</text>
        <text x="30" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Blickfang in Chatliste ✓</text>
      </g>
    </g>

  </g>
</svg>

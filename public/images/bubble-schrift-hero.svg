<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#141828"/>
      <stop offset="100%" stop-color="#090c14"/>
    </linearGradient>
    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2438" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#131726" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bubbleHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="180" r="280" fill="#a855f7" fill-opacity="0.12"/>
  <circle cx="920" cy="480" r="300" fill="#38bdf8" fill-opacity="0.10"/>

  <!-- Subtle Circular Deco Elements -->
  <circle cx="120" cy="100" r="45" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6"/>
  <circle cx="1080" cy="560" r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6"/>
  <circle cx="1050" cy="120" r="30" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="140" cy="580" r="35" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Header Badge -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="2">🫧 CIRCLED &amp; BUBBLE TEXT</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Bubble Schrift: <tspan fill="url(#purplePinkGrad)">Runde Buchstaben zum Kopieren</tspan>
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Eingekreiste &amp; gefüllte Zeichen für Instagram, TikTok, WhatsApp, Discord &amp; Gaming
  </text>

  <!-- Big Interactive Bubble Display Card -->
  <g transform="translate(100, 215)" filter="url(#cardShadow)">
    <rect width="1000" height="400" rx="28" fill="url(#cardGrad1)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Browser Bar Top -->
    <rect width="1000" height="52" rx="28" fill="#171b2d"/>
    <rect y="28" width="1000" height="24" fill="#171b2d"/>
    <circle cx="35" cy="26" r="6" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="55" cy="26" r="6" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="75" cy="26" r="6" fill="#22c55e" fill-opacity="0.8"/>
    <rect x="350" y="13" width="300" height="26" rx="13" fill="#0d101c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="500" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" font-weight="500">schriftarten.io/schrift/bubble-schrift</text>

    <!-- Main Bubble Text Showcase Row -->
    <g transform="translate(0, 110)">
      <!-- 6 Circled Letters B - U - B - B - L - E -->
      <g transform="translate(125, 0)">
        <circle cx="55" cy="55" r="48" fill="#101424" stroke="#c084fc" stroke-width="3"/>
        <text x="55" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff">ⓑ</text>
      </g>
      <g transform="translate(255, 0)">
        <circle cx="55" cy="55" r="48" fill="#101424" stroke="#c084fc" stroke-width="3"/>
        <text x="55" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff">ⓤ</text>
      </g>
      <g transform="translate(385, 0)">
        <circle cx="55" cy="55" r="48" fill="#101424" stroke="#c084fc" stroke-width="3"/>
        <text x="55" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff">ⓑ</text>
      </g>
      <g transform="translate(515, 0)">
        <circle cx="55" cy="55" r="48" fill="#101424" stroke="#c084fc" stroke-width="3"/>
        <text x="55" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff">ⓑ</text>
      </g>
      <g transform="translate(645, 0)">
        <circle cx="55" cy="55" r="48" fill="#101424" stroke="#c084fc" stroke-width="3"/>
        <text x="55" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff">ⓛ</text>
      </g>
      <g transform="translate(775, 0)">
        <circle cx="55" cy="55" r="48" fill="#101424" stroke="#c084fc" stroke-width="3"/>
        <text x="55" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff">ⓔ</text>
      </g>
    </g>

    <!-- 3 Quick Comparison Chips Below -->
    <g transform="translate(80, 260)">
      <!-- Chip 1: Weiße Kreise -->
      <g transform="translate(0, 0)">
        <rect width="260" height="70" rx="16" fill="#101424" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="20" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">WEIßE KREISE</text>
        <text x="20" y="54" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#c084fc">ⓑⓤⓑⓑⓛⓔ</text>
      </g>
      <!-- Chip 2: Schwarze Kreise -->
      <g transform="translate(280, 0)">
        <rect width="260" height="70" rx="16" fill="#101424" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="20" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SCHWARZE KREISE</text>
        <text x="20" y="54" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">🅑🅤🅑🅑🅛🅔</text>
      </g>
      <!-- Chip 3: Box Zeichen -->
      <g transform="translate(560, 0)">
        <rect width="280" height="70" rx="16" fill="#101424" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="20" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">BOX-ZEICHEN</text>
        <text x="20" y="54" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fbbf24">🅱🆄🅱🅱🅻🅴</text>
      </g>
    </g>
  </g>
</svg>

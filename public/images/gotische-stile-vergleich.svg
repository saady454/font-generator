<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="gothStileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10"/>
      <stop offset="50%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="stileCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e2e"/>
      <stop offset="100%" stop-color="#0e121c"/>
    </linearGradient>
    <filter id="stileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#gothStileBg)"/>

  <!-- Title -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="1.5">GOTISCHE SCHRIFTSTILE</text>
    
    <text y="55" font-family="sans-serif" font-size="32" font-weight="900" fill="#ffffff">
      Fraktur, Blackletter, Old English &amp; Modern Gothic
    </text>
    <text y="85" font-family="sans-serif" font-size="14" fill="#94a3b8">
      Vier verschiedene Stile mit spezifischer historischer und visueller Wirkung
    </text>
  </g>

  <!-- 4 Style Panels -->
  <g transform="translate(60, 180)">
    
    <!-- 1. Fraktur -->
    <g transform="translate(0, 0)" filter="url(#stileShadow)">
      <rect width="250" height="380" rx="18" fill="url(#stileCardGrad)" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="90" height="24" rx="6" fill="#d97706" fill-opacity="0.2"/>
      <text x="65" y="36" font-family="sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">FRAKTUR</text>

      <text x="125" y="110" font-family="serif" font-size="44" fill="#ffffff" text-anchor="middle">𝔊𝔬𝔱𝔦𝔰𝔠𝔥</text>
      <text x="125" y="148" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">Klassisch &amp; Historisch</text>

      <line x1="20" y1="180" x2="230" y2="180" stroke="#ffffff" stroke-opacity="0.08"/>

      <g transform="translate(20, 205)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#ffffff">Einsatzbereiche:</text>
        <text y="24">• Historische Überschriften</text>
        <text y="48">• Klassische Namen &amp; Zitate</text>
        <text y="72">• Buchdruck-Ästhetik</text>
        <text y="100" font-size="11" fill="#fbbf24">✓ Hohe Wiedererkennung</text>
      </g>
    </g>

    <!-- 2. Blackletter -->
    <g transform="translate(275, 0)" filter="url(#stileShadow)">
      <rect width="250" height="380" rx="18" fill="url(#stileCardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <rect x="20" y="20" width="115" height="24" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="77" y="36" font-family="sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">BLACKLETTER</text>

      <text x="125" y="110" font-family="serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">𝕲𝖔𝖙𝖎𝖘𝖈𝖍</text>
      <text x="125" y="148" font-family="sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">Kräftig &amp; Markant</text>

      <line x1="20" y1="180" x2="230" y2="180" stroke="#ffffff" stroke-opacity="0.08"/>

      <g transform="translate(20, 205)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#ffffff">Einsatzbereiche:</text>
        <text y="24">• Gaming-Nicknames</text>
        <text y="48">• Clan-Tags &amp; Leaderboards</text>
        <text y="72">• Dunkle Social Media Bios</text>
        <text y="100" font-size="11" fill="#f59e0b">✓ Starke Signalwirkung</text>
      </g>
    </g>

    <!-- 3. Old English -->
    <g transform="translate(550, 0)" filter="url(#stileShadow)">
      <rect width="250" height="380" rx="18" fill="url(#stileCardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <rect x="20" y="20" width="110" height="24" rx="6" fill="#a855f7" fill-opacity="0.15"/>
      <text x="75" y="36" font-family="sans-serif" font-size="11" font-weight="800" fill="#c084fc" text-anchor="middle">OLD ENGLISH</text>

      <text x="125" y="110" font-family="serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">⚔️ 𝕶𝖎𝖓𝖌 ⚔️</text>
      <text x="125" y="148" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">Dekorativ &amp; Traditionell</text>

      <line x1="20" y1="180" x2="230" y2="180" stroke="#ffffff" stroke-opacity="0.08"/>

      <g transform="translate(20, 205)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#ffffff">Einsatzbereiche:</text>
        <text y="24">• Fantasy &amp; Rollenspiele</text>
        <text y="48">• Mittelalterliche Profile</text>
        <text y="72">• Zitate &amp; Wappen-Designs</text>
        <text y="100" font-size="11" fill="#c084fc">✓ Traditioneller Flair</text>
      </g>
    </g>

    <!-- 4. Modern Gothic -->
    <g transform="translate(825, 0)" filter="url(#stileShadow)">
      <rect width="255" height="380" rx="18" fill="url(#stileCardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="20" width="125" height="24" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="82" y="36" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">MODERNE GOTHIC</text>

      <text x="127" y="110" font-family="monospace" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">༺ 𝕷𝖊𝖌𝖊𝖓𝖉 ༻</text>
      <text x="127" y="148" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Dunkel &amp; Auffällig</text>

      <line x1="20" y1="180" x2="235" y2="180" stroke="#ffffff" stroke-opacity="0.08"/>

      <g transform="translate(20, 205)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#ffffff">Einsatzbereiche:</text>
        <text y="24">• Tattoo &amp; Streetwear</text>
        <text y="48">• TikTok &amp; Instagram Bios</text>
        <text y="72">• Musik &amp; Dark Aesthetic</text>
        <text y="100" font-size="11" fill="#38bdf8">✓ Urbaner Style</text>
      </g>
    </g>

  </g>
</svg>

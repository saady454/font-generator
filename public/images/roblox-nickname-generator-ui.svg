<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="rbxUiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#06070d"/>
    </linearGradient>
    <linearGradient id="rbxUiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="rbxUiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#rbxUiBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#ec4899" fill-opacity="0.08"/>
  <circle cx="1000" cy="460" r="240" fill="#8b5cf6" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e1832" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">KREATIVE STILE &amp; THEMEN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Roblox Namensideen <tspan fill="url(#rbxUiGrad)">nach Spielstil</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Vom coolen Gamertag bis zum süßen Aesthetic-Namen für dein Roblox-Profil
    </text>
  </g>

  <!-- 5 Style Cards (2 top, 3 bottom) -->
  <g transform="translate(60, 145)">
    
    <!-- Card 1: Cool -->
    <g transform="translate(0, 0)" filter="url(#rbxUiShadow)">
      <rect width="525" height="150" rx="18" fill="#131024" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="80" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.15"/>
      <text x="60" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a78bfa">1. COOL</text>
      
      <rect x="120" y="18" width="385" height="50" rx="10" fill="#080612"/>
      <text x="312" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">ShadowNova &amp;bull; FrostByte</text>

      <g transform="translate(20, 90)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Dunkel, kraftvoll &amp; modern</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">Ideal für: <tspan fill="#94a3b8" font-weight="400">Action-Games, Blox Fruits, Bedwars</tspan></text>
      </g>
    </g>

    <!-- Card 2: Cute -->
    <g transform="translate(555, 0)" filter="url(#rbxUiShadow)">
      <rect width="525" height="150" rx="18" fill="#131024" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="80" height="24" rx="6" fill="#ec4899" fill-opacity="0.15"/>
      <text x="60" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">2. CUTE</text>
      
      <rect x="120" y="18" width="385" height="50" rx="10" fill="#080612"/>
      <text x="312" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">BunnyStar &amp;bull; CloudyCat</text>

      <g transform="translate(20, 90)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Aesthetic, süß &amp; verspielt</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6">Ideal für: <tspan fill="#94a3b8" font-weight="400">Adopt Me, Royale High, Brookhaven</tspan></text>
      </g>
    </g>

    <!-- Card 3: Lustig -->
    <g transform="translate(0, 175)" filter="url(#rbxUiShadow)">
      <rect width="340" height="290" rx="18" fill="#131024" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="85" height="24" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="62" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">3. LUSTIG</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#080612"/>
      <text x="170" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">KuchenNinja</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Humorvoll &amp; sympathisch</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Beispiele: <tspan fill="#94a3b8" font-weight="400">WaffelPro, PixelOpa</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Perfekt für entspannte Runden mit Freunden.</text>
      </g>
    </g>

    <!-- Card 4: Fantasy -->
    <g transform="translate(370, 175)" filter="url(#rbxUiShadow)">
      <rect width="340" height="290" rx="18" fill="#131024" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="105" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="72" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">4. FANTASY</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#080612"/>
      <text x="170" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">DragonVale</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Episch &amp; abenteuerlich</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Beispiele: <tspan fill="#94a3b8" font-weight="400">MysticFox, MoonRider</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Ideal für RPGs &amp; Fantasy-Welten.</text>
      </g>
    </g>

    <!-- Card 5: Clean -->
    <g transform="translate(740, 175)" filter="url(#rbxUiShadow)">
      <rect width="340" height="290" rx="18" fill="#131024" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="85" height="24" rx="6" fill="#34d399" fill-opacity="0.15"/>
      <text x="62" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">5. CLEAN</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#080612"/>
      <text x="170" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Nexa &amp;bull; Zeron</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Schlicht &amp; einprägsam</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Beispiele: <tspan fill="#94a3b8" font-weight="400">Vexo, Rivo, Nexa</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Maximale Lesbarkeit im Chat.</text>
      </g>
    </g>

  </g>
</svg>

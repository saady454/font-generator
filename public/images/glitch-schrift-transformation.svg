<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="transBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="50%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="transShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#transBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#38bdf8" fill-opacity="0.10"/>
  <circle cx="1000" cy="480" r="240" fill="#ec4899" fill-opacity="0.10"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">UNICODE TRANSFORMATION</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Wie entsteht der <tspan fill="url(#flowGrad)">Glitch-Effekt?</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Schrittweise Überlagerung von Grundbuchstaben mit Combining Diacritical Marks
    </text>
  </g>

  <!-- 4 Step Flow Cards (Left: Clean -> Right: Heavy Glitch) -->
  <g transform="translate(60, 160)">
    
    <!-- Step 1: Normaler Basisbuchstabe -->
    <g transform="translate(0, 0)" filter="url(#transShadow)">
      <rect width="250" height="420" rx="20" fill="#121626" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
      <rect x="20" y="20" width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
      <text x="75" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">1. BASIS-TEXT</text>

      <rect x="20" y="65" width="210" height="150" rx="14" fill="#080a12" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="125" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff">G</text>

      <g transform="translate(20, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Basis-Zeichen:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Lateinisches „G“ (U+0047)</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Saubere Glyphe</text>
        <text x="0" y="76" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">✓ Standard Lesbarkeit</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <text x="265" y="235" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#38bdf8">→</text>

    <!-- Step 2: Leichte Diakritika -->
    <g transform="translate(285, 0)" filter="url(#transShadow)">
      <rect width="250" height="420" rx="20" fill="#121626" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="13" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="85" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">2. LEICHTER GLITCH</text>

      <rect x="20" y="65" width="210" height="150" rx="14" fill="#080a12" stroke="#06b6d4" stroke-opacity="0.2"/>
      <text x="125" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#38bdf8">G̵</text>

      <g transform="translate(20, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">+ 1 Combining Mark:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Combining Short Stroke Overlay (U+0335)</text>
        <text x="0" y="76" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">✓ 99% Kompatibel</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <text x="550" y="235" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ec4899">→</text>

    <!-- Step 3: Mittlere Verzerrung -->
    <g transform="translate(570, 0)" filter="url(#transShadow)">
      <rect width="250" height="420" rx="20" fill="#121626" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="13" fill="#ec4899" fill-opacity="0.15"/>
      <text x="85" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">3. MEDIUM ZALGO</text>

      <rect x="20" y="65" width="210" height="150" rx="14" fill="#080a12" stroke="#ec4899" stroke-opacity="0.2"/>
      <text x="125" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#f472b6">G̸̷</text>

      <g transform="translate(20, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6">+ 3 Marks (Up/Down):</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Zeichen über &amp; unter Grundlinie gestapelt</text>
        <text x="0" y="76" font-family="system-ui, sans-serif" font-size="12" fill="#f472b6">✓ Auffälliger Kontrast</text>
      </g>
    </g>

    <!-- Arrow 3 -->
    <text x="835" y="235" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ef4444">→</text>

    <!-- Step 4: Extremer Zalgo-Effekt -->
    <g transform="translate(855, 0)" filter="url(#transShadow)">
      <rect width="225" height="420" rx="20" fill="#121626" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="13" fill="#ef4444" fill-opacity="0.15"/>
      <text x="85" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f87171">4. CHAOS ZALGO</text>

      <rect x="20" y="65" width="185" height="150" rx="14" fill="#080a12" stroke="#ef4444" stroke-opacity="0.3"/>
      <text x="112" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ef4444">G̷̶̴̵</text>

      <g transform="translate(20, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">Kaskadierende Marks:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Mehrfache Stapelung</text>
        <text x="0" y="76" font-family="system-ui, sans-serif" font-size="12" fill="#f87171">⚠️ App-Höhenlimit</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="dcVsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="50%" stop-color="#101426"/>
      <stop offset="100%" stop-color="#06070e"/>
    </linearGradient>
    <linearGradient id="dcVsGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#808bf5"/>
    </linearGradient>
    <linearGradient id="dcVsGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dcVsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#dcVsBg)"/>

  <!-- Ambient Lights -->
  <circle cx="300" cy="200" r="260" fill="#5865F2" fill-opacity="0.08"/>
  <circle cx="900" cy="450" r="280" fill="#808bf5" fill-opacity="0.08"/>

  <!-- Badge &amp; Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#181b30" stroke="#5865F2" stroke-opacity="0.35"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#808bf5" letter-spacing="1.5">TECHNISCHER VERGLEICH</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff">
    Unicode-Schrift vs. Installierte Font-Datei &amp; Nitro Styles
  </text>
  <text x="600" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Warum Unicode-Zeichen überall ohne Download oder Nitro-Abo als Text kopiert werden können
  </text>

  <!-- 2 Big Comparison Cards Side by Side -->
  <g transform="translate(100, 185)">
    
    <!-- Left Card: Unicode Text (Generator) -->
    <g transform="translate(0, 0)" filter="url(#dcVsShadow)">
      <rect width="480" height="420" rx="22" fill="#0f1222" stroke="#5865F2" stroke-width="2"/>
      
      <rect x="25" y="24" width="160" height="28" rx="8" fill="#5865F2" fill-opacity="0.2"/>
      <text x="105" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#808bf5">✨ UNICODE-TEXT</text>

      <text x="25" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">
        Kopierbare Sonderzeichen
      </text>
      <text x="25" y="110" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
        Basiert auf dem weltweiten UTF-8 Standard
      </text>

      <!-- Visual Demonstration Box -->
      <g transform="translate(25, 130)">
        <rect width="430" height="130" rx="14" fill="#090b14" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#808bf5">LIVE GENERIERT:</text>
        <text x="20" y="65" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">𝕯𝖎𝔰𝔠𝔬𝔯𝔡 &amp;bull; 𝘝𝘪𝘣𝘦𝘴 &amp;bull; ᴅɪꜱᴄᴏʀᴅ</text>
        <text x="20" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">✓ Funktioniert in Anzeigenamen &amp; Rollen</text>
      </g>

      <!-- Bullet Points -->
      <g transform="translate(25, 285)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
        <text x="0" y="20"><tspan fill="#22c55e" font-weight="900">✓</tspan> Kein Download oder Installation nötig</text>
        <text x="0" y="48"><tspan fill="#22c55e" font-weight="900">✓</tspan> Funktioniert ohne kostenpflichtiges Discord Nitro</text>
        <text x="0" y="76"><tspan fill="#22c55e" font-weight="900">✓</tspan> Universell als reiner Text kopierbar</text>
        <text x="0" y="104"><tspan fill="#22c55e" font-weight="900">✓</tspan> Lesbar auf iOS, Android, macOS &amp; Windows</text>
      </g>
    </g>

    <!-- Right Card: TTF / OTF / Nitro Styles -->
    <g transform="translate(520, 0)" filter="url(#dcVsShadow)">
      <rect width="480" height="420" rx="22" fill="#0f1222" stroke="#ffffff" stroke-opacity="0.08"/>
      
      <rect x="25" y="24" width="180" height="28" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="115" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#94a3b8">📁 FONT-DATEI &amp; NITRO</text>

      <text x="25" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">
        Installierte Schriftdateien
      </text>
      <text x="25" y="110" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
        Klassische TTF/OTF-Dateien oder App-Features
      </text>

      <!-- Visual Demonstration Box -->
      <g transform="translate(25, 130)">
        <rect width="430" height="130" rx="14" fill="#090b14" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">LOKAL / NITRO ABHÄNGIG:</text>
        <text x="20" y="65" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#94a3b8">CustomFont.ttf / Nitro Theme</text>
        <text x="20" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#eab308">⚠️ Nicht in Web-Textfeldern als Font einbettbar</text>
      </g>

      <!-- Bullet Points -->
      <g transform="translate(25, 285)" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
        <text x="0" y="20"><tspan fill="#ef4444" font-weight="900">✕</tspan> Kann nicht als Textdatei in Chats eingefügt werden</text>
        <text x="0" y="48"><tspan fill="#eab308" font-weight="900">!</tspan> Nitro Display Styles erfordern monatliches Abo</text>
        <text x="0" y="76"><tspan fill="#ef4444" font-weight="900">✕</tspan> Empfänger sieht TTF nur, wenn lokal installiert</text>
        <text x="0" y="104"><tspan fill="#ef4444" font-weight="900">✕</tspan> Funktioniert nicht für Server- &amp; Kanalnamen</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="appWorkspaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121224"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="mockupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#appWorkspaceBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#f97316" fill-opacity="0.1"/>
  <circle cx="920" cy="450" r="260" fill="#ec4899" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fb923c" letter-spacing="2">KREATIVE ANWENDUNGEN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Graffiti-Schrift in <tspan fill="#fb923c">Design &amp; Streetwear</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Einsatzbereiche auf Postern, Social-Media-Grafiken und Streetwear-Textilien
    </text>
  </g>

  <!-- 3 Mockup Applications -->
  <g transform="translate(80, 160)">
    
    <!-- Card 1: Poster &amp; Event Flyer -->
    <g transform="translate(0, 0)" filter="url(#mockupShadow)">
      <rect width="325" height="440" rx="24" fill="#141424" stroke="#f97316" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#1c1c30"/>
      <rect y="20" width="325" height="20" fill="#1c1c30"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fb923c">1. POSTER &amp; EVENT-FLYER</text>

      <!-- Poster Visual Inner -->
      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#0d0d18" stroke="#f97316" stroke-opacity="0.4"/>
        
        <!-- Spray Art Background in Poster -->
        <circle cx="140" cy="120" r="80" fill="#f97316" fill-opacity="0.25"/>
        <circle cx="180" cy="140" r="60" fill="#ec4899" fill-opacity="0.25"/>
        
        <text x="142" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fb923c" letter-spacing="3">URBAN FESTIVAL 2026</text>
        <text x="142" y="125" text-anchor="middle" font-family="Impact, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">BEATS &amp;</text>
        <text x="142" y="170" text-anchor="middle" font-family="Impact, sans-serif" font-size="44" font-weight="900" fill="url(#posterGrad)" letter-spacing="4">GRAFFITI</text>
        
        <rect x="35" y="215" width="215" height="45" rx="10" fill="#1c1c30" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="142" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">24. JULI &amp;bull; BERLIN ARENA</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1c1c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fb923c">✓ Echte Font-Datei (.otf/.ttf)</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Druckfähige Vektoren &amp; Layouts</text>
    </g>

    <!-- Card 2: Social Media Thumbnail &amp; Story Graphic -->
    <g transform="translate(355, 0)" filter="url(#mockupShadow)">
      <rect width="325" height="440" rx="24" fill="#141424" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#1c1c30"/>
      <rect y="20" width="325" height="20" fill="#1c1c30"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">2. SOCIAL MEDIA &amp; THUMBNAILS</text>

      <!-- Smartphone / Story Mockup -->
      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#0d0d18" stroke="#ec4899" stroke-opacity="0.4"/>
        
        <circle cx="45" cy="40" r="18" fill="#ec4899" fill-opacity="0.2"/>
        <text x="45" y="46" text-anchor="middle" font-size="14">🎨</text>
        <text x="75" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">streetart_daily</text>
        <text x="75" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Sponsored Reel</text>

        <!-- Graphic Canvas -->
        <rect x="20" y="70" width="245" height="150" rx="10" fill="#18182a"/>
        <text x="142" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" font-style="italic" fill="#f472b6">𝒰𝓇𝒷𝒶𝓃 𝒱𝒾𝒷𝑒𝓈</text>
        <text x="142" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">NEW COLLECTION</text>

        <rect x="20" y="235" width="245" height="35" rx="8" fill="#ec4899"/>
        <text x="142" y="257" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Jetzt Ansehen →</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1c1c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">✓ Hohe Klickrate</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Zieht den Blick beim Scrollen magisch an</text>
    </g>

    <!-- Card 3: Streetwear &amp; T-Shirt Design -->
    <g transform="translate(710, 0)" filter="url(#mockupShadow)">
      <rect width="325" height="440" rx="24" fill="#141424" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#1c1c30"/>
      <rect y="20" width="325" height="20" fill="#1c1c30"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">3. STREETWEAR &amp; T-SHIRTS</text>

      <!-- T-Shirt Graphic Mockup -->
      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#0d0d18" stroke="#38bdf8" stroke-opacity="0.4"/>
        
        <!-- Minimal T-Shirt Silhouette Outline -->
        <path d="M70,30 L115,30 Q142,50 170,30 L215,30 L255,75 L225,100 L205,80 L205,270 L80,270 L80,80 L60,100 L30,75 Z" fill="#18182a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
        
        <!-- Print Area on Chest -->
        <g transform="translate(142, 160)" text-anchor="middle">
          <text y="0" font-family="'Arial Black', Impact, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" letter-spacing="3">RAW STREET</text>
          <text y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">AUTHENTIC</text>
          <line x1="-50" y1="35" x2="50" y2="35" stroke="#38bdf8" stroke-width="2"/>
        </g>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1c1c30"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">✓ Textildruck &amp; Merch</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Kommerzielle Lizenzprüfung beachten</text>
    </g>

  </g>
</svg>

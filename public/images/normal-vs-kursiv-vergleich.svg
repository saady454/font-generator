<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="compKbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="rowKgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b2034"/>
      <stop offset="100%" stop-color="#121524"/>
    </linearGradient>
    <filter id="rowKshadow" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#compKbg)"/>

  <!-- Top Title -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff">
      Vergleich: <tspan fill="#94a3b8">Normaler Text</tspan> vs. <tspan fill="#f472b6">Kursive Schriftarten</tspan>
    </text>
    <text y="32" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Derselbe Satz „Hallo Welt“ in unterschiedlichen Neigungswinkeln und Schnitten
    </text>
  </g>

  <!-- Comparison Rows -->
  <g transform="translate(100, 140)">
    
    <!-- Row 1: Normaler Standardtext -->
    <g transform="translate(0, 0)" filter="url(#rowKshadow)">
      <rect width="1000" height="95" rx="16" fill="url(#rowKgrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="25" y="32" width="130" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <text x="90" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">STANDARD TEXT</text>
      
      <text x="200" y="56" font-family="system-ui, sans-serif" font-size="24" fill="#e2e8f0">Hallo Welt — Schöne Gedanken &amp; Zitate</text>
      <text x="890" y="54" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="end">Basis / Fließtext</text>
    </g>

    <!-- Row 2: Kursiv Sans (Italic Sans) -->
    <g transform="translate(0, 115)" filter="url(#rowKshadow)">
      <rect width="1000" height="95" rx="16" fill="url(#rowKgrad)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="25" y="32" width="130" height="30" rx="8" fill="#ec4899" fill-opacity="0.2"/>
      <text x="90" y="52" font-family="sans-serif" font-size="12" font-weight="800" fill="#f472b6" text-anchor="middle">KURSIV SANS</text>
      
      <text x="200" y="56" font-family="system-ui, sans-serif" font-size="24" font-style="italic" font-weight="600" fill="#ffffff">𝘏𝘢𝘭𝘭𝘰 𝘞𝘦𝘭𝘵 — 𝘚𝘤𝘩ö𝘯𝘦 𝘎𝘦𝘥𝘢𝘯𝘬𝘦𝘯 &amp; 𝘡𝘪𝘵𝘢𝘵𝘦</text>
      <text x="890" y="54" font-family="sans-serif" font-size="13" font-weight="700" fill="#f472b6" text-anchor="end">🌸 Modern &amp; Subtil</text>
    </g>

    <!-- Row 3: Kursiv Serif (Italic Serif) -->
    <g transform="translate(0, 230)" filter="url(#rowKshadow)">
      <rect width="1000" height="95" rx="16" fill="url(#rowKgrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="25" y="32" width="130" height="30" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="90" y="52" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">KURSIV SERIF</text>
      
      <text x="200" y="56" font-family="'Times New Roman', serif" font-size="25" font-style="italic" fill="#ffffff">𝐻𝑎𝑙𝑙𝑜 𝑊𝑒𝑙𝑡 — 𝑆𝑐ℎö𝑛𝑒 𝐺𝑒𝑑𝑎𝑛𝑘𝑒𝑛 &amp; 𝑍𝑖𝑡𝑎𝑡𝑒</text>
      <text x="890" y="54" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="end">Klassisch &amp; Poetisch</text>
    </g>

    <!-- Row 4: Fett Kursiv (Bold Italic) -->
    <g transform="translate(0, 345)" filter="url(#rowKshadow)">
      <rect width="1000" height="95" rx="16" fill="url(#rowKgrad)" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="25" y="32" width="130" height="30" rx="8" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="90" y="52" font-family="sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">FETT KURSIV</text>
      
      <text x="200" y="56" font-family="sans-serif" font-size="23" font-weight="800" font-style="italic" fill="#ffffff">𝑯𝒂𝒍𝒍𝒐 𝑾𝒆𝒍𝒕 — 𝑺𝒄𝒉ö𝒏𝒆 𝑮𝒆𝒅𝒂𝒏𝒌𝒆𝒏 &amp; 𝒁𝒊𝒕𝒂𝒕𝒆</text>
      <text x="890" y="54" font-family="sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="end">🔥 Höchste Signalwirkung</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <text x="600" y="635" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">
    Alle Kursivvarianten lassen sich per Klick in die Zwischenablage kopieren und plattformübergreifend einfügen.
  </text>
</svg>

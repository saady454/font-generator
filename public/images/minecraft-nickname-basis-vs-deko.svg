<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="mcCompSplitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e0a"/>
      <stop offset="50%" stop-color="#0f2218"/>
      <stop offset="100%" stop-color="#040906"/>
    </linearGradient>
    <linearGradient id="mcGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="mcPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="mcSplitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#mcCompSplitBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#10b981" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#a855f7" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#132a1e" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34d399" letter-spacing="2">PRAXIS-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Basisname <tspan fill="url(#mcGreenGrad)">vs.</tspan> Dekorativer Unicode-Nickname
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wann sich ein schlichter Name empfiehlt und wann stilisierte Schriften punkten
    </text>
  </g>

  <!-- Split Comparison Cards -->
  <g transform="translate(80, 155)">
    
    <!-- Left Card: Basisname -->
    <g transform="translate(0, 0)" filter="url(#mcSplitShadow)">
      <rect width="500" height="440" rx="24" fill="#0f2218" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
      
      <g transform="translate(25, 25)">
        <rect width="140" height="28" rx="8" fill="#10b981" fill-opacity="0.2"/>
        <text x="70" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">1. BASISNAME</text>
        
        <rect y="45" width="450" height="80" rx="14" fill="#060e09" stroke="#10b981" stroke-opacity="0.2"/>
        <text x="225" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">DarkWolf</text>

        <!-- Feature List -->
        <g transform="translate(0, 150)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#34d399">Vorteile &amp; Eigenschaften:</text>
          
          <g transform="translate(0, 20)">
            <text x="0" y="15" fill="#34d399" font-weight="900">✓</text>
            <text x="22" y="15">100 % kompatibel mit allen Editionen &amp; Servern</text>
          </g>

          <g transform="translate(0, 50)">
            <text x="0" y="15" fill="#34d399" font-weight="900">✓</text>
            <text x="22" y="15">Offizieller Java-Edition Kontoname</text>
          </g>

          <g transform="translate(0, 80)">
            <text x="0" y="15" fill="#34d399" font-weight="900">✓</text>
            <text x="22" y="15">Keine Probleme bei Freundeseinladungen &amp; Befehlen</text>
          </g>

          <g transform="translate(0, 110)">
            <text x="0" y="15" fill="#34d399" font-weight="900">✓</text>
            <text x="22" y="15">Schnell tippbar in /msg, /tpa oder /whisper</text>
          </g>
        </g>

        <!-- Bottom Recommendation Box -->
        <rect y="315" width="450" height="50" rx="10" fill="#060e09" stroke="#10b981" stroke-opacity="0.3"/>
        <text x="225" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">
          Empfehlung: Als festen Hauptnamen speichern
        </text>
      </g>
    </g>

    <!-- Right Card: Dekorativer Name -->
    <g transform="translate(540, 0)" filter="url(#mcSplitShadow)">
      <rect width="500" height="440" rx="24" fill="#0f2218" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
      
      <g transform="translate(25, 25)">
        <rect width="180" height="28" rx="8" fill="#a855f7" fill-opacity="0.2"/>
        <text x="90" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">2. DEKORATIVER NAME</text>
        
        <rect y="45" width="450" height="80" rx="14" fill="#060e09" stroke="#a855f7" stroke-opacity="0.2"/>
        <text x="225" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">⚔️ 𝕯𝖆𝖗𝖐𝖂𝖔𝖑𝖋 ⚔️</text>

        <!-- Feature List -->
        <g transform="translate(0, 150)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#c084fc">Vorteile &amp; Eigenschaften:</text>
          
          <g transform="translate(0, 20)">
            <text x="0" y="15" fill="#c084fc" font-weight="900">★</text>
            <text x="22" y="15">Maximaler Wiedererkennungswert im Chat</text>
          </g>

          <g transform="translate(0, 50)">
            <text x="0" y="15" fill="#c084fc" font-weight="900">★</text>
            <text x="22" y="15">Ideal für Server mit Nickname-Plugins (/nick)</text>
          </g>

          <g transform="translate(0, 80)">
            <text x="0" y="15" fill="#c084fc" font-weight="900">★</text>
            <text x="22" y="15">Perfekt für Discord, Clan-Foren &amp; YouTube/Twitch</text>
          </g>

          <g transform="translate(0, 110)">
            <text x="0" y="15" fill="#c084fc" font-weight="900">★</text>
            <text x="22" y="15">Ausdrucksstarker individueller Gaming-Look</text>
          </g>
        </g>

        <!-- Bottom Recommendation Box -->
        <rect y="315" width="450" height="50" rx="10" fill="#060e09" stroke="#a855f7" stroke-opacity="0.3"/>
        <text x="225" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">
          Empfehlung: Für Ingame-Chat &amp; Community-Profile
        </text>
      </g>
    </g>

  </g>
</svg>

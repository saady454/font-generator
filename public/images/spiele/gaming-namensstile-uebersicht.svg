<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="styleMatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="50%" stop-color="#120d2b"/>
      <stop offset="100%" stop-color="#050312"/>
    </linearGradient>
    <linearGradient id="styleMatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="styleMatShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#styleMatBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#ec4899" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#3b82f6" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ec4899" letter-spacing="2">GAMERTAG-STILRICHTUNGEN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Die 6 beliebtesten <tspan fill="url(#styleMatGrad)">Gaming-Namensstile</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Vom minimalistischen Pro-Look bis zu epischen Fantasy- und Clan-Symbolen
    </text>
  </g>

  <!-- 6 Grid Columns -->
  <g transform="translate(80, 150)">
    
    <!-- 1. Clean &amp; Minimal -->
    <g transform="translate(0, 0)" filter="url(#styleMatShadow)">
      <rect width="325" height="205" rx="16" fill="#111827" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">1. CLEAN &amp; MINIMAL</text>
        <rect y="30" width="285" height="60" rx="8" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">NovaWolf &amp;bull; PixelRush</text>
        
        <text x="0" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ 2 kurze Wörter ohne Sonderzeichen</text>
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Leicht merkbar &amp; auf allen Plattformen gültig</text>
      </g>
    </g>

    <!-- 2. Pro &amp; Kompetitiv -->
    <g transform="translate(355, 0)" filter="url(#styleMatShadow)">
      <rect width="325" height="205" rx="16" fill="#111827" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fbbf24">2. PRO &amp; KOMPETITIV</text>
        <rect y="30" width="285" height="60" rx="8" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24">𝗖𝗹𝘂𝘁𝗰𝗵𝗔𝗶𝗺 &amp;bull; 𝗣𝗿𝗶𝗺𝗲𝗖𝗼𝗿𝗲</text>
        
        <text x="0" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Fette Buchstaben für starke Dominanz</text>
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Perfekt für Valorant, CS2 &amp; Ranked</text>
      </g>
    </g>

    <!-- 3. Fantasy &amp; Roleplay -->
    <g transform="translate(710, 0)" filter="url(#styleMatShadow)">
      <rect width="325" height="205" rx="16" fill="#111827" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#22c55e">3. FANTASY &amp; RPG</text>
        <rect y="30" width="285" height="60" rx="8" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">𝔖𝔥𝔞𝔡𝔬𝔴_𝔎𝔫𝔦𝔤𝔥𝔱 &amp;bull; 𝕸𝖞𝖘𝖙𝖎𝖈</text>
        
        <text x="0" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Historische Fraktur &amp; Mittelalter-Look</text>
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Beliebt auf Minecraft-Servern &amp; MMOs</text>
      </g>
    </g>

    <!-- 4. Aesthetic &amp; Cute -->
    <g transform="translate(0, 230)" filter="url(#styleMatShadow)">
      <rect width="325" height="205" rx="16" fill="#111827" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ec4899">4. AESTHETIC &amp; CUTE</text>
        <rect y="30" width="285" height="60" rx="8" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">❤ Ⓟⓡⓘⓝⓒⓔⓢⓢ ❤ &amp;bull; 𝒮𝓉𝒶𝓇</text>
        
        <text x="0" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Bubble-Fonts, Herz- &amp; Stern-Symbole</text>
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Ideal für Roblox, Discord &amp; Streamer</text>
      </g>
    </g>

    <!-- 5. Mobile &amp; Symbols -->
    <g transform="translate(355, 230)" filter="url(#styleMatShadow)">
      <rect width="325" height="205" rx="16" fill="#111827" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#a855f7">5. MOBILE &amp; SYMBOLE</text>
        <rect y="30" width="285" height="60" rx="8" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">꧁ঔৣ☬V̶i̶p̶e̶r̶☬ঔৣ꧂</text>
        
        <text x="0" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Flügel, Kronen &amp; dekorative Rahmen</text>
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Beliebt in Free Fire, PUBG &amp; Brawl Stars</text>
      </g>
    </g>

    <!-- 6. Clan &amp; Esports Tag -->
    <g transform="translate(710, 230)" filter="url(#styleMatShadow)">
      <rect width="325" height="205" rx="16" fill="#111827" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#10b981">6. CLAN &amp; ESPORTS TAG</text>
        <rect y="30" width="285" height="60" rx="8" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">[🄲🄻🄰🄽] 𝕾𝖍𝖆𝖉𝖔𝖜</text>
        
        <text x="0" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Eckige Buchstaben für strukturierte Teams</text>
        <text x="0" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✓ Perfekt für Steam-Gruppen &amp; CS2-Clans</text>
      </g>
    </g>

  </g>
</svg>

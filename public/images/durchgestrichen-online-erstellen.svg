<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#121628"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="stepShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#stepBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="200" r="220" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="1000" cy="450" r="240" fill="#818cf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">ONLINE-GENERATOR</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      In 4 einfachen Schritten: <tspan fill="url(#stepGrad)">Erstellen &amp; Kopieren</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Schnelle Textumwandlung ohne Software-Download für Web, WhatsApp und Social Media
    </text>
  </g>

  <!-- 4 Step Cards Grid -->
  <g transform="translate(60, 160)">
    
    <!-- Step 1: Text eingeben -->
    <g transform="translate(0, 0)" filter="url(#stepShadow)">
      <rect width="250" height="440" rx="20" fill="#121728" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
      
      <circle cx="45" cy="45" r="20" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#38bdf8">1</text>
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">TEXT EINGEBEN</text>

      <g transform="translate(20, 85)">
        <rect width="210" height="170" rx="14" fill="#090c16" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">EINGABEFELD</text>
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Rabatt: 50 €</text>
        <line x1="15" y1="75" x2="105" y2="75" stroke="#38bdf8" stroke-dasharray="2 2"/>
      </g>

      <g transform="translate(20, 275)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Aktion:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Schreibe Wörter, Sätze oder Preise in das Textfeld.</text>
      </g>
    </g>

    <!-- Step 2: Vorschau prüfen -->
    <g transform="translate(275, 0)" filter="url(#stepShadow)">
      <rect width="250" height="440" rx="20" fill="#121728" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5"/>
      
      <circle cx="45" cy="45" r="20" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#818cf8">2</text>
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">VORSCHAU</text>

      <g transform="translate(20, 85)">
        <rect width="210" height="170" rx="14" fill="#090c16" stroke="#818cf8" stroke-opacity="0.3"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#818cf8">AUTO-KONVERTIERUNG</text>
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">5̶0̶ ̶€̶ (Durchstrich)</text>
        <text x="15" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">5̸0̸ ̸€̸ (Slash)</text>
        <text x="15" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">5̴0̴ ̴€̴ (Welle)</text>
      </g>

      <g transform="translate(20, 275)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8">Aktion:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Wähle deinen bevorzugten Strikethrough-Stil.</text>
      </g>
    </g>

    <!-- Step 3: Kopieren -->
    <g transform="translate(550, 0)" filter="url(#stepShadow)">
      <rect width="250" height="440" rx="20" fill="#121728" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1.5"/>
      
      <circle cx="45" cy="45" r="20" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#c084fc">3</text>
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">KOPIEREN</text>

      <g transform="translate(20, 85)">
        <rect width="210" height="170" rx="14" fill="#090c16" stroke="#a855f7" stroke-opacity="0.3"/>
        
        <rect x="25" y="55" width="160" height="48" rx="10" fill="#a855f7"/>
        <text x="105" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">📋 KOPIEREN</text>
        <text x="105" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e" font-weight="700">✓ In Zwischenablage</text>
      </g>

      <g transform="translate(20, 275)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Aktion:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">1-Klick Kopierbutton übernimmt das Ergebnis sofort.</text>
      </g>
    </g>

    <!-- Step 4: Einfügen -->
    <g transform="translate(825, 0)" filter="url(#stepShadow)">
      <rect width="250" height="440" rx="20" fill="#121728" stroke="#22c55e" stroke-opacity="0.25" stroke-width="1.5"/>
      
      <circle cx="45" cy="45" r="20" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#4ade80">4</text>
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">EINFÜGEN</text>

      <g transform="translate(20, 85)">
        <rect width="210" height="170" rx="14" fill="#090c16" stroke="#22c55e" stroke-opacity="0.3"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#22c55e">ZIEL-APPS</text>
        
        <text x="15" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">📸 Instagram Bio</text>
        <text x="15" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">💬 WhatsApp Chat</text>
        <text x="15" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">🎮 Discord &amp; Foren</text>
      </g>

      <g transform="translate(20, 275)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Aktion:</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Über Strg+V bzw. Halten &amp; Einfügen direkt nutzen.</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="checkStudioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="50%" stop-color="#141422"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <filter id="checkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#checkStudioBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#f59e0b" fill-opacity="0.1"/>
  <circle cx="920" cy="450" r="260" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">QUALITÄTS-CHECKLISTE</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Worauf sollte man vor dem <tspan fill="#fbbf24">Tätowieren achten?</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Drei entscheidende Kriterien: Rechtschreibung, Motivgröße &amp; Körperplatzierung
    </text>
  </g>

  <!-- 3 Quality Pillar Cards -->
  <g transform="translate(80, 160)">
    
    <!-- Card 1: Text &amp; Rechtschreibung -->
    <g transform="translate(0, 0)" filter="url(#checkShadow)">
      <rect width="325" height="440" rx="24" fill="#12121e" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#18182a"/>
      <rect y="20" width="325" height="20" fill="#18182a"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#4ade80">1. TEXT &amp; RECHTSCHREIBUNG</text>

      <!-- Inner Specimen -->
      <g transform="translate(20, 55)">
        <rect width="285" height="200" rx="14" fill="#090912" stroke="#22c55e" stroke-opacity="0.3"/>
        <text x="142" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ade80">KORREKTUR-PRÜFUNG</text>
        
        <text x="25" y="85" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#ffffff">„Carpe Diem“</text>
        <text x="25" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">✓ Grammatik &amp; Fall geprüft</text>
        <text x="25" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">✓ Römische Ziffern: XII.IV.MMXXIV</text>
        <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">✓ Namen &amp; Umlaute geprüft</text>
      </g>

      <g transform="translate(20, 275)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Wichtig:</text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Lass fremdsprachige Zitate immer von Muttersprachlern gegenlesen.</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#18182a"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ade80">✓ Null Fehler-Toleranz</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Ein Tattoo bleibt für immer</text>
    </g>

    <!-- Card 2: Größe &amp; Linienstärke -->
    <g transform="translate(355, 0)" filter="url(#checkShadow)">
      <rect width="325" height="440" rx="24" fill="#12121e" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#18182a"/>
      <rect y="20" width="325" height="20" fill="#18182a"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24">2. GRÖSSE &amp; LINIENABSTAND</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="200" rx="14" fill="#090912" stroke="#f59e0b" stroke-opacity="0.3"/>
        <text x="142" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">BLOWOUT-VERMEIDUNG</text>
        
        <text x="25" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Aging &amp; Hautdehnung:</text>
        <text x="25" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Tinte verläuft mit den Jahren minimal</text>
        <text x="25" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Buchstabenabstände großzügig planen</text>
        <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">⚠️ Keine mikroskopischen Schnörkel</text>
      </g>

      <g transform="translate(20, 275)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Wichtig:</text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Zu kleine Schriftzüge „verschwimmen“ nach 5 bis 10 Jahren optisch.</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#18182a"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">✓ Klare Lesbarkeit</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Ausreichend Raum zwischen Buchstaben</text>
    </g>

    <!-- Card 3: Platzierung am Körper -->
    <g transform="translate(710, 0)" filter="url(#checkShadow)">
      <rect width="325" height="440" rx="24" fill="#12121e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#18182a"/>
      <rect y="20" width="325" height="20" fill="#18182a"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">3. KÖRPERPLATZIERUNG</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="200" rx="14" fill="#090912" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="142" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">ANATOMISCHER FLUSS</text>
        
        <text x="25" y="85" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">💪 <strong>Unterarm:</strong> Horizontal/Vertikal</text>
        <text x="25" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">🦴 <strong>Schlüsselbein:</strong> Leicht geschwungen</text>
        <text x="25" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">🫁 <strong>Rippenbogen:</strong> Gerade oder Bogen</text>
        <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">✓ Stencil vor dem Stechen im Spiegel prüfen</text>
      </g>

      <g transform="translate(20, 275)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Wichtig:</text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Bewege dich mit der Schablone (Stehen, Sitzen), um Verzerrungen zu sehen.</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#18182a"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">✓ Harmonie mit dem Körper</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Gemeinsam mit Artist anpassen</text>
    </g>

  </g>
</svg>

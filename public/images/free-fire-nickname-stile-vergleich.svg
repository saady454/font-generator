<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ffStileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0705"/>
      <stop offset="50%" stop-color="#1f1107"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
    <linearGradient id="ffStileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <filter id="ffStileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ffStileBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#ff7a00" fill-opacity="0.08"/>
  <circle cx="1000" cy="460" r="240" fill="#fbbf24" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#261306" stroke="#ff7a00" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ff9933" letter-spacing="2">TYPOGRAFIE &amp; STILE</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Schriftstile für <tspan fill="url(#ffStileGrad)">Free Fire Nicknames</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Vom fetten Pro-Look bis zu mystischen gotischen Gaming-Schriften
    </text>
  </g>

  <!-- 5 Style Cards (2 top, 3 bottom) -->
  <g transform="translate(60, 145)">
    
    <!-- Card 1: Fett -->
    <g transform="translate(0, 0)" filter="url(#ffStileShadow)">
      <rect width="525" height="150" rx="18" fill="#170d06" stroke="#ff7a00" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="75" height="24" rx="6" fill="#ff7a00" fill-opacity="0.15"/>
      <text x="57" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ff9933">1. FETT</text>
      
      <rect x="110" y="18" width="395" height="50" rx="10" fill="#0b0603"/>
      <text x="307" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">𝗦𝗵𝗮𝗱𝗼𝘄 &amp;bull; 𝗣𝗿𝗼𝗔𝗶𝗺</text>

      <g transform="translate(20, 90)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Klar, dominant und extrem gut lesbar</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff9933">Geeignet für: <tspan fill="#94a3b8" font-weight="400">Kurze Pro-Namen, Ranked &amp; E-Sports</tspan></text>
      </g>
    </g>

    <!-- Card 2: Gotisch -->
    <g transform="translate(555, 0)" filter="url(#ffStileShadow)">
      <rect width="525" height="150" rx="18" fill="#170d06" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="85" height="24" rx="6" fill="#c084fc" fill-opacity="0.15"/>
      <text x="62" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">2. GOTISCH</text>
      
      <rect x="120" y="18" width="385" height="50" rx="10" fill="#0b0603"/>
      <text x="312" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="900" fill="#ffffff">𝕽𝖆𝖛𝖊𝖓 &amp;bull; 𝕯𝖆𝖗𝖐𝕱𝖎𝖗𝖊</text>

      <g transform="translate(20, 90)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Dunkel, aggressiv und markant</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Geeignet für: <tspan fill="#94a3b8" font-weight="400">Dark-Style, Gilden-Leader &amp; Fantasy</tspan></text>
      </g>
    </g>

    <!-- Card 3: Kursiv -->
    <g transform="translate(0, 175)" filter="url(#ffStileShadow)">
      <rect width="340" height="290" rx="18" fill="#170d06" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="80" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="60" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">3. KURSIV</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#0b0603"/>
      <text x="170" y="93" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" font-weight="800" fill="#ffffff">𝑳𝒖𝒏𝒂𝒓 &amp;bull; 𝑽𝒆𝒙</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Dynamisch &amp; schnell</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Geeignet für: <tspan fill="#94a3b8" font-weight="400">Flüssige, elegante Namen</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Wirkt aerodynamisch und modern.</text>
      </g>
    </g>

    <!-- Card 4: Small Caps -->
    <g transform="translate(370, 175)" filter="url(#ffStileShadow)">
      <rect width="340" height="290" rx="18" fill="#170d06" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="110" height="24" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="75" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">4. SMALL CAPS</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#0b0603"/>
      <text x="170" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#ffffff">ᴠ ɪ ᴘ ᴇ ʀ &amp;bull; ɴ ᴏ ᴠ ᴀ</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Kompakt &amp; symmetrisch</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Geeignet für: <tspan fill="#94a3b8" font-weight="400">Kurze Nicknames</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Perfekt für das 12-Zeichen Limit.</text>
      </g>
    </g>

    <!-- Card 5: Dekorativ &amp; Symbole -->
    <g transform="translate(740, 175)" filter="url(#ffStileShadow)">
      <rect width="340" height="290" rx="18" fill="#170d06" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="115" height="24" rx="6" fill="#34d399" fill-opacity="0.15"/>
      <text x="77" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">5. DEKORATIV</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#0b0603"/>
      <text x="170" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">★ 𝕽𝖆𝖛𝖊𝖓 ★</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Auffälliger Eyecatcher</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Geeignet für: <tspan fill="#94a3b8" font-weight="400">Besondere Profil-Akzente</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Symbole sparsam kombinieren.</text>
      </g>
    </g>

  </g>
</svg>

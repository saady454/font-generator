<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ttCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="50%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="ttPinkCyanComp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25f4ee"/>
      <stop offset="100%" stop-color="#fe2c55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#ttCompBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#25f4ee" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="240" fill="#fe2c55" fill-opacity="0.08"/>

  <!-- Section Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#151b2b" stroke="#25f4ee" stroke-opacity="0.4"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#25f4ee" letter-spacing="1.5">TYPOGRAFIE VERGLEICH</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff">
    Beliebte TikTok-Schriftstile im direkten Vergleich
  </text>
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    Wirkung, Lesbarkeit und ideale Einsatzbereiche für dein TikTok-Profil
  </text>

  <!-- 7 Rows Typography Showcase Grid -->
  <g transform="translate(100, 175)">
    <!-- Column Headers -->
    <rect width="1000" height="36" rx="8" fill="#121828"/>
    <text x="30" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1">STIL &amp; EFFEKT</text>
    <text x="260" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1">BEISPIEL (UNICODE)</text>
    <text x="560" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1">WIRKUNG</text>
    <text x="800" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1">GEEIGNET FÜR</text>

    <!-- Row 1: Fett -->
    <g transform="translate(0, 46)">
      <rect width="1000" height="52" rx="10" fill="#0d111e" stroke="#25f4ee" stroke-opacity="0.2"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#25f4ee" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#25f4ee">Fett</text>
      <text x="260" y="33" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">𝗧𝗶𝗸𝗧𝗼𝗸 𝗩𝗶𝗯𝗲𝘀</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#25f4ee">Stark &amp; deutlich</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Namen, kurze Aussagen</text>
    </g>

    <!-- Row 2: Kursiv -->
    <g transform="translate(0, 106)">
      <rect width="1000" height="52" rx="10" fill="#0d111e" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#fe2c55" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fe2c55">Kursiv</text>
      <text x="260" y="33" font-family="system-ui, sans-serif" font-size="20" font-style="italic" font-weight="700" fill="#ffffff">𝘛𝘪𝘬𝘛𝘰𝘬 𝘝𝘪𝘣𝘦𝘴</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fe2c55">Elegant &amp; weich</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Bio, Zitate, Sprüche</text>
    </g>

    <!-- Row 3: Schreibschrift -->
    <g transform="translate(0, 166)">
      <rect width="1000" height="52" rx="10" fill="#0d111e" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="105" height="24" rx="6" fill="#a855f7" fill-opacity="0.15"/>
      <text x="70" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">Schreibschrift</text>
      <text x="260" y="33" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff">𝓣𝓲𝓴𝓣𝓸𝓴 𝓥𝓲𝓫𝓮𝓼</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c084fc">Kreativ &amp; persönlich</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Namen, kurze Sprüche</text>
    </g>

    <!-- Row 4: Gotisch -->
    <g transform="translate(0, 226)">
      <rect width="1000" height="52" rx="10" fill="#0d111e" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">Gotisch</text>
      <text x="260" y="33" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff">𝔗𝔦𝔨𝔗𝔬𝔨 𝔙𝔦𝔟𝔢𝔰</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Dunkel &amp; markant</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Nicknames, Gaming</text>
    </g>

    <!-- Row 5: Bubble -->
    <g transform="translate(0, 286)">
      <rect width="1000" height="52" rx="10" fill="#0d111e" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#ec4899" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">Bubble</text>
      <text x="260" y="33" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">ⓉⓘⓚⓉⓞⓚ Ⓥⓘⓑⓔⓢ</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6">Verspielt &amp; auffällig</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Kurze Bio-Texte</text>
    </g>

    <!-- Row 6: Glitch / Zalgo -->
    <g transform="translate(0, 346)">
      <rect width="1000" height="52" rx="10" fill="#0d111e" stroke="#25f4ee" stroke-opacity="0.2"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#25f4ee" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#25f4ee">Glitch</text>
      <text x="260" y="33" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">T̶i̶k̶T̶o̶k̶ V̶i̶b̶e̶s̶</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#25f4ee">Auffällig &amp; edgy</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Edgy Profile, Clan-Tags</text>
    </g>

    <!-- Row 7: Monospace -->
    <g transform="translate(0, 406)">
      <rect width="1000" height="52" rx="10" fill="#0d111e" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="95" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="65" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">Monospace</text>
      <text x="260" y="33" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#ffffff">𝚃𝚒𝚔𝚃𝚘𝚔 𝚅𝚒𝚋𝚎𝚜</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Technisch &amp; clean</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Gaming, Tech-Kanäle</text>
    </g>

  </g>
</svg>

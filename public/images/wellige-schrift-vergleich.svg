<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="compBgWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#0e1326"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="waveCompGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="tileShadowWave" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#compBgWave)"/>

  <!-- Ambient Glows -->
  <circle cx="250" cy="200" r="240" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="950" cy="450" r="260" fill="#a855f7" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">TYPOGRAFIE-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Gerader Text vs. <tspan fill="url(#waveCompGrad)">Wellige Schrift (W͠e͠l͠l͠i͠g͠)</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie kombinierende Tilden (U+0360) Buchstaben in dynamische Wellenformen verwandeln
    </text>
  </g>

  <!-- Comparison Split Cards (Left: Straight / Right: Wavy) -->
  <g transform="translate(80, 160)">
    
    <!-- LEFT CARD: Gerader Text -->
    <g transform="translate(0, 0)" filter="url(#tileShadowWave)">
      <rect width="500" height="440" rx="24" fill="#12162a" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
      <rect x="25" y="24" width="180" height="28" rx="14" fill="#ffffff" fill-opacity="0.08"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#94a3b8">GERADER TEXT</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" font-weight="700">Statisch &amp; Neutral</text>

      <!-- Specimen Box -->
      <rect x="25" y="70" width="450" height="150" rx="16" fill="#080b16" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="225" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Sommer Brise</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Klassische horizontale Grundlinie ohne Wellen</text>

      <!-- Feature List -->
      <g transform="translate(25, 250)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften:</text>
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#94a3b8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Perfekt für lange Artikel &amp; Fließtexte</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#94a3b8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Gleichförmige, unbewegte Darstellung</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#94a3b8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Kein visueller Rhythmus oder Bewegung</text>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: Wellige Schrift -->
    <g transform="translate(540, 0)" filter="url(#tileShadowWave)">
      <rect width="500" height="440" rx="24" fill="#12162a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="25" y="24" width="200" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">WELLIGE SCHRIFT</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">Dynamischer Vibe</text>

      <!-- Specimen Box -->
      <rect x="25" y="70" width="450" height="150" rx="16" fill="#080b16" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="225" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="url(#waveCompGrad)">S͠o͠m͠m͠e͠r͠ ͠B͠r͠i͠s͠e͠</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="600">✓ U+0360 Tilden verbinden benachbarte Glyphen</text>

      <!-- Feature List -->
      <g transform="translate(25, 250)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften &amp; Vorteile:</text>
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Fließender, lebendiger Look für Namen &amp; Bios</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Entspannte Aesthetic für Lo-Fi &amp; Lifestyle</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Direktes 1-Klick Copy &amp; Paste im Browser</text>
        </g>
      </g>
    </g>

  </g>
</svg>

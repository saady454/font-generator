<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="waCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e0b"/>
      <stop offset="50%" stop-color="#0d1f19"/>
      <stop offset="100%" stop-color="#060c09"/>
    </linearGradient>
    <linearGradient id="waGradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#waCompBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#25D366" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="240" fill="#128C7E" fill-opacity="0.08"/>

  <!-- Section Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#112920" stroke="#25D366" stroke-opacity="0.4"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#25D366" letter-spacing="1.5">SCHRIFTARTEN VERGLEICH</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff">
    WhatsApp-Schriftstile für „Hallo“ im Überblick
  </text>
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    Wirkung, Eignung und optische Varianten für Chat, Status &amp; Gruppen
  </text>

  <!-- 7 Rows Typography Showcase Grid -->
  <g transform="translate(100, 175)">
    <!-- Column Headers -->
    <rect width="1000" height="36" rx="8" fill="#11261e"/>
    <text x="30" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" letter-spacing="1">STIL &amp; EFFEKT</text>
    <text x="260" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" letter-spacing="1">BEISPIEL (UNICODE)</text>
    <text x="560" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" letter-spacing="1">WIRKUNG</text>
    <text x="800" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" letter-spacing="1">GUT GEEIGNET FÜR</text>

    <!-- Row 1: Fett -->
    <g transform="translate(0, 46)">
      <rect width="1000" height="52" rx="10" fill="#0c1d17" stroke="#25D366" stroke-opacity="0.25"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#25D366" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#25D366">Fett</text>
      <text x="260" y="34" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">𝗛𝗮𝗹𝗹𝗼</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#25D366">Klar und auffällig</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">wichtige Wörter, Gruppennamen</text>
    </g>

    <!-- Row 2: Kursiv -->
    <g transform="translate(0, 106)">
      <rect width="1000" height="52" rx="10" fill="#0c1d17" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#34B7F1" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34B7F1">Kursiv</text>
      <text x="260" y="34" font-family="system-ui, sans-serif" font-size="22" font-style="italic" font-weight="700" fill="#ffffff">𝘏𝘢𝘭𝘭𝘰</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34B7F1">Elegant und weich</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Status und Zitate</text>
    </g>

    <!-- Row 3: Schreibschrift -->
    <g transform="translate(0, 166)">
      <rect width="1000" height="52" rx="10" fill="#0c1d17" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="105" height="24" rx="6" fill="#a855f7" fill-opacity="0.15"/>
      <text x="70" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">Schreibschrift</text>
      <text x="260" y="34" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">𝓗𝓪𝓵𝓵𝓸</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c084fc">Persönlich und warm</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Namen, Glückwünsche</text>
    </g>

    <!-- Row 4: Gotisch -->
    <g transform="translate(0, 226)">
      <rect width="1000" height="52" rx="10" fill="#0c1d17" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">Gotisch</text>
      <text x="260" y="34" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">𝔞𝔩𝔩𝔬 / 𝔥𝔞𝔩𝔩𝔬</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Markant und antik</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">besondere Nachrichten, Status</text>
    </g>

    <!-- Row 5: Bubble -->
    <g transform="translate(0, 286)">
      <rect width="1000" height="52" rx="10" fill="#0c1d17" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#ec4899" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">Bubble</text>
      <text x="260" y="34" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">ⓗⓐⓛⓛⓞ</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6">Verspielt und fröhlich</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">kurze Texte, Grüße</text>
    </g>

    <!-- Row 6: Monospace -->
    <g transform="translate(0, 346)">
      <rect width="1000" height="52" rx="10" fill="#0c1d17" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="95" height="24" rx="6" fill="#10b981" fill-opacity="0.15"/>
      <text x="65" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">Monospace</text>
      <text x="260" y="34" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#ffffff">𝙷𝚊𝚕𝚕𝚘</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">Technisch &amp; schlicht</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Gaming, Tech, Code</text>
    </g>

    <!-- Row 7: Durchgestrichen -->
    <g transform="translate(0, 406)">
      <rect width="1000" height="52" rx="10" fill="#0c1d17" stroke="#25D366" stroke-opacity="0.2"/>
      <rect x="18" y="14" width="130" height="24" rx="6" fill="#25D366" fill-opacity="0.15"/>
      <text x="83" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#25D366">Durchgestrichen</text>
      <text x="260" y="34" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">H̶a̶l̶l̶o̶</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#25D366">Effektvoll</text>
      <text x="800" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">einzelne Wörter, Scherze</text>
    </g>

  </g>
</svg>

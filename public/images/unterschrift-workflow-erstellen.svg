<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="sigWfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#121526"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="wfGradSig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="wfShadowSig" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#sigWfBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="1000" cy="480" r="240" fill="#818cf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">SIGNATUR-ANLEITUNG</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      In 4 Schritten: <tspan fill="url(#wfGradSig)">Unterschrift online erstellen</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Einfach Namen eingeben, Stil wählen, Vorschau prüfen und sofort kopieren
    </text>
  </g>

  <!-- 4 Step Flow Grid -->
  <g transform="translate(60, 160)">
    
    <!-- Step 1: Namen eingeben -->
    <g transform="translate(0, 0)" filter="url(#wfShadowSig)">
      <rect width="250" height="440" rx="20" fill="#121728" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#38bdf8">1</text>
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">NAMEN EINGEBEN</text>

      <rect x="20" y="85" width="210" height="150" rx="14" fill="#080c16" stroke="#38bdf8" stroke-opacity="0.2"/>
      <text x="15" y="30" transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">INPUT-FELD</text>
      <text x="15" y="75" transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Max Mustermann</text>
      <line x1="35" y1="175" x2="165" y2="175" stroke="#38bdf8" stroke-dasharray="3 3"/>

      <g transform="translate(20, 260)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Aktion:</text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Vor- &amp; Nachname oder Kürzel in das Textfeld tippen.</text>
      </g>
    </g>

    <!-- Step 2: Stil auswählen -->
    <g transform="translate(275, 0)" filter="url(#wfShadowSig)">
      <rect width="250" height="440" rx="20" fill="#121728" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#818cf8">2</text>
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">STIL AUSWÄHLEN</text>

      <rect x="20" y="85" width="210" height="150" rx="14" fill="#080c16" stroke="#818cf8" stroke-opacity="0.2"/>
      <text x="15" y="25" transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#818cf8">SIGNATUR-VARIATIONEN</text>
      <text x="15" y="55" transform="translate(20, 85)" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#ffffff">𝓜𝓪𝔁 𝓜𝓾𝓼𝓽𝓮𝓻𝓶𝓪𝓷𝓷</text>
      <text x="15" y="85" transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#818cf8">ᴍᴀx ᴍᴜsᴛᴇʀᴍᴀɴɴ</text>
      <text x="15" y="115" transform="translate(20, 85)" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#94a3b8">M̲a̲x̲ ̲M̲u̲s̲t̲e̲r̲m̲a̲n̲n̲</text>

      <g transform="translate(20, 260)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8">Aktion:</text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Wähle zwischen klassisch, modern, akademisch oder unterstrichen.</text>
      </g>
    </g>

    <!-- Step 3: Vorschau prüfen -->
    <g transform="translate(550, 0)" filter="url(#wfShadowSig)">
      <rect width="250" height="440" rx="20" fill="#121728" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fbbf24">3</text>
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">VORSCHAU PRÜFEN</text>

      <rect x="20" y="85" width="210" height="150" rx="14" fill="#080c16" stroke="#fbbf24" stroke-opacity="0.2"/>
      <text x="15" y="25" transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">LESBARKEITS-CHECK</text>
      <text x="15" y="70" transform="translate(20, 85)" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="700" fill="#ffffff">𝑴𝒂𝒙 𝑴𝒖𝒔𝒕𝒆𝒓𝒎𝒂𝒏𝒏</text>
      <text x="15" y="110" transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#22c55e">✓ Klar lesbar auf Mobilgeräten</text>

      <g transform="translate(20, 260)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Aktion:</text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Stelle sicher, dass alle Buchstaben und Sonderzeichen passen.</text>
      </g>
    </g>

    <!-- Step 4: Kopieren &amp; Einfügen -->
    <g transform="translate(825, 0)" filter="url(#wfShadowSig)">
      <rect width="250" height="440" rx="20" fill="#121728" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#4ade80">4</text>
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">KOPIEREN</text>

      <rect x="20" y="85" width="210" height="150" rx="14" fill="#080c16" stroke="#22c55e" stroke-opacity="0.2"/>
      <rect x="35" y="130" width="180" height="45" rx="10" fill="#22c55e"/>
      <text x="125" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">📋 KOPIEREN</text>
      <text x="125" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#22c55e">✓ Sofort einsatzbereit</text>

      <g transform="translate(20, 260)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Aktion:</text>
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">1-Klick Kopieren und in E-Mail oder Bio einfügen.</text>
      </g>
    </g>

  </g>
</svg>

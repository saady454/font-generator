<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="sigHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#121526"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="sigGoldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="sigShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#sigHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#38bdf8" fill-opacity="0.10"/>
  <circle cx="920" cy="460" r="280" fill="#818cf8" fill-opacity="0.08"/>

  <!-- Header Badge -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" letter-spacing="2">🖋️ DIGITAL SIGNATURE STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Unterschrift Generator: <tspan fill="url(#sigGoldCyan)">Schöne Signatur erstellen</tspan>
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Elegante Unterschriften-Schriftzüge für Profile, E-Mails &amp; Social Media
  </text>

  <!-- Main Generator Canvas Card -->
  <g transform="translate(100, 215)" filter="url(#sigShadow)">
    <rect width="1000" height="400" rx="28" fill="#121728" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Paper Board -->
    <rect x="25" y="25" width="950" height="350" rx="20" fill="#080c16" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- Large Signature Showcase: "Max Mustermann" -->
    <g transform="translate(500, 140)" text-anchor="middle">
      <text y="0" font-family="Georgia, 'Brush Script MT', serif" font-size="64" font-style="italic" font-weight="700" fill="url(#sigGoldCyan)" letter-spacing="2">𝓜𝓪𝔁 𝓜𝓾𝓼𝓽𝓮𝓻𝓶𝓪𝓷𝓷</text>
      <!-- Signature Swash Underline -->
      <path d="M-220,25 Q-100,45 100,20 T240,15" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <text y="65" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="6">𝒦𝓁𝒶𝓈𝓈𝒾𝓈𝒸𝒽 &amp;bull; 𝑀𝑜𝒹𝑒𝓇𝓃 &amp;bull; 𝒰𝓃𝓉𝑒𝓇𝓈𝓉𝓇𝒾𝒸𝒽𝑒𝓃</text>
    </g>

    <!-- 4 Signature Style Showcase Tiles Below -->
    <g transform="translate(60, 260)">
      
      <g transform="translate(0, 0)">
        <rect width="205" height="70" rx="14" fill="#161c30" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="1">KLASSISCH SCRIPT</text>
        <text x="20" y="52" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="700" fill="#ffffff">𝒥𝑜𝒽𝓃 𝒟𝑜𝑒</text>
      </g>

      <g transform="translate(225, 0)">
        <rect width="205" height="70" rx="14" fill="#161c30" stroke="#818cf8" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a5b4fc" letter-spacing="1">MODERN MINIMAL</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ᴊᴏʜɴ ᴅᴏᴇ</text>
      </g>

      <g transform="translate(450, 0)">
        <rect width="205" height="70" rx="14" fill="#161c30" stroke="#fbbf24" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="1">AKADEMISCH</text>
        <text x="20" y="52" font-family="Times New Roman, serif" font-size="16" font-weight="700" fill="#ffffff">𝑱𝒐𝒉𝒏 𝑫𝒐𝒆</text>
      </g>

      <g transform="translate(675, 0)">
        <rect width="205" height="70" rx="14" fill="#161c30" stroke="#22c55e" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="1">UNTERSTRICHEN</text>
        <text x="20" y="52" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="700" fill="#ffffff">J̲o̲h̲n̲ ̲D̲o̲e̲</text>
      </g>
    </g>
  </g>
</svg>

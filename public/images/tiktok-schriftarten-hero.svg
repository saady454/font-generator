<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ttHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040508"/>
      <stop offset="50%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="ttNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#25f4ee"/>
      <stop offset="100%" stop-color="#fe2c55"/>
    </linearGradient>
    <linearGradient id="ttPinkCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#25f4ee"/>
    </linearGradient>
    <filter id="ttGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ttShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ttHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="280" fill="#25f4ee" fill-opacity="0.09"/>
  <circle cx="940" cy="460" r="300" fill="#fe2c55" fill-opacity="0.09"/>
  <circle cx="600" cy="340" r="220" fill="#a855f7" fill-opacity="0.05"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#141724" stroke="url(#ttPinkCyan)" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#25f4ee" letter-spacing="2">🎵 TIKTOK SCHRIFTARTEN STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    TikTok Schriftarten: <tspan fill="url(#ttNeonGrad)">Coole Schriften für Bio &amp; Text</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Fett, kursiv, gotisch &amp; dekorativ für Bio, Namen &amp; Captions zum Kopieren
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#ttShadow)">
    <rect width="1020" height="420" rx="28" fill="#0e121d" stroke="#25f4ee" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#07090f" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Smartphone Device Mockup -->
    <g transform="translate(55, 50)">
      <rect width="250" height="320" rx="24" fill="#121624" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
      
      <!-- Phone Camera Island -->
      <rect x="95" y="10" width="60" height="12" rx="6" fill="#05070c"/>
      <circle cx="140" cy="16" r="3" fill="#25f4ee" fill-opacity="0.8"/>

      <!-- Profile Header on Phone -->
      <circle cx="125" cy="65" r="30" fill="#1e2438" stroke="url(#ttPinkCyan)" stroke-width="2"/>
      <text x="125" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22">🎵</text>

      <text x="125" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">𝕿𝖎𝖐𝕿𝖔𝖐 𝕮𝖗𝖊𝖆𝖙𝖔𝖗</text>
      <text x="125" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">@creator_official</text>

      <!-- Stats Bar -->
      <g transform="translate(20, 145)" font-family="system-ui, sans-serif" text-anchor="middle">
        <text x="35" y="12" font-size="12" font-weight="800" fill="#ffffff">12.5k</text>
        <text x="35" y="24" font-size="8" fill="#64748b">Folge ich</text>
        <text x="105" y="12" font-size="12" font-weight="800" fill="#ffffff">248k</text>
        <text x="105" y="24" font-size="8" fill="#64748b">Follower</text>
        <text x="175" y="12" font-size="12" font-weight="800" fill="#ffffff">3.8M</text>
        <text x="175" y="24" font-size="8" fill="#64748b">Likes</text>
      </g>

      <!-- Bio Box -->
      <rect x="18" y="185" width="214" height="70" rx="10" fill="#090c14" stroke="#25f4ee" stroke-opacity="0.2"/>
      <text x="28" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#25f4ee">𝗖𝗿𝗲𝗮𝘁𝗼𝗿 | 𝙂𝙖𝙢𝙞𝙣𝙜 | Videos 🎬</text>
      <text x="28" y="222" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Täglich neue 𝘝𝘪𝘣𝘦𝘴 &amp; Clips ✨</text>
      <text x="28" y="240" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fe2c55">🔗 schriftarten.io/tiktok</text>

      <!-- Follow Button -->
      <rect x="18" y="268" width="214" height="34" rx="8" fill="#fe2c55"/>
      <text x="125" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Folgen</text>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(340, 50)">
      <rect width="630" height="320" rx="20" fill="#111625" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1">EINGABE TEXT</text>
        <rect x="0" y="24" width="580" height="42" rx="10" fill="#090c14" stroke="#25f4ee" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">TikTok</text>
        <rect x="500" y="32" width="70" height="26" rx="6" fill="#fe2c55"/>
        <text x="535" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Live ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 100)">
        
        <!-- Style 1: Fett -->
        <g transform="translate(0, 0)">
          <rect width="280" height="46" rx="10" fill="#181f33" stroke="#25f4ee" stroke-opacity="0.2"/>
          <text x="14" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#25f4ee">FETT</text>
          <text x="14" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">𝗧𝗶𝗸𝗧𝗼𝗸</text>
          <rect x="210" y="10" width="58" height="26" rx="6" fill="#25f4ee" fill-opacity="0.15"/>
          <text x="239" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#25f4ee">Kopieren</text>
        </g>

        <!-- Style 2: Kursiv -->
        <g transform="translate(300, 0)">
          <rect width="280" height="46" rx="10" fill="#181f33" stroke="#fe2c55" stroke-opacity="0.2"/>
          <text x="14" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fe2c55">KURSIV</text>
          <text x="14" y="36" font-family="system-ui, sans-serif" font-size="15" font-style="italic" font-weight="600" fill="#ffffff">𝘛𝘪𝘬𝘛𝘰𝘬</text>
          <rect x="210" y="10" width="58" height="26" rx="6" fill="#fe2c55" fill-opacity="0.15"/>
          <text x="239" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fe2c55">Kopieren</text>
        </g>

        <!-- Style 3: Schreibschrift -->
        <g transform="translate(0, 56)">
          <rect width="280" height="46" rx="10" fill="#181f33" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="14" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#a855f7">SCHREIBSCHRIFT</text>
          <text x="14" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝓣𝓲𝓴𝓣𝓸𝓴</text>
          <rect x="210" y="10" width="58" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="239" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopieren</text>
        </g>

        <!-- Style 4: Gotisch -->
        <g transform="translate(300, 56)">
          <rect width="280" height="46" rx="10" fill="#181f33" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="14" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f59e0b">GOTISCH</text>
          <text x="14" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝔗𝔦𝔨𝔗𝔬𝔨</text>
          <rect x="210" y="10" width="58" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="239" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopieren</text>
        </g>

        <!-- Style 5: Monospace -->
        <g transform="translate(0, 112)">
          <rect width="280" height="46" rx="10" fill="#181f33" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="14" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">MONOSPACE</text>
          <text x="14" y="36" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#ffffff">𝚃𝚒𝚔𝚃𝚘𝚔</text>
          <rect x="210" y="10" width="58" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="239" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopieren</text>
        </g>

        <!-- Style 6: Bubble -->
        <g transform="translate(300, 112)">
          <rect width="280" height="46" rx="10" fill="#181f33" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="14" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ec4899">BUBBLE</text>
          <text x="14" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ⓉⓘⓚⓉⓞⓚ</text>
          <rect x="210" y="10" width="58" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="239" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

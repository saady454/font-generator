<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="socialSmallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b14"/>
      <stop offset="50%" stop-color="#121626"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#socialSmallBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="240" fill="#818cf8" fill-opacity="0.1"/>
  <circle cx="920" cy="450" r="260" fill="#c084fc" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#a5b4fc" letter-spacing="2">PRAXIS-BEISPIELE</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Kleine Schrift in <tspan fill="#818cf8">Bios, Gaming &amp; Chats</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Ästhetische Kombinationen aus Standardtext und dezenten Miniatur-Buchstaben
    </text>
  </g>

  <!-- 3 Smartphone Mockups Grid -->
  <g transform="translate(90, 160)">
    
    <!-- Phone 1: Social Media Bio (Small Caps) -->
    <g transform="translate(0, 0)" filter="url(#phoneShadow)">
      <rect width="320" height="440" rx="28" fill="#141828" stroke="#818cf8" stroke-opacity="0.35" stroke-width="2"/>
      
      <!-- Top Notch &amp; Header -->
      <rect x="110" y="10" width="100" height="16" rx="8" fill="#0c0e18"/>
      <circle cx="190" cy="18" r="3" fill="#38bdf8"/>
      <text x="160" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#a5b4fc">📸 SOCIAL MEDIA BIO</text>

      <!-- Avatar + Name -->
      <g transform="translate(25, 75)">
        <circle cx="30" cy="30" r="26" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="2"/>
        <text x="30" y="38" text-anchor="middle" font-size="20">✨</text>
        <text x="70" y="24" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Laura Becker</text>
        <text x="70" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#818cf8">ᴅᴇꜱɪɢɴ &amp;bull; ᴀʀᴛ &amp;bull; ᴠɪʙᴇꜱ</text>
      </g>

      <!-- Bio Box -->
      <g transform="translate(20, 155)">
        <rect width="280" height="135" rx="14" fill="#0c0e18" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="15" y="28" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">📍 Berlin, Germany</text>
        <text x="15" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Minimalist Portfolio &amp; Coffee ☕</text>
        <text x="15" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">ɴᴇᴡ ᴘᴏꜱᴛ ᴇᴠᴇʀʏ ꜱᴜɴᴅᴀʏ</text>
        <text x="15" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">🔗 laura-design.de</text>
      </g>

      <!-- Button -->
      <rect x="20" y="310" width="280" height="40" rx="10" fill="#818cf8"/>
      <text x="160" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Profil Bearbeiten</text>

      <rect x="20" y="365" width="280" height="50" rx="10" fill="#1b2034"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ade80">✓ Small Caps Stil</text>
      <text x="35" y="404" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Clean, modern &amp; maximale Ästhetik</text>
    </g>

    <!-- Phone 2: Gaming Profile (Superscript) -->
    <g transform="translate(350, 0)" filter="url(#phoneShadow)">
      <rect width="320" height="440" rx="28" fill="#141828" stroke="#c084fc" stroke-opacity="0.35" stroke-width="2"/>
      
      <!-- Top Notch &amp; Header -->
      <rect x="110" y="10" width="100" height="16" rx="8" fill="#0c0e18"/>
      <circle cx="190" cy="18" r="3" fill="#c084fc"/>
      <text x="160" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#c084fc">🎮 GAMING PROFILE</text>

      <!-- Gamertag Card -->
      <g transform="translate(20, 75)">
        <rect width="280" height="90" rx="14" fill="#0c0e18" stroke="#c084fc" stroke-opacity="0.3"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">GAMERTAG / DISPLAY NAME:</text>
        <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Max ᴳᵃᵐᵉʳ · ᴹᵘˢᶦᶜ</text>
      </g>

      <!-- Stats Box -->
      <g transform="translate(20, 180)">
        <rect width="280" height="110" rx="14" fill="#0c0e18" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Fortnite &amp;bull; Valorant &amp;bull; CS2</text>
        <text x="20" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#c084fc">Rank: ᴾʳᵒ ᴸᵉᵃᵍᵘᵉ ᴿᵃⁿᵏ #¹</text>
        <text x="20" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Status: ᴼⁿˡⁱⁿᵉ ⁿᵒʷ 🟢</text>
      </g>

      <!-- Clan Tag -->
      <rect x="20" y="310" width="280" height="40" rx="10" fill="#1e1828" stroke="#c084fc" stroke-width="1.5"/>
      <text x="160" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#c084fc">[ ᵀᴱᴬᴹ ᴱᴸᴵᵀᴱ ]</text>

      <rect x="20" y="365" width="280" height="50" rx="10" fill="#1b2034"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">✓ Hochgestellt (Superscript)</text>
      <text x="35" y="404" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Perfekt für Gamertag-Tags &amp; Rollen</text>
    </g>

    <!-- Phone 3: Chat Message &amp; Subscript -->
    <g transform="translate(700, 0)" filter="url(#phoneShadow)">
      <rect width="320" height="440" rx="28" fill="#141828" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
      
      <!-- Top Notch &amp; Header -->
      <rect x="110" y="10" width="100" height="16" rx="8" fill="#0c0e18"/>
      <circle cx="190" cy="18" r="3" fill="#38bdf8"/>
      <text x="160" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">💬 CHAT &amp; MESSENGER</text>

      <!-- Chat History -->
      <g transform="translate(20, 80)">
        
        <!-- Bubble 1: Incoming -->
        <rect width="220" height="55" rx="14" fill="#1e2438"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Felix:</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff">Wann startet das Event?</text>

        <!-- Bubble 2: Outgoing Small Caps + Subscript -->
        <g transform="translate(30, 70)">
          <rect width="250" height="95" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-opacity="0.4"/>
          <text x="15" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Um 20:00 Uhr! 🔥</text>
          <text x="15" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#e0f2fe">ꜱᴛᴀʀᴛ ᴢᴇɪᴛ: ₂₀:₀₀ ᵤₕᵣ</text>
          <text x="15" y="76" font-family="system-ui, sans-serif" font-size="11" fill="#bae6fd">ʟᴏᴄᴀᴛɪᴏɴ: ᴅɪꜱᴄᴏʀᴅ ᴠᴏɪᴄᴇ</text>
        </g>

        <!-- Bubble 3: Outgoing -->
        <g transform="translate(50, 180)">
          <rect width="230" height="48" rx="14" fill="#0284c7"/>
          <text x="15" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Bis gleich! ₛₑₑ yₒᵤ ₛₒₒₙ 👋</text>
        </g>
      </g>

      <rect x="20" y="365" width="280" height="50" rx="10" fill="#1b2034"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">✓ Chat-Highlights &amp; Status</text>
      <text x="35" y="404" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Kreativer Akzent ohne Aufdringlichkeit</text>
    </g>
  </g>
</svg>

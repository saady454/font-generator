<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ekCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="ekCompGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="ekCompShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ekCompBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#fbbf24" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34d399" letter-spacing="2">TECHNISCHER VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Emoticon vs. <tspan fill="url(#ekCompGrad)">Kaomoji vs. Emoji</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie sich ASCII-Zeichen, japanische Textgesichter und farbige Emojis unterscheiden
    </text>
  </g>

  <!-- 3 Comparison Cards (Emoticon, Kaomoji, Emoji) -->
  <g transform="translate(60, 150)">
    
    <!-- 1. Emoticon -->
    <g transform="translate(0, 0)" filter="url(#ekCompShadow)">
      <rect width="340" height="440" rx="22" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="130" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="65" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">1. EMOTICON</text>
        
        <rect y="40" width="290" height="90" rx="12" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
        <text x="145" y="80" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">:-)   :D   ;-)   &lt;3</text>
        <text x="145" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Seitlich gekippt &amp;bull; ASCII</text>

        <g transform="translate(0, 155)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#38bdf8">Eigenschaften:</text>
          <text x="0" y="24">✓ Reine Satzzeichen (ASCII)</text>
          <text x="0" y="48">✓ Westlicher Ursprung</text>
          <text x="0" y="72">✓ Leicht auf Tastatur zu tippen</text>
          <text x="0" y="96">✓ Funktioniert auf jedem Gerät</text>
        </g>

        <rect y="340" width="290" height="36" rx="8" fill="#1e293b"/>
        <text x="145" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Typ: Reiner Standard-Text</text>
      </g>
    </g>

    <!-- 2. Kaomoji -->
    <g transform="translate(370, 0)" filter="url(#ekCompShadow)">
      <rect width="340" height="440" rx="22" fill="#111827" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="115" height="26" rx="6" fill="#34d399" fill-opacity="0.15"/>
        <text x="57" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">2. KAOMOJI</text>
        
        <rect y="40" width="290" height="90" rx="12" fill="#080d1a" stroke="#34d399" stroke-opacity="0.2"/>
        <text x="145" y="78" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff">(◕‿◕) (｡♥‿♥｡)</text>
        <text x="145" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Aufrecht &amp;bull; Ausdrucksstarke Augen</text>

        <g transform="translate(0, 155)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#34d399">Eigenschaften:</text>
          <text x="0" y="24">✓ Japanische Textgesichter</text>
          <text x="0" y="48">✓ Kein Kopfdrehen nötig</text>
          <text x="0" y="72">✓ Sehr detaillierte Emotionen</text>
          <text x="0" y="96">✓ Perfekt für Bios &amp; Chats</text>
        </g>

        <rect y="340" width="290" height="36" rx="8" fill="#1e293b"/>
        <text x="145" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Typ: Komplexes Textzeichen</text>
      </g>
    </g>

    <!-- 3. Emoji -->
    <g transform="translate(740, 0)" filter="url(#ekCompShadow)">
      <rect width="340" height="440" rx="22" fill="#111827" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="95" height="26" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="47" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">3. EMOJI</text>
        
        <rect y="40" width="290" height="90" rx="12" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
        <text x="145" y="80" text-anchor="middle" font-size="32">😊  🥰  🥺  ✨</text>
        <text x="145" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">Farbige Grafik &amp;bull; Unicode Emoji</text>

        <g transform="translate(0, 155)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#fbbf24">Eigenschaften:</text>
          <text x="0" y="24">✓ Grafische Bildzeichen</text>
          <text x="0" y="48">✓ Bunt &amp; illustriert</text>
          <text x="0" y="72">✓ Variiert je nach Betriebssystem</text>
          <text x="0" y="96">✓ Standard auf Smartphones</text>
        </g>

        <rect y="340" width="290" height="36" rx="8" fill="#1e293b"/>
        <text x="145" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Typ: Codiertes Bildsymbol</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="smBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c17"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="smGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="smShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#smBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#f43f5e" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#22c55e" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f43f5e" letter-spacing="2">APP-SPEZIFISCHE VORSCHAU</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Live-Einsatz auf den <tspan fill="url(#smGrad)">wichtigsten Plattformen</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie derselbe Textstil auf Instagram, TikTok und WhatsApp formatiert zur Geltung kommt
    </text>
  </g>

  <!-- 3 Smartphone Mockup Screens -->
  <g transform="translate(90, 150)">
    
    <!-- Phone 1: Instagram -->
    <g transform="translate(0, 0)" filter="url(#smShadow)">
      <rect width="320" height="440" rx="28" fill="#111827" stroke="#e11d48" stroke-opacity="0.4" stroke-width="2"/>
      
      <!-- Top Speaker Notch -->
      <rect x="110" y="12" width="100" height="12" rx="6" fill="#1e293b"/>
      
      <!-- Screen Content -->
      <g transform="translate(20, 40)">
        <rect width="280" height="365" rx="16" fill="#0b0f19"/>
        
        <!-- Header -->
        <g transform="translate(15, 15)">
          <circle cx="25" cy="25" r="22" fill="#e11d48" fill-opacity="0.2"/>
          <text x="25" y="32" text-anchor="middle" font-size="20">📸</text>
          <text x="60" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">INSTAGRAM</text>
          <text x="60" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">@username &amp;bull; Bio</text>
        </g>

        <!-- Bio Card -->
        <g transform="translate(15, 80)">
          <rect width="250" height="180" rx="12" fill="#161f30" stroke="#e11d48" stroke-opacity="0.3"/>
          <text x="15" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f43f5e">PROFIL-STECKBRIEF:</text>
          
          <text x="15" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">★ 𝓜𝔂 𝓟𝓻𝓸𝓯𝓲𝓵𝓮 ★</text>
          <text x="15" y="95" font-family="system-ui, sans-serif" font-size="13" fill="#fbbf24">𝗖𝗿𝗲𝗮𝘁𝗼𝗿 &amp; 𝗟𝗶𝗳𝗲𝘀𝘁𝘆𝗹𝗲 🌴</text>
          <text x="15" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">📍 Berlin | ✉ kontakt@mail.de</text>
          <text x="15" y="155" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8">🔗 𝖑𝖎𝖓𝖐𝖙𝖗.𝖊𝖊/𝖒𝖞𝖕𝖗𝖔𝖋𝖎𝖑𝖊</text>
        </g>

        <rect x="15" y="280" width="250" height="65" rx="10" fill="#1e293b"/>
        <text x="125" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">Max. 150 Zeichen</text>
        <text x="125" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Ideal für fette &amp; kursive Akzente</text>
      </g>
    </g>

    <!-- Phone 2: TikTok -->
    <g transform="translate(350, 0)" filter="url(#smShadow)">
      <rect width="320" height="440" rx="28" fill="#111827" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2"/>
      
      <!-- Top Speaker Notch -->
      <rect x="110" y="12" width="100" height="12" rx="6" fill="#1e293b"/>
      
      <!-- Screen Content -->
      <g transform="translate(20, 40)">
        <rect width="280" height="365" rx="16" fill="#0b0f19"/>
        
        <!-- Header -->
        <g transform="translate(15, 15)">
          <circle cx="25" cy="25" r="22" fill="#06b6d4" fill-opacity="0.2"/>
          <text x="25" y="32" text-anchor="middle" font-size="20">🎵</text>
          <text x="60" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">TIKTOK</text>
          <text x="60" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">@creator &amp;bull; Profil</text>
        </g>

        <!-- Bio Card -->
        <g transform="translate(15, 80)">
          <rect width="250" height="180" rx="12" fill="#161f30" stroke="#06b6d4" stroke-opacity="0.3"/>
          <text x="15" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#06b6d4">DISPLAY-NAME &amp; BIO:</text>
          
          <text x="15" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">𝕿𝖎𝖐𝕿𝖔𝖐 𝕮𝖗𝖊𝖆𝖙𝖔𝖗 ✨</text>
          <text x="15" y="95" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8">Ⓛⓘⓚⓔ &amp; Ⓕⓞⓛⓛⓞⓦ 🔥</text>
          <text x="15" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">🎬 Neue Videos jeden Tag!</text>
          <text x="15" y="155" font-family="system-ui, sans-serif" font-size="13" fill="#22c55e">sᴄʜᴀᴜ ᴅɪʀ ᴅᴀs ɴᴇᴜᴇ ᴠɪᴅᴇᴏ ᴀɴ</text>
        </g>

        <rect x="15" y="280" width="250" height="65" rx="10" fill="#1e293b"/>
        <text x="125" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#06b6d4">Max. 80 Zeichen</text>
        <text x="125" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Kompakte Small Caps &amp; Gotisch</text>
      </g>
    </g>

    <!-- Phone 3: WhatsApp -->
    <g transform="translate(700, 0)" filter="url(#smShadow)">
      <rect width="320" height="440" rx="28" fill="#111827" stroke="#22c55e" stroke-opacity="0.4" stroke-width="2"/>
      
      <!-- Top Speaker Notch -->
      <rect x="110" y="12" width="100" height="12" rx="6" fill="#1e293b"/>
      
      <!-- Screen Content -->
      <g transform="translate(20, 40)">
        <rect width="280" height="365" rx="16" fill="#0b0f19"/>
        
        <!-- Header -->
        <g transform="translate(15, 15)">
          <circle cx="25" cy="25" r="22" fill="#22c55e" fill-opacity="0.2"/>
          <text x="25" y="32" text-anchor="middle" font-size="20">💬</text>
          <text x="60" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">WHATSAPP</text>
          <text x="60" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Info &amp; Chat</text>
        </g>

        <!-- Bio Card -->
        <g transform="translate(15, 80)">
          <rect width="250" height="180" rx="12" fill="#161f30" stroke="#22c55e" stroke-opacity="0.3"/>
          <text x="15" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">INFO-STATUS &amp; NACHRICHT:</text>
          
          <text x="15" y="65" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">~*~ 𝒮𝓉𝒶𝓉𝓊𝓈 ~*~</text>
          <text x="15" y="95" font-family="system-ui, sans-serif" font-size="13" fill="#22c55e">⚡ 𝕺𝖓𝖑𝖎𝖓𝖊 &amp; 𝕬𝖐𝖙𝖎𝖛</text>
          <text x="15" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">„Nur Anrufe bei Notfall“</text>
          <text x="15" y="155" font-family="system-ui, sans-serif" font-size="13" fill="#fbbf24">★ 𝗕𝗶𝘁𝘁𝗲 𝗲𝗿𝘀𝘁 𝘀𝗰𝗵𝗿𝗲𝗶𝗯𝗲𝗻 ★</text>
        </g>

        <rect x="15" y="280" width="250" height="65" rx="10" fill="#1e293b"/>
        <text x="125" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#22c55e">Max. 139 Zeichen</text>
        <text x="125" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Unterstützt alle Standard-Symbole</text>
      </g>
    </g>

  </g>
</svg>

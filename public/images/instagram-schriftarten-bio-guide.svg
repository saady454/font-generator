<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bioGuideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14"/>
      <stop offset="50%" stop-color="#161226"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="instaBioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="bioCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bioGuideBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#ec4899" fill-opacity="0.10"/>
  <circle cx="920" cy="450" r="260" fill="#8b5cf6" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">BIO-DESIGN LEITFADEN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Der perfekte <tspan fill="url(#instaBioGrad)">Schriftstil für deine Instagram-Bio</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie du deinen 150-Zeichen Steckbrief professionell &amp; ästhetisch strukturierst
    </text>
  </g>

  <!-- 3 Profile &amp; Layout Cards -->
  <g transform="translate(80, 160)">
    
    <!-- Phone 1: Minimal Creator Bio -->
    <g transform="translate(0, 0)" filter="url(#bioCardShadow)">
      <rect width="325" height="440" rx="24" fill="#151226" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#1f1834"/>
      <rect y="20" width="325" height="20" fill="#1f1834"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#a78bfa">AESTHETIC MINIMAL</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#0b0816" stroke="#8b5cf6" stroke-opacity="0.2"/>
        
        <circle cx="45" cy="40" r="20" fill="#8b5cf6" fill-opacity="0.2"/>
        <text x="45" y="46" text-anchor="middle" font-size="16">🌿</text>
        <text x="75" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ᴇʟᴇɴᴀ ᴡᴇɪss</text>
        <text x="75" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">@elena.design</text>

        <!-- Bio Lines -->
        <g transform="translate(20, 80)">
          <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">✧ ᴀʀᴄʜɪᴛᴇᴄᴛᴜʀᴇ &amp; ʟɪɢʜᴛ ✧</text>
          <text x="0" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">📍 ᴍᴜɴɪᴄʜ &amp;bull; ʙᴇʀʟɪɴ</text>
          <text x="0" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#a78bfa">☕ ᴄᴏғғᴇᴇ &amp; ᴄᴏɴᴄᴇᴘᴛs</text>
          
          <line x1="0" y1="90" x2="245" y2="90" stroke="#ffffff" stroke-opacity="0.1"/>
          
          <rect x="0" y="105" width="245" height="35" rx="8" fill="#1f1834"/>
          <text x="122" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">🔗 elenaweiss.com/portfolio</text>
        </g>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1f1834"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">Kapitälchen-Stil</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Sehr dezent &amp; aufgeräumt</text>
    </g>

    <!-- Phone 2: Bold Influencer Bio -->
    <g transform="translate(355, 0)" filter="url(#bioCardShadow)">
      <rect width="325" height="440" rx="24" fill="#151226" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#1f1834"/>
      <rect y="20" width="325" height="20" fill="#1f1834"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">BOLD &amp; CLEAR</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#0b0816" stroke="#ec4899" stroke-opacity="0.2"/>
        
        <circle cx="45" cy="40" r="20" fill="#ec4899" fill-opacity="0.2"/>
        <text x="45" y="46" text-anchor="middle" font-size="16">🔥</text>
        <text x="75" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">𝐅𝐄𝐋𝐈𝐗 𝐒𝐂𝐇𝐌𝐈𝐃𝐓</text>
        <text x="75" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">@felix.fitness</text>

        <!-- Bio Lines -->
        <g transform="translate(20, 80)">
          <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">🏋️‍♂️ 𝐎𝐧𝐥𝐢𝐧𝐞 𝐅𝐢𝐭𝐧𝐞𝐬𝐬 𝐂𝐨𝐚𝐜𝐡</text>
          <text x="0" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🏆 100+ Transformationen</text>
          <text x="0" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#f472b6">🚀 𝐃𝐞𝐢𝐧 𝐓𝐫𝐚𝐢𝐧𝐢𝐧𝐠𝐬𝐩𝐥𝐚𝐧 👇</text>
          
          <line x1="0" y1="90" x2="245" y2="90" stroke="#ffffff" stroke-opacity="0.1"/>
          
          <rect x="0" y="105" width="245" height="35" rx="8" fill="#1f1834"/>
          <text x="122" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">🔗 felix-coaching.de</text>
        </g>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1f1834"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">Fette Hervorhebung</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Sofortiger Blickfang im Profil</text>
    </g>

    <!-- Phone 3: Elegant Script Bio -->
    <g transform="translate(710, 0)" filter="url(#bioCardShadow)">
      <rect width="325" height="440" rx="24" fill="#151226" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#1f1834"/>
      <rect y="20" width="325" height="20" fill="#1f1834"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24">ELEGANT SCRIPT</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#0b0816" stroke="#f59e0b" stroke-opacity="0.2"/>
        
        <circle cx="45" cy="40" r="20" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="45" y="46" text-anchor="middle" font-size="16">🌸</text>
        <text x="75" y="36" font-family="Georgia, serif" font-size="15" font-style="italic" font-weight="700" fill="#ffffff">𝒮𝑜𝓅𝒽𝒾𝒶 𝑀𝒶𝓇𝒾𝒶</text>
        <text x="75" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">@sophia.lifestyle</text>

        <!-- Bio Lines -->
        <g transform="translate(20, 80)">
          <text x="0" y="20" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#cbd5e1">✨ 𝒲𝓇𝒾𝓉𝒾𝓃𝑔 &amp; 𝒫𝑜𝑒𝓉𝓇𝓎</text>
          <text x="0" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">📖 Autorin &amp; Storytellerin</text>
          <text x="0" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">💌 𝒩𝑒𝓌𝓈𝓁𝑒𝓉𝓉𝑒𝓇 𝒥𝑜𝒾𝓃 👇</text>
          
          <line x1="0" y1="90" x2="245" y2="90" stroke="#ffffff" stroke-opacity="0.1"/>
          
          <rect x="0" y="105" width="245" height="35" rx="8" fill="#1f1834"/>
          <text x="122" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">🔗 sophiamaria.de/book</text>
        </g>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1f1834"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Kalligrafische Eleganz</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Sehr persönlich &amp; feminin</text>
    </g>

  </g>
</svg>

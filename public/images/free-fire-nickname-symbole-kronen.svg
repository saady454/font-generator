<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ffSymbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0705"/>
      <stop offset="50%" stop-color="#1f1107"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
    <linearGradient id="ffGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
    <linearGradient id="ffCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="ffSymbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ffSymbBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#fbbf24" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#ff7a00" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#261306" stroke="#ff7a00" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ff9933" letter-spacing="2">SYMBOLE &amp; DEKORATION</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Free Fire Namen mit <tspan fill="url(#ffGoldGrad)">Symbolen gestalten</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Die perfekte Balance zwischen auffälliger Dekoration und klarer Lesbarkeit
    </text>
  </g>

  <!-- Formula Banner: Symbol + Name + Symbol -->
  <g transform="translate(180, 140)" filter="url(#ffSymbShadow)">
    <rect width="840" height="70" rx="18" fill="#1a0e06" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="420" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">
      Die Goldene Formel: <tspan fill="#fbbf24">[ Symbol ]</tspan> + <tspan fill="#ffffff">Basisname</tspan> + <tspan fill="#fbbf24">[ Symbol ]</tspan>
    </text>
  </g>

  <!-- 4 Symbol Cards -->
  <g transform="translate(60, 235)">
    
    <!-- Card 1: Sterne -->
    <g transform="translate(0, 0)" filter="url(#ffSymbShadow)">
      <rect width="255" height="380" rx="20" fill="#170d06" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="45" y="52" text-anchor="middle" font-size="16">★</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Sterne</text>
      
      <g transform="translate(20, 90)">
        <rect width="215" height="70" rx="12" fill="#0b0603"/>
        <text x="107" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#fbbf24">★ Raven ★</text>
      </g>

      <g transform="translate(20, 190)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="0" font-weight="700" fill="#ffffff">Eigenschaften:</text>
        <text x="0" y="24">&amp;bull; Klassischer Gaming-Look</text>
        <text x="0" y="48">&amp;bull; 100 % fehlerfreie Anzeige</text>
        <text x="0" y="72">&amp;bull; Passt zu jedem Nickname</text>
      </g>

      <rect x="20" y="320" width="215" height="36" rx="8" fill="#241208"/>
      <text x="127" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">★ Beliebt &amp; Sicher ★</text>
    </g>

    <!-- Card 2: Blitze -->
    <g transform="translate(280, 0)" filter="url(#ffSymbShadow)">
      <rect width="255" height="380" rx="20" fill="#170d06" stroke="#ff7a00" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#ff7a00" fill-opacity="0.15"/>
      <text x="45" y="52" text-anchor="middle" font-size="16">⚡</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Blitze</text>
      
      <g transform="translate(20, 90)">
        <rect width="215" height="70" rx="12" fill="#0b0603"/>
        <text x="107" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ff7a00">⚡ Nova ⚡</text>
      </g>

      <g transform="translate(20, 190)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="0" font-weight="700" fill="#ffffff">Eigenschaften:</text>
        <text x="0" y="24">&amp;bull; Energisch &amp; dynamisch</text>
        <text x="0" y="48">&amp;bull; Perfekt für Rusher &amp; Aim</text>
        <text x="0" y="72">&amp;bull; Hohe Signalwirkung</text>
      </g>

      <rect x="20" y="320" width="215" height="36" rx="8" fill="#241208"/>
      <text x="127" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ff7a00">⚡ Aggressiv &amp; Schnell ⚡</text>
    </g>

    <!-- Card 3: Klammern -->
    <g transform="translate(560, 0)" filter="url(#ffSymbShadow)">
      <rect width="255" height="380" rx="20" fill="#170d06" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="45" y="52" text-anchor="middle" font-size="16">『</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Klammern</text>
      
      <g transform="translate(20, 90)">
        <rect width="215" height="70" rx="12" fill="#0b0603"/>
        <text x="107" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#38bdf8">『 Viper 』</text>
      </g>

      <g transform="translate(20, 190)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="0" font-weight="700" fill="#ffffff">Eigenschaften:</text>
        <text x="0" y="24">&amp;bull; Japanische Eckklammern</text>
        <text x="0" y="48">&amp;bull; Rahmt Namen symmetrisch</text>
        <text x="0" y="72">&amp;bull; Eleganter Anime-Look</text>
      </g>

      <rect x="20" y="320" width="215" height="36" rx="8" fill="#241208"/>
      <text x="127" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">『 Symmetrisch &amp; Clean 』</text>
    </g>

    <!-- Card 4: Kronen -->
    <g transform="translate(840, 0)" filter="url(#ffSymbShadow)">
      <rect width="245" height="380" rx="20" fill="#170d06" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="45" y="52" text-anchor="middle" font-size="16">♛</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Kronen</text>
      
      <g transform="translate(20, 90)">
        <rect width="205" height="70" rx="12" fill="#0b0603"/>
        <text x="102" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#fbbf24">♛ King ♛</text>
      </g>

      <g transform="translate(20, 190)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="0" font-weight="700" fill="#ffffff">Eigenschaften:</text>
        <text x="0" y="24">&amp;bull; Royaler Grandmaster-Stil</text>
        <text x="0" y="48">&amp;bull; Beliebt bei Gilden-Chefs</text>
        <text x="0" y="72">&amp;bull; Symbolisiert Sieger &amp; MVP</text>
      </g>

      <rect x="20" y="320" width="205" height="36" rx="8" fill="#241208"/>
      <text x="122" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">♛ Royaler Sieger-Look ♛</text>
    </g>

  </g>
</svg>

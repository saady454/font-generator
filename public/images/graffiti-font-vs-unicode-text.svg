<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121222"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <filter id="splitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#splitBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="300" r="260" fill="#f97316" fill-opacity="0.10"/>
  <circle cx="920" cy="300" r="260" fill="#38bdf8" fill-opacity="0.10"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fb923c" letter-spacing="2">TECHNIK &amp; TYPOGRAFIE</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Echte Graffiti-Font vs. <tspan fill="#38bdf8">Kopierbarer Unicode-Text</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Der fundamentale Unterschied zwischen installierbaren Schriftdateien und Textzeichen
    </text>
  </g>

  <!-- Comparison Split Screen (Left: True Font File / Right: Copyable Unicode) -->
  <g transform="translate(80, 160)">
    
    <!-- LEFT CARD: Echte Graffiti Font (.otf / .ttf) -->
    <g transform="translate(0, 0)" filter="url(#splitShadow)">
      <rect width="500" height="420" rx="24" fill="#141424" stroke="#f97316" stroke-opacity="0.35" stroke-width="1.5"/>
      
      <!-- Top Badge -->
      <rect x="25" y="24" width="240" height="28" rx="14" fill="#f97316" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fb923c">📁 ECHTE SCHRIFTDATEI (.TTF/.OTF)</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#fb923c" font-weight="700">Visuelle Glyphen</text>

      <!-- Visual Display Screen Mockup -->
      <rect x="25" y="68" width="450" height="150" rx="16" fill="#0d0d18" stroke="#f97316" stroke-opacity="0.2"/>
      
      <!-- Illustration of Vector Glyphs in Design App -->
      <text x="225" y="125" text-anchor="middle" font-family="Impact, sans-serif" font-size="44" font-weight="900" fill="#fb923c" letter-spacing="4">GRAFFITI</text>
      <text x="225" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="600">✓ Vektorkurven, Drips &amp; Splatter-Effekte</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Wird in Photoshop, Illustrator &amp; Word gerendert</text>

      <!-- Feature List -->
      <g transform="translate(25, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften &amp; Vorteile:</text>
        
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#f97316"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">100% authentischer Street-Art- und Tag-Look</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#f97316"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Perfekt für Print-Poster, Logos, Merch &amp; Textilien</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#f97316"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Benötigt lokale Installation im Betriebssystem</text>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: Kopierbarer Unicode-Text (Copy &amp; Paste) -->
    <g transform="translate(540, 0)" filter="url(#splitShadow)">
      <rect width="500" height="420" rx="24" fill="#141424" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      
      <!-- Top Badge -->
      <rect x="25" y="24" width="240" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">📋 KOPIERBARER UNICODE-TEXT</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">Reiner Text</text>

      <!-- Visual Display Screen Mockup -->
      <rect x="25" y="68" width="450" height="150" rx="16" fill="#0d0d18" stroke="#38bdf8" stroke-opacity="0.2"/>
      
      <text x="225" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" font-style="italic" fill="#ffffff">𝒢𝓇𝒶𝒻𝒻𝒾𝓉𝒾 𝒯𝒶𝑔</text>
      <text x="225" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8" font-weight="600">✓ Direktes Copy &amp; Paste in Bio und Chat</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Besteht aus mathematischen &amp; kalligrafischen Zeichen</text>

      <!-- Feature List -->
      <g transform="translate(25, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften &amp; Vorteile:</text>
        
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Funktioniert sofort ohne Download oder Software</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Für Instagram-Bios, TikTok-Namen &amp; WhatsApp</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Eingeschränkte Detailtiefe im Vergleich zu Vektoren</text>
        </g>
      </g>
    </g>

  </g>
</svg>

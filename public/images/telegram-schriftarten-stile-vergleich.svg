<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tgStileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#tgStileBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#229ED9" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="240" fill="#7dd3fc" fill-opacity="0.06"/>

  <!-- Section Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#0f1f38" stroke="#229ED9" stroke-opacity="0.4"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" letter-spacing="1.5">TELEGRAM STILE IM VERGLEICH</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff">
    Welche Schriftstile eignen sich für Telegram?
  </text>
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    Wirkung, Eignung und typografische Einsatzbereiche für Chats, Gruppen &amp; Kanäle
  </text>

  <!-- 6 Comparison Rows Grid -->
  <g transform="translate(100, 180)">
    <!-- Column Headers -->
    <rect width="1000" height="36" rx="8" fill="#101c32"/>
    <text x="30" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" letter-spacing="1">STIL</text>
    <text x="240" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" letter-spacing="1">BEISPIEL (UNICODE)</text>
    <text x="560" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" letter-spacing="1">GEEIGNET FÜR</text>
    <text x="820" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" letter-spacing="1">WIRKUNG</text>

    <!-- Row 1: Fett -->
    <g transform="translate(0, 46)">
      <rect width="1000" height="52" rx="10" fill="#0c1628" stroke="#229ED9" stroke-opacity="0.25"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#229ED9" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc">Fett</text>
      <text x="240" y="33" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">𝗙𝗲𝘁𝘁𝗲 𝗦𝗰𝗵𝗿𝗶𝗳𝘁</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">wichtige Wörter, Titel</text>
      <text x="820" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#4ade80">auffällig</text>
    </g>

    <!-- Row 2: Kursiv -->
    <g transform="translate(0, 106)">
      <rect width="1000" height="52" rx="10" fill="#0c1628" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">Kursiv</text>
      <text x="240" y="33" font-family="system-ui, sans-serif" font-size="18" font-style="italic" font-weight="700" fill="#ffffff">𝘒𝘶𝘳𝘴𝘪𝘷𝘦 𝘚𝘤𝘩𝘳𝘪𝘧𝘵</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">kurze Betonungen, Zitate</text>
      <text x="820" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">dezent</text>
    </g>

    <!-- Row 3: Gothic / Fraktur -->
    <g transform="translate(0, 166)">
      <rect width="1000" height="52" rx="10" fill="#0c1628" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="105" height="24" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="70" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">Gothic</text>
      <text x="240" y="33" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#ffffff">𝔊𝔬𝔱𝔦𝔰𝔠𝔥𝔢 𝔖𝔠𝔥𝔯𝔦𝔣𝔱</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Namen und kreative Texte</text>
      <text x="820" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#fbbf24">markant</text>
    </g>

    <!-- Row 4: Monospace -->
    <g transform="translate(0, 226)">
      <rect width="1000" height="52" rx="10" fill="#0c1628" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="95" height="24" rx="6" fill="#34d399" fill-opacity="0.15"/>
      <text x="65" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">Monospace</text>
      <text x="240" y="33" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#ffffff">𝙼𝚘𝚗𝚘𝚜𝚙𝚊𝚌𝚎 𝚃𝚎𝚡𝚝</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">technische Inhalte, Code</text>
      <text x="820" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#34d399">sachlich</text>
    </g>

    <!-- Row 5: Bubble -->
    <g transform="translate(0, 286)">
      <rect width="1000" height="52" rx="10" fill="#0c1628" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#f472b6" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">Bubble</text>
      <text x="240" y="33" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">ⓑⓤⓑⓑⓛⓔ</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">kurze Namen, Akzente</text>
      <text x="820" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#f472b6">verspielt</text>
    </g>

    <!-- Row 6: Script -->
    <g transform="translate(0, 346)">
      <rect width="1000" height="52" rx="10" fill="#0c1628" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="18" y="14" width="80" height="24" rx="6" fill="#c084fc" fill-opacity="0.15"/>
      <text x="58" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">Script</text>
      <text x="240" y="33" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ffffff">𝓢𝓬𝓻𝓲𝓹𝓽 𝓣𝓮𝔁𝓽</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">kreative Profile &amp; Bio</text>
      <text x="820" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#c084fc">dekorativ</text>
    </g>

  </g>
</svg>

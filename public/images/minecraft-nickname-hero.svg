<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="mcHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e0a"/>
      <stop offset="50%" stop-color="#0f2218"/>
      <stop offset="100%" stop-color="#040906"/>
    </linearGradient>
    <linearGradient id="mcEmeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="mcDiamondGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="mcCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#mcHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="220" r="300" fill="#10b981" fill-opacity="0.12"/>
  <circle cx="940" cy="450" r="280" fill="#38bdf8" fill-opacity="0.10"/>
  <circle cx="600" cy="300" r="220" fill="#fbbf24" fill-opacity="0.05"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#132a1e" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#34d399" letter-spacing="2">⛏️ MINECRAFT NICKNAME STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Minecraft Nickname: <tspan fill="url(#mcDiamondGrad)">Coole Namen mit Schrift &amp; Symbolen</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Kreative Namen, Unicode-Schriftstile &amp; Symbole für Java Edition, Bedrock &amp; Server
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#mcCardShadow)">
    <rect width="1020" height="420" rx="28" fill="#0c1a13" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#060e09" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Minecraft Player Card Mockup -->
    <g transform="translate(50, 45)">
      <rect width="280" height="330" rx="20" fill="#0f2218" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      
      <!-- Avatar &amp; Profile Header -->
      <g transform="translate(18, 18)">
        <circle cx="24" cy="24" r="23" fill="none" stroke="url(#mcEmeraldGold)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="20" fill="#06120b"/>
        <text x="24" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">⛏️</text>
        <text x="58" y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">𝕯𝖆𝖗𝖐𝖂𝖔𝖑𝖋</text>
        <text x="58" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">Java &amp;bull; Bedrock Builder</text>
      </g>

      <!-- Stats Bar -->
      <g transform="translate(18, 70)" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
        <text x="20" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ffffff">SMP Pro</tspan><tspan dy="12" x="20">Rang</tspan></text>
        <text x="115" y="12" text-anchor="middle"><tspan font-weight="800" fill="#fbbf24">Level 78</tspan><tspan dy="12" x="115">XP Farm</tspan></text>
        <text x="205" y="12" text-anchor="middle"><tspan font-weight="800" fill="#38bdf8">1.2k</tspan><tspan dy="12" x="205">Stunden ⏱️</tspan></text>
      </g>

      <!-- Display Name Simulation -->
      <g transform="translate(18, 110)">
        <rect width="244" height="135" rx="10" fill="#060e09" stroke="#10b981" stroke-opacity="0.3"/>
        
        <text x="12" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" letter-spacing="1">SERVER DISPLAY NAME</text>
        <text x="12" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">⚔️ 𝕯𝖆𝖗𝖐𝖂𝖔𝖑𝖋 ⚔️</text>
        
        <rect x="12" y="70" width="220" height="24" rx="6" fill="#132a1e"/>
        <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">✓ 30-Tage Java Limit</text>
        <text x="135" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">✓ SMP Server Ready</text>
        
        <text x="12" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Status: Online auf Hypixel 🏰</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(18, 260)">
        <rect width="244" height="34" rx="8" fill="url(#mcEmeraldGold)"/>
        <text x="122" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#06120b">Auf Server kopieren 📋</text>
      </g>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(365, 45)">
      <rect width="605" height="330" rx="20" fill="#0f2218" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" letter-spacing="1">MINECRAFT NAME EINGEBEN</text>
        <rect x="0" y="24" width="555" height="42" rx="10" fill="#060e09" stroke="#10b981" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">PixelKing</text>
        <rect x="465" y="32" width="80" height="26" rx="6" fill="url(#mcEmeraldGold)"/>
        <text x="505" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#06120b">Generieren ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Style 1: Fett -->
        <g transform="translate(0, 0)">
          <rect width="265" height="46" rx="10" fill="#132a1e" stroke="#fbbf24" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">FETT (KLAR &amp; STARK)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">𝐏𝐢𝐱𝐞𝐥𝐊𝐢𝐧𝐠</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#fbbf24" fill-opacity="0.2"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Kopie</text>
        </g>

        <!-- Style 2: Kursiv -->
        <g transform="translate(285, 0)">
          <rect width="270" height="46" rx="10" fill="#132a1e" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">KURSIV (ELEGANT)</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-style="italic" font-weight="700" fill="#ffffff">𝑳𝒖𝒏𝒂𝒓𝑪𝒓𝒂𝒇𝒕</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 3: Gotisch -->
        <g transform="translate(0, 56)">
          <rect width="265" height="46" rx="10" fill="#132a1e" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#a78bfa">GOTISCH (DARK / MYSTISCH)</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝕯𝖆𝖗𝖐𝖂𝖔𝖑𝖋</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 4: Dekorativ -->
        <g transform="translate(285, 56)">
          <rect width="270" height="46" rx="10" fill="#132a1e" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f472b6">DEKORATIV (KLAMMERN)</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">꧁CraftWolf꧂</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 5: Gaming Symbole -->
        <g transform="translate(0, 112)">
          <rect width="265" height="46" rx="10" fill="#132a1e" stroke="#34d399" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">GAMING SYMBOLE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">⚔️ PixelBauer ⚔️</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#34d399" fill-opacity="0.2"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">Kopie</text>
        </g>

        <!-- Style 6: Nether / Fantasy -->
        <g transform="translate(285, 112)">
          <rect width="270" height="46" rx="10" fill="#132a1e" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f87171">FANTASY / SURVIVAL</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝕹𝖊𝖙𝖍𝖊𝖗𝕱𝖔𝖝</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Full width Bottom CTA -->
        <g transform="translate(0, 168)">
          <rect width="555" height="46" rx="10" fill="url(#mcEmeraldGold)"/>
          <text x="277" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#06120b">⚡ 500+ Minecraft Nicknames &amp; Symbole im Generator ausprobieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="flow14Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#14142b"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="flow14Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="flow14Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#flow14Bg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#fbbf24" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">4-SCHRITTE-ANLEITUNG</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      So funktioniert der <tspan fill="url(#flow14Grad)">Schriftarten-Generator</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      In wenigen Sekunden vom normalen Text zum formatierten Social-Media-Look
    </text>
  </g>

  <!-- 4 Steps Flow Cards -->
  <g transform="translate(70, 160)">
    
    <!-- Step 1: Text eingeben -->
    <g transform="translate(0, 0)" filter="url(#flow14Shadow)">
      <rect width="240" height="430" rx="20" fill="#111827" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="120" cy="50" r="26" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="120" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#fbbf24">1</text>
      
      <text x="120" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Text eingeben</text>
      <text x="120" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Wort, Zitat oder Nickname</text>

      <!-- Mock Visual -->
      <rect x="20" y="160" width="200" height="90" rx="10" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.3"/>
      <text x="35" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Eingabe:</text>
      <text x="35" y="225" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Mein Profil ✨</text>

      <g transform="translate(20, 275)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="20">• Schreibe deinen Text</text>
        <text x="0" y="45">• Funktioniert mobil &amp; PC</text>
        <text x="0" y="70">• Keine Anmeldung nötig</text>
      </g>
    </g>

    <!-- Connector Arrow 1 -->
    <text x="255" y="230" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#fbbf24">➔</text>

    <!-- Step 2: Stil auswählen -->
    <g transform="translate(275, 0)" filter="url(#flow14Shadow)">
      <rect width="240" height="430" rx="20" fill="#111827" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="120" cy="50" r="26" fill="#f43f5e" fill-opacity="0.15"/>
      <text x="120" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#f43f5e">2</text>
      
      <text x="120" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Stil auswählen</text>
      <text x="120" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">14 Varianten vergleichen</text>

      <!-- Mock Visual -->
      <g transform="translate(20, 160)">
        <rect width="200" height="38" rx="8" fill="#080d1a" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">𝗠𝗲𝗶𝗻 𝗣𝗿𝗼𝗳𝗶𝗹</text>
        
        <rect y="48" width="200" height="38" rx="8" fill="#080d1a" stroke="#f43f5e" stroke-opacity="0.4"/>
        <text x="15" y="72" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f43f5e">𝕸𝖊𝖎𝖓 𝕻𝖗𝖔𝖋𝖎𝖑</text>
      </g>

      <g transform="translate(20, 275)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="20">• Live-Echtzeit-Vorschau</text>
        <text x="0" y="45">• Fette, gotische &amp; Zitate</text>
        <text x="0" y="70">• Finde deinen Favoriten</text>
      </g>
    </g>

    <!-- Connector Arrow 2 -->
    <text x="530" y="230" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#f43f5e">➔</text>

    <!-- Step 3: Kopieren -->
    <g transform="translate(550, 0)" filter="url(#flow14Shadow)">
      <rect width="240" height="430" rx="20" fill="#111827" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="120" cy="50" r="26" fill="#10b981" fill-opacity="0.15"/>
      <text x="120" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#10b981">3</text>
      
      <text x="120" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Kopieren</text>
      <text x="120" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">1-Klick in die Ablage</text>

      <!-- Mock Visual -->
      <g transform="translate(20, 160)">
        <rect width="200" height="90" rx="10" fill="#080d1a" stroke="#10b981" stroke-opacity="0.3"/>
        <rect x="25" y="25" width="150" height="40" rx="8" fill="#10b981"/>
        <text x="100" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#064e3b">✓ KOPIERT!</text>
      </g>

      <g transform="translate(20, 275)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="20">• 1-Klick Copy-Button</text>
        <text x="0" y="45">• Sofort in der Zwischenablage</text>
        <text x="0" y="70">• Keine Werbung beim Klick</text>
      </g>
    </g>

    <!-- Connector Arrow 3 -->
    <text x="805" y="230" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#10b981">➔</text>

    <!-- Step 4: Einfügen -->
    <g transform="translate(825, 0)" filter="url(#flow14Shadow)">
      <rect width="240" height="430" rx="20" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="120" cy="50" r="26" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="120" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#38bdf8">4</text>
      
      <text x="120" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Einfügen</text>
      <text x="120" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Social Media &amp; Games</text>

      <!-- Mock Visual -->
      <g transform="translate(20, 160)">
        <rect width="200" height="90" rx="10" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Instagram / TikTok:</text>
        <text x="20" y="62" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Bio: 𝕸𝖊𝖎𝖓 𝕻𝖗𝖔𝖋𝖎𝖑</text>
      </g>

      <g transform="translate(20, 275)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="20">• Instagram, TikTok, WA</text>
        <text x="0" y="45">• Discord &amp; Gaming-Profile</text>
        <text x="0" y="70">• Bleibt überall formatiert</text>
      </g>
    </g>

  </g>
</svg>

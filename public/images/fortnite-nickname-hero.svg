<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="fnHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="fnPurpleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="fnGoldYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="fnCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#fnHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="220" r="300" fill="#a855f7" fill-opacity="0.12"/>
  <circle cx="940" cy="450" r="280" fill="#06b6d4" fill-opacity="0.10"/>
  <circle cx="600" cy="300" r="220" fill="#6366f1" fill-opacity="0.06"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e1b4b" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#c084fc" letter-spacing="2">🎮 GAMING NICKNAME STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Fortnite Nickname: <tspan fill="url(#fnPurpleCyan)">Coole Namen &amp; Schriften</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Stylische Gaming-Namen, Unicode-Schriftstile &amp; Symbole für dein Epic Games Profil
  </text>

  <!-- Main Showcase Container -->
  <g transform="translate(90, 205)" filter="url(#fnCardShadow)">
    <rect width="1020" height="420" rx="28" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Inner Grid Area -->
    <rect x="25" y="25" width="970" height="370" rx="20" fill="#090d16" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Gaming Battle Royale Profile Mockup -->
    <g transform="translate(50, 45)">
      <rect width="280" height="330" rx="20" fill="#131c31" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      
      <!-- Avatar &amp; Profile Header -->
      <g transform="translate(18, 18)">
        <circle cx="24" cy="24" r="23" fill="none" stroke="url(#fnPurpleCyan)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="20" fill="#1e293b"/>
        <text x="24" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">⚡</text>
        <text x="58" y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">𝕾𝖍𝖆𝖉𝖔𝖜𝕹𝖔𝖛𝖆</text>
        <text x="58" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">Battle Royale Pro</text>
      </g>

      <!-- Stats Bar -->
      <g transform="translate(18, 70)" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
        <text x="20" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ffffff">Level 142</tspan><tspan dy="12" x="20">Battle Pass</tspan></text>
        <text x="115" y="12" text-anchor="middle"><tspan font-weight="800" fill="#f59e0b">★ 4.8</tspan><tspan dy="12" x="115">K/D Ratio</tspan></text>
        <text x="205" y="12" text-anchor="middle"><tspan font-weight="800" fill="#38bdf8">520</tspan><tspan dy="12" x="205">Wins 🏆</tspan></text>
      </g>

      <!-- Display Name Card -->
      <g transform="translate(18, 110)">
        <rect width="244" height="135" rx="10" fill="#090d16" stroke="#a855f7" stroke-opacity="0.3"/>
        
        <text x="12" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a855f7" letter-spacing="1">EPIC GAMES DISPLAY NAME</text>
        <text x="12" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">꧁ 𝕾𝖍𝖆𝖉𝖔𝖜 ꧂</text>
        
        <rect x="12" y="70" width="220" height="24" rx="6" fill="#1e293b"/>
        <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">✓ 3-16 Zeichen</text>
        <text x="110" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">✓ 14-Tage Limit OK</text>
        
        <text x="12" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Status: Bereit für Matchmaking 🚀</text>
      </g>

      <!-- Ready CTA Button -->
      <g transform="translate(18, 260)">
        <rect width="244" height="34" rx="8" fill="url(#fnPurpleCyan)"/>
        <text x="122" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">In Lobby verwenden ⚔️</text>
      </g>
    </g>

    <!-- Right: Text Generator Showcase Card -->
    <g transform="translate(365, 45)">
      <rect width="605" height="330" rx="20" fill="#131c31" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Input Simulation -->
      <g transform="translate(25, 20)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a855f7" letter-spacing="1">NICKNAME EINGEBEN</text>
        <rect x="0" y="24" width="555" height="42" rx="10" fill="#090d16" stroke="#6366f1" stroke-opacity="0.4"/>
        <text x="16" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Shadow</text>
        <rect x="465" y="32" width="80" height="26" rx="6" fill="url(#fnPurpleCyan)"/>
        <text x="505" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Generieren ✨</text>
      </g>

      <!-- Style Grid -->
      <g transform="translate(25, 95)">
        
        <!-- Style 1: Clean -->
        <g transform="translate(0, 0)">
          <rect width="265" height="46" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">CLEAN / COMPETITIVE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">ShadowNova</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Kopie</text>
        </g>

        <!-- Style 2: Fett -->
        <g transform="translate(285, 0)">
          <rect width="270" height="46" rx="10" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">FETT UNICODE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">𝐒𝐡𝐚𝐝𝐨𝐰</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 3: Kursiv -->
        <g transform="translate(0, 56)">
          <rect width="265" height="46" rx="10" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c084fc">KURSIV ELEGANT</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-style="italic" font-weight="700" fill="#ffffff">𝑺𝒉𝒂𝒅𝒐𝒘</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 4: Gotisch -->
        <g transform="translate(285, 56)">
          <rect width="270" height="46" rx="10" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f43f5e">GOTISCH / DARK</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝔖𝔥𝔞𝔡𝔬𝔴</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 5: Dekorativ mit Symbolen -->
        <g transform="translate(0, 112)">
          <rect width="265" height="46" rx="10" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">DEKORATIVE SYMBOLE</text>
          <text x="12" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">꧁Shadow꧂</text>
          <rect x="200" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="227" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Style 6: Dark Gaming -->
        <g transform="translate(285, 112)">
          <rect width="270" height="46" rx="10" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#a855f7">GAMING FRAKTUR</text>
          <text x="12" y="36" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">𝕯𝖆𝖗𝖐𝕹𝖔𝖛𝖆</text>
          <rect x="205" y="10" width="55" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
          <text x="232" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kopie</text>
        </g>

        <!-- Full width Bottom CTA -->
        <g transform="translate(0, 168)">
          <rect width="555" height="46" rx="10" fill="url(#fnPurpleCyan)"/>
          <text x="277" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">⚡ Jetzt 500+ Schriftstile für Fortnite kostenlos erstellen &amp; kopieren</text>
        </g>

      </g>
    </g>
  </g>
</svg>

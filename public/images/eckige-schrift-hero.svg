<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="boxHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#101426"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="cyanBlueBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#boxHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#38bdf8" fill-opacity="0.10"/>
  <circle cx="920" cy="460" r="280" fill="#818cf8" fill-opacity="0.08"/>

  <!-- Geometric Grid Accent -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="120" x2="1120" y2="120"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
    <line x1="200" y1="50" x2="200" y2="620"/>
    <line x1="1000" y1="50" x2="1000" y2="620"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-170" y="-18" width="340" height="36" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" letter-spacing="2">📦 BOXED &amp; SQUARE TYPOGRAPHY</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Eckige Schrift: <tspan fill="url(#cyanBlueBox)">Texte mit Boxen kopieren</tspan>
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Quadratische Rahmen, gefüllte Boxen (🅴🅲🅺🅸🅶) &amp; Monospace-Look für Social Media &amp; Gaming
  </text>

  <!-- Main Generator Canvas Card -->
  <g transform="translate(100, 215)" filter="url(#boxShadow)">
    <rect width="1000" height="400" rx="20" fill="#121728" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Paper Board -->
    <rect x="25" y="25" width="950" height="350" rx="14" fill="#080c16" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- Large Centerpiece: Boxed &amp; Framed Specimens -->
    <g transform="translate(500, 140)" text-anchor="middle">
      <text y="0" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#cyanBlueBox)" letter-spacing="4">🅴🅲🅺🅸🅶 🅂🄲🄷🅁🄸🄵🅃</text>
      <text y="55" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" letter-spacing="6">【 𝕭𝖔𝖝𝖊𝖉 】 &amp;bull; ⟦ 𝔽𝕣𝕒𝕞𝕖𝕕 ⟧ &amp;bull; 〖 𝕄𝕠𝕟𝕠 〗</text>
    </g>

    <!-- 4 Boxed Style Showcase Tiles Below -->
    <g transform="translate(60, 260)">
      
      <g transform="translate(0, 0)">
        <rect width="205" height="70" rx="10" fill="#161c30" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="1">SCHWARZE BOXEN</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">🅽🅸🅲🅺🅽🅰🅼🅴</text>
      </g>

      <g transform="translate(225, 0)">
        <rect width="205" height="70" rx="10" fill="#161c30" stroke="#818cf8" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a5b4fc" letter-spacing="1">WEISSE BOXEN</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">🄿🅁🄾🄵🄸🄻</text>
      </g>

      <g transform="translate(450, 0)">
        <rect width="205" height="70" rx="10" fill="#161c30" stroke="#34d399" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" letter-spacing="1">LINSENKLAMMERN</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">【 𝓒𝓛𝓐𝓝 𝓣𝓐𝓖 】</text>
      </g>

      <g transform="translate(675, 0)">
        <rect width="205" height="70" rx="10" fill="#161c30" stroke="#f59e0b" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="1">MONOSPACE</text>
        <text x="20" y="52" font-family="monospace, Courier" font-size="16" font-weight="700" fill="#ffffff">𝚌𝚘𝚍𝚎_𝚜𝚝𝚢𝚕𝚎</text>
      </g>
    </g>
  </g>
</svg>

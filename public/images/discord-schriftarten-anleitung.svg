<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="dcStepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="50%" stop-color="#101324"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>
    <linearGradient id="dcBlurpleStep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#808bf5"/>
    </linearGradient>
    <filter id="dcStepShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#dcStepBg)"/>

  <!-- Ambient Glows -->
  <circle cx="250" cy="220" r="240" fill="#5865F2" fill-opacity="0.08"/>
  <circle cx="950" cy="450" r="260" fill="#808bf5" fill-opacity="0.08"/>

  <!-- Badge &amp; Header -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#181b30" stroke="#5865F2" stroke-opacity="0.35"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#808bf5" letter-spacing="1.5">SCHRITT-FÜR-SCHRITT ANLEITUNG</text>
  </g>

  <text x="600" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff">
    So erstellst du Discord Schriftarten
  </text>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    In 4 unkomplizierten Schritten von der Texteingabe zum formatierten Discord Profil &amp; Server
  </text>

  <!-- 4 Step Cards Grid -->
  <g transform="translate(70, 200)">
    
    <!-- Step 1: Text eingeben -->
    <g transform="translate(0, 0)" filter="url(#dcStepShadow)">
      <rect width="245" height="400" rx="20" fill="#101324" stroke="#5865F2" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="url(#dcBlurpleStep)"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">1</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Text eingeben</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Öffne den Generator und tippe deinen Namen, Rolle oder Kanalnamen ein.
      </text>

      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#080a12" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#808bf5">EINGABE</text>
        <rect x="15" y="42" width="175" height="40" rx="8" fill="#181b30" stroke="#5865F2" stroke-opacity="0.4"/>
        <text x="26" y="67" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Shadow Blade</text>
        
        <rect x="15" y="100" width="175" height="85" rx="8" fill="#181b30" stroke="#ffffff" stroke-opacity="0.04"/>
        <text x="26" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Für: Anzeigename &amp; Rollen</text>
        <text x="26" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#808bf5">✓ Unicode kompatibel</text>
      </g>
    </g>

    <!-- Step 2: Stil auswählen -->
    <g transform="translate(270, 0)" filter="url(#dcStepShadow)">
      <rect width="245" height="400" rx="20" fill="#101324" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="#1c2038" stroke="#5865F2" stroke-width="2"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#808bf5">2</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Stil wählen</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Vergleiche fette, gotische, Monospace- und Bubble-Vorschauen.
      </text>

      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#080a12" stroke="#ffffff" stroke-opacity="0.06"/>
        
        <rect x="15" y="15" width="175" height="42" rx="8" fill="#181b30"/>
        <text x="25" y="41" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">𝗦𝗵𝗮𝗱𝗼𝘄 𝗕𝗹𝗮𝗱𝗲</text>
        
        <rect x="15" y="66" width="175" height="42" rx="8" fill="#242848" stroke="#5865F2" stroke-width="1.5"/>
        <text x="25" y="92" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#808bf5">𝔖𝔥𝔞𝔡𝔬𝔴 𝔅𝔩𝔞𝔡𝔢</text>
        <circle cx="175" cy="87" r="6" fill="#5865F2"/>

        <rect x="15" y="117" width="175" height="42" rx="8" fill="#181b30"/>
        <text x="25" y="143" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#ffffff">𝚂𝚑𝚊𝚍𝚘𝚠 𝙱𝚕𝚊𝚍𝚎</text>
      </g>
    </g>

    <!-- Step 3: Kopieren -->
    <g transform="translate(540, 0)" filter="url(#dcStepShadow)">
      <rect width="245" height="400" rx="20" fill="#101324" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="#1c2038" stroke="#5865F2" stroke-width="2"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#808bf5">3</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">1-Klick Kopieren</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Klicke auf den Button und übertrage den fertigen Text in die Zwischenablage.
      </text>

      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#080a12" stroke="#ffffff" stroke-opacity="0.06"/>
        
        <rect x="25" y="30" width="155" height="80" rx="10" fill="#181b30" stroke="#5865F2" stroke-opacity="0.3"/>
        <text x="102" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff">𝔖𝔥𝔞𝔡𝔬𝔴 𝔅𝔩𝔞𝔡𝔢</text>
        <text x="102" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#808bf5">UTF-8 Unicode</text>

        <rect x="25" y="130" width="155" height="46" rx="10" fill="url(#dcBlurpleStep)"/>
        <text x="102" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">📋 Kopiert!</text>
      </g>
    </g>

    <!-- Step 4: Bei Discord einfügen -->
    <g transform="translate(810, 0)" filter="url(#dcStepShadow)">
      <rect width="245" height="400" rx="20" fill="#101324" stroke="#5865F2" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="url(#dcBlurpleStep)"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">4</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">In Discord einfügen</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Öffne Einstellungen → Anzeigename / Serverkanal und füge den Text ein.
      </text>

      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#080a12" stroke="#5865F2" stroke-opacity="0.2"/>
        
        <circle cx="102" cy="45" r="24" fill="#181b30" stroke="#5865F2" stroke-width="2"/>
        <text x="102" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">⚔️</text>

        <rect x="20" y="85" width="165" height="34" rx="6" fill="#181b30" stroke="#5865F2" stroke-opacity="0.4"/>
        <text x="102" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#ffffff">𝔖𝔥𝔞𝔡𝔬𝔴 𝔅𝔩𝔞𝔡𝔢</text>

        <rect x="20" y="130" width="165" height="60" rx="6" fill="#181b30" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="30" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#808bf5">Anzeigename aktiv:</text>
        <text x="30" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Sichtbar auf allen Servern ✓</text>
      </g>
    </g>

  </g>
</svg>

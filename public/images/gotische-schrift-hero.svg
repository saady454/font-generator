<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="gothicHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="gothicGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gothicCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e111a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="gothicShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#gothicHeroBg)"/>

  <!-- Dramatic Medieval Glow Orbs -->
  <circle cx="260" cy="180" r="290" fill="#d97706" fill-opacity="0.12"/>
  <circle cx="940" cy="470" r="310" fill="#8b5cf6" fill-opacity="0.08"/>

  <!-- Architectural Gothic Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="4 8">
    <line x1="100" y1="120" x2="1100" y2="120"/>
    <line x1="100" y1="260" x2="1100" y2="260"/>
    <line x1="100" y1="400" x2="1100" y2="400"/>
    <line x1="100" y1="540" x2="1100" y2="540"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(600, 65)" text-anchor="middle">
    <rect x="-150" y="-18" width="300" height="36" rx="18" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="2">⚔️ FRAKTUR &amp; BLACKLETTER</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Gotische Schrift: <tspan fill="url(#gothicGoldGrad)">Fraktur &amp; Blackletter kopieren</tspan>
  </text>
  <text x="600" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Historische und moderne gotische Buchstaben für Gaming-Namen, Bios und kreative Texte
  </text>

  <!-- 4 Cards Display -->
  <g transform="translate(80, 220)">
    
    <!-- 1. Classic Fraktur -->
    <g transform="translate(0, 0)" filter="url(#gothicShadow)">
      <rect width="240" height="270" rx="16" fill="url(#gothicCardGrad)" stroke="#d97706" stroke-opacity="0.5" stroke-width="1.5"/>
      <rect x="15" y="15" width="120" height="22" rx="6" fill="#d97706" fill-opacity="0.2"/>
      <text x="75" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">FRAKTUR SCHRIFT</text>

      <text x="120" y="115" font-family="'UnifrakturMaguntia', serif, 'Times New Roman'" font-size="40" fill="#ffffff" text-anchor="middle">𝔊𝔬𝔱𝔦𝔰𝔠𝔥</text>
      <text x="120" y="155" font-family="'UnifrakturMaguntia', serif, 'Times New Roman'" font-size="22" fill="#fbbf24" text-anchor="middle">𝔖𝔠𝔥𝔯𝔦𝔣𝔱</text>

      <line x1="20" y1="185" x2="220" y2="185" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="120" y="212" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Historisch &amp; feingliedrig</text>
      <text x="120" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Klassischer Buchdruck</text>
    </g>

    <!-- 2. Bold Fraktur / Blackletter -->
    <g transform="translate(265, 0)" filter="url(#gothicShadow)">
      <rect width="240" height="270" rx="16" fill="url(#gothicCardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <rect x="15" y="15" width="115" height="22" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="72" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">FETTE FRAKTUR</text>

      <text x="120" y="115" font-family="'UnifrakturCook', serif, 'Times New Roman'" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">𝕲𝖔𝖙𝖎𝖘𝖈𝖍</text>
      <text x="120" y="155" font-family="'UnifrakturCook', serif, 'Times New Roman'" font-size="22" font-weight="900" fill="#fbbf24" text-anchor="middle">𝕾𝖈𝖍𝖗𝖎𝖋𝖙</text>

      <line x1="20" y1="185" x2="220" y2="185" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="120" y="212" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Dunkel &amp; kraftvoll</text>
      <text x="120" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Gaming Nicknames &amp; Clans</text>
    </g>

    <!-- 3. Old English / Medieval -->
    <g transform="translate(530, 0)" filter="url(#gothicShadow)">
      <rect width="240" height="270" rx="16" fill="url(#gothicCardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <rect x="15" y="15" width="110" height="22" rx="6" fill="#a855f7" fill-opacity="0.15"/>
      <text x="70" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#c084fc" text-anchor="middle">OLD ENGLISH</text>

      <text x="120" y="115" font-family="serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">⚔️ 𝕶𝖎𝖓𝖌 ⚔️</text>
      <text x="120" y="155" font-family="serif" font-size="18" fill="#c084fc" text-anchor="middle">𝕯𝖆𝖗𝖐𝖓𝖊𝖘𝖘</text>

      <line x1="20" y1="185" x2="220" y2="185" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="120" y="212" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Mittelalterlich &amp; mystisch</text>
      <text x="120" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">RPG &amp; Fantasy-Profile</text>
    </g>

    <!-- 4. Tattoo / Chicano Style -->
    <g transform="translate(795, 0)" filter="url(#gothicShadow)">
      <rect width="245" height="270" rx="16" fill="url(#gothicCardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="15" y="15" width="120" height="22" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="75" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle">TATTOO GOTHIC</text>

      <text x="122" y="115" font-family="monospace" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">༺ 𝕷𝖊𝖌𝖊𝖓𝖉 ༻</text>
      <text x="122" y="155" font-family="sans-serif" font-size="18" font-weight="800" fill="#38bdf8" text-anchor="middle">✦ 𝕾𝖍𝖆𝖉𝖔𝖜 ✦</text>

      <line x1="20" y1="185" x2="225" y2="185" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="122" y="212" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Streetwear &amp; Lettering</text>
      <text x="122" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Social Media Bios</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <g transform="translate(600, 580)" text-anchor="middle">
    <rect x="-300" y="-18" width="600" height="36" rx="18" fill="#0e111a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text y="5" font-family="sans-serif" font-size="13" fill="#94a3b8">
      🛡️ <tspan fill="#ffffff" font-weight="700">100% Unicode:</tspan> Einfach kopieren und in Fortnite, Discord &amp; Instagram einfügen
    </text>
  </g>
</svg>

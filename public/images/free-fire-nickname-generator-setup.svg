<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ffSetupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0705"/>
      <stop offset="50%" stop-color="#1f1107"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
    <linearGradient id="ffSetupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="ffSetupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ffSetupBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#ff7a00" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#fbbf24" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#261306" stroke="#ff7a00" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ff9933" letter-spacing="2">MOBILE GAMING WORKFLOW</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Generator &amp; Gaming-Setup <tspan fill="url(#ffSetupGrad)">für Free Fire</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Namensvarianten einfach vergleichen, per Klick kopieren und im Profil aktivieren
    </text>
  </g>

  <!-- 4 Process &amp; Cross-Platform Cards -->
  <g transform="translate(60, 155)">
    
    <!-- Step 1 -->
    <g transform="translate(0, 0)" filter="url(#ffSetupShadow)">
      <rect width="255" height="430" rx="20" fill="#170d06" stroke="#ff7a00" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#ff7a00" fill-opacity="0.15"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ff7a00">1</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Basisname</text>
      
      <g transform="translate(20, 95)">
        <rect width="215" height="75" rx="12" fill="#0b0603"/>
        <text x="15" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ff7a00">SCHRITT 1</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#ffffff">Kurzes Wort</text>
      </g>

      <g transform="translate(20, 195)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="0" font-weight="700" fill="#ffffff">Wähle deinen Kern:</text>
        <text x="0" y="24">Starte mit 4–8</text>
        <text x="0" y="44">Buchstaben wie</text>
        <text x="0" y="64">Raven, Viper, Nova.</text>
        <text x="0" y="94" font-weight="700" fill="#ff7a00">Spart Platz für Symbole</text>
      </g>

      <rect x="20" y="370" width="215" height="36" rx="8" fill="#241208"/>
      <text x="127" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ff7a00">1. Wort eingeben</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(280, 0)" filter="url(#ffSetupShadow)">
      <rect width="255" height="430" rx="20" fill="#170d06" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#fbbf24">2</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Stil wählen</text>
      
      <g transform="translate(20, 95)">
        <rect width="215" height="75" rx="12" fill="#0b0603"/>
        <text x="15" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24">SCHRITT 2</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#ffffff">𝕽𝖆𝖛𝖊𝖓 &amp;bull; 𝗦𝗵𝗮𝗱𝗼𝘄</text>
      </g>

      <g transform="translate(20, 195)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="0" font-weight="700" fill="#ffffff">Unicode testen:</text>
        <text x="0" y="24">Fett für Pro-Look,</text>
        <text x="0" y="44">Gotisch für Dark,</text>
        <text x="0" y="64">Small Caps für Clean.</text>
        <text x="0" y="94" font-weight="700" fill="#fbbf24">Über 50+ Stile</text>
      </g>

      <rect x="20" y="370" width="215" height="36" rx="8" fill="#241208"/>
      <text x="127" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">2. Schrift aussuchen</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(560, 0)" filter="url(#ffSetupShadow)">
      <rect width="255" height="430" rx="20" fill="#170d06" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#38bdf8">3</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Kopieren</text>
      
      <g transform="translate(20, 95)">
        <rect width="215" height="75" rx="12" fill="#0b0603"/>
        <text x="15" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">SCHRITT 3</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#ffffff">1-Klick Kopie 📋</text>
      </g>

      <g transform="translate(20, 195)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="0" font-weight="700" fill="#ffffff">Zwischenablage:</text>
        <text x="0" y="24">Keine App-Installation</text>
        <text x="0" y="44">nötig. Direkt in</text>
        <text x="0" y="64">die Zwischenablage.</text>
        <text x="0" y="94" font-weight="700" fill="#38bdf8">Mobil &amp; Desktop</text>
      </g>

      <rect x="20" y="370" width="215" height="36" rx="8" fill="#241208"/>
      <text x="127" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">3. In Clipboard</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(840, 0)" filter="url(#ffSetupShadow)">
      <rect width="245" height="430" rx="20" fill="#170d06" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="20" fill="#34d399" fill-opacity="0.15"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#34d399">4</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Ingame Test</text>
      
      <g transform="translate(20, 95)">
        <rect width="205" height="75" rx="12" fill="#0b0603"/>
        <text x="15" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399">SCHRITT 4</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">Profil prüfen ✅</text>
      </g>

      <g transform="translate(20, 195)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="0" font-weight="700" fill="#ffffff">Im Spiel einfügen:</text>
        <text x="0" y="24">Profil öffnen,</text>
        <text x="0" y="44">Vorschau kontrollieren</text>
        <text x="0" y="64">&amp; Namen bestätigen.</text>
        <text x="0" y="94" font-weight="700" fill="#34d399">Booyah bereit!</text>
      </g>

      <rect x="20" y="370" width="205" height="36" rx="8" fill="#241208"/>
      <text x="122" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">4. Name aktiv</text>
    </g>

  </g>
</svg>

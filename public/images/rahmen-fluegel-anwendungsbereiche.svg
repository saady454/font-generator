        <g transform="translate(15, 20)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="14">【 Clan: VORTEX ELITE 】</text>
          <text x="0" y="38">〖 Role: AWP / Duelist 〗</text>
          <text x="0" y="62">〘 Premier Rating: 24.500 〙</text>
          <text x="0" y="92" font-size="11" fill="#38bdf8 font-weight=700">discord.gg/vortex ↗</text>
        </g>

        <rect y="340" width="290" height="36" rx="8" fill="#1e293b"/>
        <text x="145" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Stil: ꧁༺ Name ༻꧂ &amp;bull; 【 】</text>
      </g>
    </g>

    <!-- 3. WhatsApp Chat &amp; Textbox -->
    <g transform="translate(740, 0)" filter="url(#rfAppShadow)">
      <rect width="340" height="440" rx="22" fill="#111827" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="130" height="26" rx="6" fill="#22c55e" fill-opacity="0.15"/>
        <text x="65" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">WHATSAPP CHAT</text>
        
        <circle cx="145" cy="85" r="32" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
        <text x="145" y="93" text-anchor="middle" font-size="24">💬</text>

        <text x="145" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#ffffff">❴ Team Info ❵</text>
        <text x="145" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">Gruppen-Ankündigung</text>

        <rect y="185" width="290" height="135" rx="12" fill="#090d16"/>
        <g transform="translate(15, 20)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="14" font-family="monospace" fill="#22c55e">╔══════════════════╗</text>
          <text x="0" y="34" font-family="monospace" fill="#ffffff">║ Wichtiges Update ║</text>
          <text x="0" y="54" font-family="monospace" fill="#22c55e">╚══════════════════╝</text>
          <text x="0" y="76">ʚ✿ɞ Meeting heute um 18 Uhr</text>
          <text x="0" y="96">【 Bitte pünktlich sein! 】</text>
        </g>

        <rect y="340" width="290" height="36" rx="8" fill="#1e293b"/>
        <text x="145" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#22c55e">Stil: ╔══╗ &amp;bull; ❴ ❵ &amp;bull; ʚ✿ɞ</text>
      </g>
    </g>

  </g>
</svg>

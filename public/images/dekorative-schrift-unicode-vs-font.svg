<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="splitDecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14"/>
      <stop offset="50%" stop-color="#141226"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <filter id="splitDecoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#splitDecoBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="300" r="260" fill="#ec4899" fill-opacity="0.10"/>
  <circle cx="920" cy="300" r="260" fill="#38bdf8" fill-opacity="0.10"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">TECHNOLOGIE-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Dekorative Unicode-Schrift vs. <tspan fill="#ec4899">Echte Display-Schriftdatei</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Mathematische Zeichen &amp; Symbole vs. professionelle Display-Fontdateien (.TTF / .OTF)
    </text>
  </g>

  <!-- Split Comparison Layout -->
  <g transform="translate(80, 160)">
    
    <!-- LEFT CARD: Unicode Schmuckschrift (Copy &amp; Paste) -->
    <g transform="translate(0, 0)" filter="url(#splitDecoShadow)">
      <rect width="500" height="420" rx="24" fill="#141226" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.5"/>
      
      <!-- Top Badge -->
      <rect x="25" y="24" width="240" height="28" rx="14" fill="#ec4899" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">📋 UNICODE-TEXT &amp; SYMBOLE</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#ec4899" font-weight="700">Reiner Text</text>

      <!-- Mockup Area -->
      <rect x="25" y="68" width="450" height="150" rx="16" fill="#0b0816" stroke="#ec4899" stroke-opacity="0.2"/>
      
      <text x="225" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#f472b6">꧁ 𝒟𝑒𝓀𝑜𝓇𝒶𝓉𝒾𝓋 ꧂</text>
      <text x="225" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="600">✓ Sofortiges Copy &amp; Paste auf Social Media</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Basiert auf Mathematical Alphanumeric Symbols (U+1D400)</text>

      <!-- Feature List -->
      <g transform="translate(25, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften &amp; Vorteile:</text>
        
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#ec4899"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Funktioniert überall dort, wo Text eingegeben wird</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#ec4899"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Perfekt für Instagram-Bios, TikTok &amp; Discord</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#ec4899"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Keine Installation oder Lizenzverwaltung nötig</text>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: Echte Display-Font-Datei (.TTF / .OTF) -->
    <g transform="translate(540, 0)" filter="url(#splitDecoShadow)">
      <rect width="500" height="420" rx="24" fill="#121728" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      
      <!-- Top Badge -->
      <rect x="25" y="24" width="240" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">📁 ECHTE SCHRIFTDATEI (.OTF/.TTF)</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">Display-Font</text>

      <!-- Mockup Area -->
      <rect x="25" y="68" width="450" height="150" rx="16" fill="#080c16" stroke="#38bdf8" stroke-opacity="0.2"/>
      
      <text x="225" y="125" text-anchor="middle" font-family="Impact, Georgia, serif" font-size="34" font-weight="700" fill="#38bdf8">DEKORATIV</text>
      <text x="225" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="600">✓ Vektor-Glyphen für Banner, Plakate &amp; Druck</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Wird in Grafikprogrammen (Photoshop, InDesign) genutzt</text>

      <!-- Feature List -->
      <g transform="translate(25, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften &amp; Vorteile:</text>
        
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Hochauflösende Vektoren für Plakate und Print</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Einbettbar als Webfont (WOFF/WOFF2) in Websites</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Muss im Betriebssystem / Webserver installiert werden</text>
        </g>
      </g>
    </g>

  </g>
</svg>

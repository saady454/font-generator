<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="rbxSplitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#06070d"/>
    </linearGradient>
    <linearGradient id="rbxGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="rbxPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="rbxSplitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#rbxSplitBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#3b82f6" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#ec4899" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e1832" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">ROBLOX NAMENS-GUIDE</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Benutzername <tspan fill="url(#rbxPinkGrad)">vs.</tspan> Anzeigename
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Die wichtigsten Unterschiede, Regeln und Kosten auf einen Blick erklärt
    </text>
  </g>

  <!-- Split Comparison Cards -->
  <g transform="translate(80, 155)">
    
    <!-- Left Card: Benutzername -->
    <g transform="translate(0, 0)" filter="url(#rbxSplitShadow)">
      <rect width="500" height="440" rx="24" fill="#131024" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
      
      <g transform="translate(25, 25)">
        <rect width="180" height="28" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="90" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#60a5fa">1. BENUTZERNAME</text>
        
        <rect y="45" width="450" height="80" rx="14" fill="#080612" stroke="#3b82f6" stroke-opacity="0.2"/>
        <text x="225" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">@shadownova_pro</text>

        <!-- Feature List -->
        <g transform="translate(0, 150)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#60a5fa">Eigenschaften &amp; Vorgaben:</text>
          
          <g transform="translate(0, 20)">
            <text x="0" y="15" fill="#60a5fa" font-weight="900">&amp;bull;</text>
            <text x="18" y="15">Eindeutige Account-ID (kann weltweit nur 1x existieren)</text>
          </g>

          <g transform="translate(0, 50)">
            <text x="0" y="15" fill="#60a5fa" font-weight="900">&amp;bull;</text>
            <text x="18" y="15">Wird für Login &amp; Freundeseinladungen (@) genutzt</text>
          </g>

          <g transform="translate(0, 80)">
            <text x="0" y="15" fill="#f87171" font-weight="900">⚠️</text>
            <text x="18" y="15">Änderung kostet 1.000 Robux in den Einstellungen</text>
          </g>

          <g transform="translate(0, 110)">
            <text x="0" y="15" fill="#60a5fa" font-weight="900">&amp;bull;</text>
            <text x="18" y="15">Strikte Roblox-Filter (keine Sonderzeichen)</text>
          </g>
        </g>

        <!-- Recommendation Box -->
        <rect y="315" width="450" height="50" rx="10" fill="#080612" stroke="#3b82f6" stroke-opacity="0.3"/>
        <text x="225" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa">
          Funktion: Feste Identität &amp; Login-Sicherheit
        </text>
      </g>
    </g>

    <!-- Right Card: Anzeigename -->
    <g transform="translate(540, 0)" filter="url(#rbxSplitShadow)">
      <rect width="500" height="440" rx="24" fill="#131024" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
      
      <g transform="translate(25, 25)">
        <rect width="220" height="28" rx="8" fill="#ec4899" fill-opacity="0.2"/>
        <text x="110" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">2. ANZEIGENAME (DISPLAY)</text>
        
        <rect y="45" width="450" height="80" rx="14" fill="#080612" stroke="#ec4899" stroke-opacity="0.2"/>
        <text x="225" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff">ShadowNova</text>

        <!-- Feature List -->
        <g transform="translate(0, 150)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#f472b6">Eigenschaften &amp; Vorgaben:</text>
          
          <g transform="translate(0, 20)">
            <text x="0" y="15" fill="#34d399" font-weight="900">✓</text>
            <text x="18" y="15">Sichtbarer Name im Spiel, über dem Avatar &amp; im Chat</text>
          </g>

          <g transform="translate(0, 50)">
            <text x="0" y="15" fill="#34d399" font-weight="900">✓</text>
            <text x="18" y="15">Kostenlos alle 7 Tage in den Einstellungen änderbar</text>
          </g>

          <g transform="translate(0, 80)">
            <text x="0" y="15" fill="#34d399" font-weight="900">✓</text>
            <text x="18" y="15">Muss nicht weltweit einzigartig sein (Mehrfachnutzung)</text>
          </g>

          <g transform="translate(0, 110)">
            <text x="0" y="15" fill="#f472b6" font-weight="900">★</text>
            <text x="18" y="15">Perfekt für kreative, wechselnde Gamertags</text>
          </g>
        </g>

        <!-- Recommendation Box -->
        <rect y="315" width="450" height="50" rx="10" fill="#080612" stroke="#ec4899" stroke-opacity="0.3"/>
        <text x="225" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6">
          Funktion: Flexibler Sichtname für alle Erlebnisse
        </text>
      </g>
    </g>

  </g>
</svg>

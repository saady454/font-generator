<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="fbStileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0f162c"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#fbStileBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#1877F2" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="240" fill="#60a5fa" fill-opacity="0.08"/>

  <!-- Section Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#141f38" stroke="#1877F2" stroke-opacity="0.4"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#60a5fa" letter-spacing="1.5">SCHRIFTARTEN VERGLEICH</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff">
    Welche Schriftarten eignen sich für Facebook?
  </text>
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    Wirkung, Eignung und typografische Beispiele für deinen Facebook-Feed
  </text>

  <!-- 5 Comparison Rows Grid -->
  <g transform="translate(100, 180)">
    <!-- Column Headers -->
    <rect width="1000" height="36" rx="8" fill="#121b33"/>
    <text x="30" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#60a5fa" letter-spacing="1">STIL</text>
    <text x="280" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#60a5fa" letter-spacing="1">GEEIGNET FÜR</text>
    <text x="680" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#60a5fa" letter-spacing="1">BEISPIEL (UNICODE)</text>

    <!-- Row 1: Fett -->
    <g transform="translate(0, 48)">
      <rect width="1000" height="64" rx="12" fill="#0e162b" stroke="#1877F2" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="20" y="18" width="90" height="28" rx="8" fill="#1877F2" fill-opacity="0.2"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#60a5fa">Fett</text>
      <text x="280" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Überschriften und wichtige Wörter</text>
      <text x="680" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">𝗡𝗲𝘂𝗲𝘀 𝗔𝗻𝗴𝗲𝗯𝗼𝘁</text>
    </g>

    <!-- Row 2: Kursiv -->
    <g transform="translate(0, 122)">
      <rect width="1000" height="64" rx="12" fill="#0e162b" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="20" y="18" width="90" height="28" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Kursiv</text>
      <text x="280" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Zitate und kurze Betonungen</text>
      <text x="680" y="40" font-family="system-ui, sans-serif" font-size="22" font-style="italic" font-weight="700" fill="#ffffff">𝘐𝘋𝘦𝘪𝘯 𝘛𝘦𝘹𝘵</text>
    </g>

    <!-- Row 3: Schreibschrift -->
    <g transform="translate(0, 196)">
      <rect width="1000" height="64" rx="12" fill="#0e162b" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="20" y="18" width="115" height="28" rx="8" fill="#a855f7" fill-opacity="0.15"/>
      <text x="77" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#c084fc">Schreibschrift</text>
      <text x="280" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Persönliche Beiträge</text>
      <text x="680" y="40" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">𝓗𝓪𝓵𝓵𝓸 𝓕𝓻𝓮𝓾𝓷𝓭𝓮</text>
    </g>

    <!-- Row 4: Gotisch -->
    <g transform="translate(0, 270)">
      <rect width="1000" height="64" rx="12" fill="#0e162b" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="20" y="18" width="90" height="28" rx="8" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24">Gotisch</text>
      <text x="280" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Auffällige Namen und kurze Titel</text>
      <text x="680" y="40" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">𝔐𝔢𝔦𝔫 𝔓𝔯𝔬𝔧𝔢𝔨𝔱</text>
    </g>

    <!-- Row 5: Bubble -->
    <g transform="translate(0, 344)">
      <rect width="1000" height="64" rx="12" fill="#0e162b" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="20" y="18" width="90" height="28" rx="8" fill="#f472b6" fill-opacity="0.15"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">Bubble</text>
      <text x="280" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Lockere und kreative Texte</text>
      <text x="680" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Ⓗⓐⓛⓛⓞ</text>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="waveHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#0e1326"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="waveCyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="waveShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#waveHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#38bdf8" fill-opacity="0.10"/>
  <circle cx="920" cy="460" r="280" fill="#a855f7" fill-opacity="0.08"/>

  <!-- Decorative Sine Wave Curves in Background -->
  <path d="M50,120 Q300,70 600,120 T1150,120" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="3"/>
  <path d="M50,560 Q300,610 600,560 T1150,560" fill="none" stroke="#a855f7" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Header Badge -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" letter-spacing="2">〰️ WAVY TEXT &amp; TILDE STUDIO</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Wellige Schrift: <tspan fill="url(#waveCyanViolet)">Wellen-Schrift erstellen</tspan>
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Kombinierende Tilden (W͠e͠l͠l͠i͠g͠), sanfte Wellenlinien (〰️) &amp; Aesthetic-Texte zum Kopieren
  </text>

  <!-- Main Generator Canvas Card -->
  <g transform="translate(100, 215)" filter="url(#waveShadow)">
    <rect width="1000" height="400" rx="28" fill="#12162a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Paper Board -->
    <rect x="25" y="25" width="950" height="350" rx="20" fill="#080b16" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- Large Centerpiece: Wavy Specimens -->
    <g transform="translate(500, 140)" text-anchor="middle">
      <text y="0" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#waveCyanViolet)" letter-spacing="4">W͠e͠l͠l͠i͠g͠e͠ ͠S͠c͠h͠r͠i͠f͠t͠</text>
      <!-- Wavy Swash -->
      <path d="M-220,30 Q-110,10 0,30 T220,30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <text y="65" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" letter-spacing="6">〰️ 𝒲𝑒𝓁𝓁𝑒𝓃 〰️ &amp;bull; 🌊 𝓥𝓲𝓫𝓮𝓼 🌊 &amp;bull; ≋ 𝕎𝕒𝕧𝕖𝕤 ≋</text>
    </g>

    <!-- 4 Wavy Style Showcase Tiles Below -->
    <g transform="translate(60, 260)">
      
      <g transform="translate(0, 0)">
        <rect width="205" height="70" rx="14" fill="#151b32" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="1">DOUBLE TILDE (U+0360)</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">W͠e͠l͠l͠e͠n͠</text>
      </g>

      <g transform="translate(225, 0)">
        <rect width="205" height="70" rx="14" fill="#151b32" stroke="#a855f7" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="1">WAVY DASH (U+3030)</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">〰️ 𝒜𝑒𝓈𝓉𝒽𝑒𝓉𝒾𝒸 〰️</text>
      </g>

      <g transform="translate(450, 0)">
        <rect width="205" height="70" rx="14" fill="#151b32" stroke="#ec4899" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="1">TRIPLE TILDE (U+224B)</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">≋ 𝓞𝓬𝓮𝓪𝓷 ≋</text>
      </g>

      <g transform="translate(675, 0)">
        <rect width="205" height="70" rx="14" fill="#151b32" stroke="#34d399" stroke-opacity="0.3"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" letter-spacing="1">RETRO GROOVY</text>
        <text x="20" y="52" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="700" fill="#ffffff">~ 𝒢𝓇𝑜𝑜𝓋𝓎 ~</text>
      </g>
    </g>
  </g>
</svg>

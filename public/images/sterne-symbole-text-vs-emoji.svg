<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="starSplitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080914"/>
      <stop offset="50%" stop-color="#121630"/>
      <stop offset="100%" stop-color="#060710"/>
    </linearGradient>
    <linearGradient id="starSplitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="starSplitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#starSplitBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#fbbf24" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e1f38" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">TECHNISCHER UNTERSCHIED</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Unicode Textstern <tspan fill="url(#starSplitGrad)">vs.</tspan> Stern-Emoji
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie sich reine Schriftzeichen von grafischen Emojis auf verschiedenen Geräten unterscheiden
    </text>
  </g>

  <!-- Split Comparison Cards -->
  <g transform="translate(80, 155)">
    
    <!-- Left Card: Unicode Textstern -->
    <g transform="translate(0, 0)" filter="url(#starSplitShadow)">
      <rect width="500" height="440" rx="24" fill="#13172e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      
      <g transform="translate(25, 25)">
        <rect width="190" height="28" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
        <text x="95" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">1. UNICODE TEXTSTERN</text>
        
        <rect y="45" width="450" height="80" rx="14" fill="#080a15" stroke="#38bdf8" stroke-opacity="0.2"/>
        <text x="225" y="96" text-anchor="middle" font-size="36" fill="#ffffff">★ ☆ ✦ ✧ ✩</text>

        <!-- Feature List -->
        <g transform="translate(0, 150)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#38bdf8">Eigenschaften &amp; Darstellung:</text>
          
          <g transform="translate(0, 20)">
            <text x="0" y="15" fill="#38bdf8" font-weight="900">✓</text>
            <text x="22" y="15">Reines typografisches Schriftzeichen (Unicode Block 2600)</text>
          </g>

          <g transform="translate(0, 50)">
            <text x="0" y="15" fill="#38bdf8" font-weight="900">✓</text>
            <text x="22" y="15">Nimmt automatisch die gewählte Textfarbe (CSS) an</text>
          </g>

          <g transform="translate(0, 80)">
            <text x="0" y="15" fill="#38bdf8" font-weight="900">✓</text>
            <text x="22" y="15">Skaliert perfekt mit Schriftgröße ohne Qualitätsverlust</text>
          </g>

          <g transform="translate(0, 110)">
            <text x="0" y="15" fill="#38bdf8" font-weight="900">✓</text>
            <text x="22" y="15">Ideal für Dokumente, Bewertungen &amp; saubere Profile</text>
          </g>
        </g>

        <!-- Recommendation Box -->
        <rect y="315" width="450" height="50" rx="10" fill="#080a15" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="225" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
          Empfehlung: Für Namen, Bewertung (★★★★★) &amp; Fließtext
        </text>
      </g>
    </g>

    <!-- Right Card: Stern-Emoji -->
    <g transform="translate(540, 0)" filter="url(#starSplitShadow)">
      <rect width="500" height="440" rx="24" fill="#13172e" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      
      <g transform="translate(25, 25)">
        <rect width="170" height="28" rx="8" fill="#fbbf24" fill-opacity="0.2"/>
        <text x="85" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">2. STERN-EMOJI</text>
        
        <rect y="45" width="450" height="80" rx="14" fill="#080a15" stroke="#fbbf24" stroke-opacity="0.2"/>
        <text x="225" y="96" text-anchor="middle" font-size="34">⭐ 🌟 ✨ 💫 🌠</text>

        <!-- Feature List -->
        <g transform="translate(0, 150)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
          <text x="0" y="0" font-weight="700" fill="#fbbf24">Eigenschaften &amp; Darstellung:</text>
          
          <g transform="translate(0, 20)">
            <text x="0" y="15" fill="#fbbf24" font-weight="900">★</text>
            <text x="22" y="15">Grafisches Symbol aus dem Emoji-Zeichensatz (2B50 / 1F31F)</text>
          </g>

          <g transform="translate(0, 50)">
            <text x="0" y="15" fill="#fbbf24" font-weight="900">★</text>
            <text x="22" y="15">Aussehen variiert je nach System (Apple, Google, Windows)</text>
          </g>

          <g transform="translate(0, 80)">
            <text x="0" y="15" fill="#fbbf24" font-weight="900">★</text>
            <text x="22" y="15">Farbig &amp; leuchtend (gelb, gold oder funkelnd)</text>
          </g>

          <g transform="translate(0, 110)">
            <text x="0" y="15" fill="#fbbf24" font-weight="900">★</text>
            <text x="22" y="15">Perfekt für WhatsApp-Nachrichten, Instagram &amp; TikTok</text>
          </g>
        </g>

        <!-- Recommendation Box -->
        <rect y="315" width="450" height="50" rx="10" fill="#080a15" stroke="#fbbf24" stroke-opacity="0.3"/>
        <text x="225" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">
          Empfehlung: Für bunte Social-Media-Posts &amp; Chats
        </text>
      </g>
    </g>

  </g>
</svg>

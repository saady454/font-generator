<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="mcCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e0a"/>
      <stop offset="50%" stop-color="#0f2218"/>
      <stop offset="100%" stop-color="#040906"/>
    </linearGradient>
    <linearGradient id="mcStyleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="mcTileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#mcCompBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#10b981" fill-opacity="0.10"/>
  <circle cx="1000" cy="460" r="240" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#132a1e" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34d399" letter-spacing="2">MINECRAFT STIL-GUIDE</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      5 beliebte <tspan fill="url(#mcStyleGrad)">Schriftstile für deinen Minecraft Nickname</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Fette, kursive, gotische und dekorative Varianten für dein Profil &amp; Multiplayer-Server
    </text>
  </g>

  <!-- 5 Cards (2 top, 3 bottom) -->
  <g transform="translate(60, 145)">
    
    <!-- Row 1, Col 1: Fett -->
    <g transform="translate(0, 0)" filter="url(#mcTileShadow)">
      <rect width="525" height="150" rx="18" fill="#0f2218" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="80" height="24" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="60" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">1. FETT</text>
      
      <rect x="120" y="18" width="385" height="50" rx="10" fill="#060e09"/>
      <text x="312" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">𝐏𝐢𝐱𝐞𝐥𝐊𝐢𝐧𝐠</text>

      <g transform="translate(20, 90)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Klar, durchsetzungsstark &amp; direkt lesbar</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Einsatz: <tspan fill="#94a3b8" font-weight="400">PvP, Bedwars, Tab-Listen</tspan></text>
      </g>
    </g>

    <!-- Row 1, Col 2: Kursiv -->
    <g transform="translate(555, 0)" filter="url(#mcTileShadow)">
      <rect width="525" height="150" rx="18" fill="#0f2218" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="90" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="65" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">2. KURSIV</text>
      
      <rect x="130" y="18" width="375" height="50" rx="10" fill="#060e09"/>
      <text x="317" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="700" fill="#ffffff">𝑳𝒖𝒏𝒂𝒓</text>

      <g transform="translate(20, 90)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Elegant, dynamisch &amp; leicht</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Einsatz: <tspan fill="#94a3b8" font-weight="400">Aesthetic SMPs, Creator-Profile</tspan></text>
      </g>
    </g>

    <!-- Row 2, Col 1: Gotisch -->
    <g transform="translate(0, 175)" filter="url(#mcTileShadow)">
      <rect width="340" height="290" rx="18" fill="#0f2218" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="95" height="24" rx="6" fill="#a78bfa" fill-opacity="0.15"/>
      <text x="67" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a78bfa">3. GOTISCH</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#060e09"/>
      <text x="170" y="93" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff">𝕯𝖆𝖗𝖐𝖂𝖔𝖑𝖋</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Dunkel &amp; mystisch</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">Einsatz: <tspan fill="#94a3b8" font-weight="400">Survival, RPG, Clan-Tags</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Perfekt für epische Spielernamen.</text>
      </g>
    </g>

    <!-- Row 2, Col 2: Dekorativ -->
    <g transform="translate(370, 175)" filter="url(#mcTileShadow)">
      <rect width="340" height="290" rx="18" fill="#0f2218" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="115" height="24" rx="6" fill="#f472b6" fill-opacity="0.15"/>
      <text x="77" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6">4. DEKORATIV</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#060e09"/>
      <text x="170" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">꧁CraftWolf꧂</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Auffällig mit Rahmen</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6">Einsatz: <tspan fill="#94a3b8" font-weight="400">Foren, Discord, Server-Chat</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Rahmen-Symbole setzen Akzente.</text>
      </g>
    </g>

    <!-- Row 2, Col 3: Symbole -->
    <g transform="translate(740, 175)" filter="url(#mcTileShadow)">
      <rect width="340" height="290" rx="18" fill="#0f2218" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="105" height="24" rx="6" fill="#34d399" fill-opacity="0.15"/>
      <text x="72" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">5. SYMBOLE</text>
      
      <rect x="20" y="58" width="300" height="55" rx="10" fill="#060e09"/>
      <text x="170" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">⚔️ CraftWolf ⚔️</text>

      <g transform="translate(20, 140)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wirkung: <tspan fill="#94a3b8" font-weight="400">Gaming-Look &amp; Action</tspan></text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Einsatz: <tspan fill="#94a3b8" font-weight="400">Gilden, Factions, Team-Tags</tspan></text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Schwerter, Sterne &amp; Pfeile.</text>
      </g>
    </g>

  </g>
</svg>

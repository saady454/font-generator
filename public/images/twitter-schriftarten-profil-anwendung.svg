<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="twAppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <filter id="twAppShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#twAppBg)"/>

  <!-- Ambient Lights -->
  <circle cx="300" cy="200" r="260" fill="#1d9bf0" fill-opacity="0.08"/>
  <circle cx="900" cy="450" r="280" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Badge &amp; Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#101726" stroke="#1d9bf0" stroke-opacity="0.35"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1d9bf0" letter-spacing="1.5">PROFIL- &amp; POST-BEREICHE</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff">
    Wo lassen sich die Schriftstile auf X verwenden?
  </text>
  <text x="600" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Anzeigename (max. 50 Zeichen), Bio (max. 160 Zeichen) und Post-Hooks im Detail
  </text>

  <!-- 3 Big Cards for Display Name, Bio, and Posts -->
  <g transform="translate(80, 185)">
    
    <!-- Card 1: Anzeigename (Display Name) -->
    <g transform="translate(0, 0)" filter="url(#twAppShadow)">
      <rect width="320" height="420" rx="20" fill="#0e1320" stroke="#1d9bf0" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="6" fill="#1d9bf0" fill-opacity="0.2"/>
      <text x="85" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d9bf0">1. ANZEIGENAME</text>
      
      <g transform="translate(20, 65)">
        <circle cx="28" cy="28" r="22" fill="#182336" stroke="#ffffff" stroke-opacity="0.2"/>
        <text x="28" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">𝕏</text>
        <text x="60" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">𝗝𝗼𝗻𝗮𝘀 𝗕𝗲𝗿𝗴 &amp;bull; 𝕏</text>
        <text x="60" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#71767b">@jonas_handle</text>
      </g>

      <rect x="20" y="135" width="280" height="185" rx="12" fill="#05070d" stroke="#ffffff" stroke-opacity="0.04"/>
      <text x="36" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d9bf0">LIMIT &amp; REGELN:</text>
      <text x="36" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; Bis zu <tspan font-weight="700" fill="#1d9bf0">50 Zeichen</tspan> erlaubt</text>
      <text x="36" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; Volle Unicode-Unterstützung</text>
      <text x="36" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; Handle bleibt @jonas_handle</text>
      <text x="36" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80">✓ Hebt deinen Account sofort ab</text>

      <g transform="translate(20, 345)">
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#1d9bf0" font-weight="700">🎯 Ideal: Fett Sans oder Kursiv</text>
        <text x="10" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#71767b">Klar lesbar auch auf Mobile.</text>
      </g>
    </g>

    <!-- Card 2: Profil-Bio (160 Zeichen Limit) -->
    <g transform="translate(360, 0)" filter="url(#twAppShadow)">
      <rect width="320" height="420" rx="20" fill="#0e1320" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="85" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#cbd5e1">2. PROFIL-BIO</text>
      
      <g transform="translate(20, 65)">
        <rect width="280" height="50" rx="10" fill="#141c2c"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d9bf0">⚡ 𝗖𝗿𝗲𝗮𝘁𝗼𝗿 | 𝙂𝙖𝙢𝙞𝙣𝙜 | Code</text>
        <text x="14" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Täglich neue 𝘝𝘪𝘣𝘦𝘴 &amp; Insights ✨</text>
      </g>

      <rect x="20" y="135" width="280" height="185" rx="12" fill="#05070d" stroke="#ffffff" stroke-opacity="0.04"/>
      <text x="36" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">LIMIT &amp; REGELN:</text>
      <text x="36" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; Maximal <tspan font-weight="700" fill="#38bdf8">160 Zeichen</tspan></text>
      <text x="36" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; Sparsam mit Deko umgehen</text>
      <text x="36" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; Schlagwörter hervorheben</text>
      <text x="36" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80">✓ Mehr Profilklicks &amp; Follower</text>

      <g transform="translate(20, 345)">
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">🎯 Ideal: Kapitälchen &amp; Zitate</text>
        <text x="10" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#71767b">Stilvoll ohne Platzverschwendung.</text>
      </g>
    </g>

    <!-- Card 3: Post-Hooks (Tweets) -->
    <g transform="translate(720, 0)" filter="url(#twAppShadow)">
      <rect width="320" height="420" rx="20" fill="#0e1320" stroke="#1d9bf0" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="6" fill="#1d9bf0" fill-opacity="0.2"/>
      <text x="85" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d9bf0">3. POST-HOOKS</text>
      
      <g transform="translate(20, 65)">
        <rect width="280" height="50" rx="10" fill="#141c2c" stroke="#1d9bf0" stroke-opacity="0.3"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#1d9bf0">🔥 𝗕𝗥𝗘𝗔𝗞𝗜𝗡𝗚 𝗡𝗘𝗪𝗦</text>
        <text x="14" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#e7e9ea">Normaler Text folgt für Lesbarkeit...</text>
      </g>

      <rect x="20" y="135" width="280" height="185" rx="12" fill="#05070d" stroke="#ffffff" stroke-opacity="0.04"/>
      <text x="36" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d9bf0">LIMIT &amp; REGELN:</text>
      <text x="36" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; 1. Zeile als Stopper stylen</text>
      <text x="36" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; Rest in Standardschrift</text>
      <text x="36" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ea">&amp;bull; Keine Sonderzeichen in #Hashtags</text>
      <text x="36" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80">✓ Bis zu 3x mehr Interaktion</text>

      <g transform="translate(20, 345)">
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#1d9bf0" font-weight="700">🎯 Ideal: Fette Sans &amp; Gothic</text>
        <text x="10" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#71767b">Fängt Blicke beim Scrollen ab.</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="variantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18"/>
      <stop offset="50%" stop-color="#141828"/>
      <stop offset="100%" stop-color="#0a0c16"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#variantBg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="220" fill="#a855f7" fill-opacity="0.1"/>
  <circle cx="1000" cy="500" r="260" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#c084fc" letter-spacing="2">TYPOGRAFIE-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Die 4 wichtigsten <tspan fill="url(#purpleGrad)">Bubble-Schrift Stile</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Optischer Vergleich und empfohlene Einsatzbereiche für Social Media &amp; Gaming
    </text>
  </g>

  <!-- 4 Comparative Cards Grid (2x2) -->
  <g transform="translate(80, 160)">
    <!-- Card 1: Weiße Kreise (Light Circled) -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="500" height="215" rx="20" fill="#141828" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="25" y="22" width="130" height="26" rx="13" fill="#a855f7" fill-opacity="0.15"/>
      <text x="90" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc" letter-spacing="1">1. WEIßE KREISE</text>
      <text x="475" y="40" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">U+24D0 - U+24E9</text>
      
      <!-- Specimen Output -->
      <rect x="25" y="60" width="450" height="75" rx="14" fill="#0c0e18" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="250" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="4">ⓑⓤⓑⓑⓛⓔ</text>

      <text x="25" y="162" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Wirkung: <tspan font-weight="400" fill="#94a3b8">Leicht, freundlich, verspielt und minimalistisch</tspan></text>
      <text x="25" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c084fc">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Instagram-Bios, kurze Namen &amp; Überschriften</tspan></text>
    </g>

    <!-- Card 2: Große Kreise (Large Circled) -->
    <g transform="translate(540, 0)" filter="url(#boxShadow)">
      <rect width="500" height="215" rx="20" fill="#141828" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="25" y="22" width="130" height="26" rx="13" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="90" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1">2. GROßE KREISE</text>
      <text x="475" y="40" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">U+24B6 - U+24CF</text>
      
      <!-- Specimen Output -->
      <rect x="25" y="60" width="450" height="75" rx="14" fill="#0c0e18" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="250" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="4">ⒷⓊⒷⒷⓁⒺ</text>

      <text x="25" y="162" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Wirkung: <tspan font-weight="400" fill="#94a3b8">Präsent, klar strukturiert und gut lesbar</tspan></text>
      <text x="25" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Initialen, Bullet Points &amp; Hervorhebungen</tspan></text>
    </g>

    <!-- Card 3: Schwarze Kreise (Negative Circled) -->
    <g transform="translate(0, 240)" filter="url(#boxShadow)">
      <rect width="500" height="215" rx="20" fill="#141828" stroke="#ec4899" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="25" y="22" width="150" height="26" rx="13" fill="#ec4899" fill-opacity="0.15"/>
      <text x="100" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6" letter-spacing="1">3. SCHWARZE KREISE</text>
      <text x="475" y="40" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">U+1F150 - U+1F169</text>
      
      <!-- Specimen Output -->
      <rect x="25" y="60" width="450" height="75" rx="14" fill="#0c0e18" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="250" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="4">🅑🅤🅑🅑🅛🅔</text>

      <text x="25" y="162" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Wirkung: <tspan font-weight="400" fill="#94a3b8">Sehr hoher Kontrast, markant und dominant</tspan></text>
      <text x="25" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Starke Akzente, TikTok-Captions &amp; kurze Posts</tspan></text>
    </g>

    <!-- Card 4: Box-Zeichen (Squared Box) -->
    <g transform="translate(540, 240)" filter="url(#boxShadow)">
      <rect width="500" height="215" rx="20" fill="#141828" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="25" y="22" width="130" height="26" rx="13" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="90" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24" letter-spacing="1">4. BOX-ZEICHEN</text>
      <text x="475" y="40" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">U+1F170 - U+1F189</text>
      
      <!-- Specimen Output -->
      <rect x="25" y="60" width="450" height="75" rx="14" fill="#0c0e18" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="250" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="4">🅱🆄🅱🅱🅻🅴</text>

      <text x="25" y="162" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Wirkung: <tspan font-weight="400" fill="#94a3b8">Kantig, retro, auffallend und technisch</tspan></text>
      <text x="25" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Einsatz: <tspan font-weight="400" fill="#cbd5e1">Retro-, Gaming-Tags &amp; Discord Profilstile</tspan></text>
    </g>
  </g>
</svg>

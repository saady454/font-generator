<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="transKBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="kboxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2338"/>
      <stop offset="100%" stop-color="#121524"/>
    </linearGradient>
    <filter id="kboxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#transKBg)"/>

  <!-- Title -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="sans-serif" font-size="13" font-weight="800" fill="#f472b6" letter-spacing="1.5">UNICODE-KURSIVTRANSFORMATION</text>
    
    <text y="55" font-family="sans-serif" font-size="32" font-weight="900" fill="#ffffff">
      Wie entsteht <tspan fill="#f472b6">kopierbarer Kursivtext</tspan>?
    </text>
    <text y="85" font-family="sans-serif" font-size="14" fill="#94a3b8">
      Ersetzung von Standard-ASCII durch mathematische Unicode-Kursivcodepoints (U+1D434)
    </text>
  </g>

  <!-- Transformation Flow -->
  <g transform="translate(100, 180)">
    
    <!-- Step 1: Normal ASCII Input -->
    <g transform="translate(0, 0)" filter="url(#kboxShadow)">
      <rect width="280" height="380" rx="20" fill="url(#kboxGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="20" y="20" width="100" height="26" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="70" y="37" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">1. EINGABE</text>

      <text x="140" y="110" font-family="sans-serif" font-size="60" font-weight="600" fill="#ffffff" text-anchor="middle">A a</text>
      <text x="140" y="150" font-family="monospace" font-size="15" fill="#94a3b8" text-anchor="middle">U+0041 / U+0061</text>
      <text x="140" y="175" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Standard Latin Letters</text>

      <line x1="25" y1="205" x2="255" y2="205" stroke="#ffffff" stroke-opacity="0.08"/>

      <g transform="translate(25, 230)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#ffffff">Ausgangszustand:</text>
        <text y="24">• Normal aufrecht stehend</text>
        <text y="48">• Hat keine eigene Neigung</text>
        <text y="72" fill="#f87171">• Verliert CSS-Kursiv im Chat</text>
      </g>
    </g>

    <!-- Arrow Bridge 1 -->
    <g transform="translate(300, 160)">
      <circle cx="25" cy="30" r="28" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1.5"/>
      <text x="25" y="36" font-family="sans-serif" font-size="20" fill="#f472b6" text-anchor="middle">→</text>
      <text x="25" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle">Mapping</text>
    </g>

    <!-- Step 2: Offset Calculation (The Engine) -->
    <g transform="translate(370, 0)" filter="url(#kboxShadow)">
      <rect width="280" height="380" rx="20" fill="url(#kboxGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="140" height="26" rx="8" fill="#ec4899" fill-opacity="0.2"/>
      <text x="90" y="37" font-family="sans-serif" font-size="11" font-weight="800" fill="#f472b6" text-anchor="middle">2. UMRECHNUNG</text>

      <text x="140" y="105" font-family="sans-serif" font-size="28" font-weight="800" fill="#f472b6" text-anchor="middle">⚙️</text>
      <text x="140" y="145" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Block: U+1D434</text>
      <text x="140" y="172" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Mathematical Italic</text>

      <line x1="25" y1="205" x2="255" y2="205" stroke="#ec4899" stroke-opacity="0.2"/>

      <g transform="translate(25, 230)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#f472b6">Unicode-Tabelle:</text>
        <text y="24">• Feste geneigte Glyphen</text>
        <text y="48">• Offizielle ISO/IEC-Norm</text>
        <text y="72">• Keine Schriftdatei nötig</text>
      </g>
    </g>

    <!-- Arrow Bridge 2 -->
    <g transform="translate(670, 160)">
      <circle cx="25" cy="30" r="28" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="25" y="36" font-family="sans-serif" font-size="20" fill="#38bdf8" text-anchor="middle">→</text>
      <text x="25" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Kopierbar</text>
    </g>

    <!-- Step 3: Italic Output -->
    <g transform="translate(740, 0)" filter="url(#kboxShadow)">
      <rect width="260" height="380" rx="20" fill="url(#kboxGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="20" y="20" width="110" height="26" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="75" y="37" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">3. KURSIV 📋</text>

      <text x="130" y="110" font-family="'Times New Roman', serif" font-size="64" font-style="italic" font-weight="700" fill="#38bdf8" text-anchor="middle">𝐴 𝑎</text>
      <text x="130" y="150" font-family="monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Codepoint: U+1D434</text>
      <text x="130" y="175" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">MATHEMATICAL ITALIC A</text>

      <line x1="25" y1="205" x2="235" y2="205" stroke="#38bdf8" stroke-opacity="0.2"/>

      <g transform="translate(25, 230)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0" font-weight="700" fill="#38bdf8">Echtes Zeichen:</text>
        <text y="24"><tspan fill="#38bdf8">✓</tspan> Bleibt dauerhaft kursiv</text>
        <text y="48"><tspan fill="#38bdf8">✓</tspan> 1-Klick in Zwischenablage</text>
        <text y="72"><tspan fill="#38bdf8">✓</tspan> Funktioniert in allen Apps</text>
      </g>
    </g>

  </g>
</svg>

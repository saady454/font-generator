<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ffHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0705"/>
      <stop offset="50%" stop-color="#1f1107"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
    <linearGradient id="ffFireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="50%" stop-color="#ff3b00"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="ffOrangeCyan" x1="0%" y1="0%" x2="100%" y2="0%">

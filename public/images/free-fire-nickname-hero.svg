  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-210" y="-18" width="420" height="36" rx="18" fill="#261306" stroke="#ff7a00" stroke-opacity="0.5" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ff9933" letter-spacing="2">🔥 FREE FIRE NICKNAME STUDIO</text>

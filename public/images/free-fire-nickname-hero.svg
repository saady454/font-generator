        <text x="24" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">🔥</text>
        <text x="58" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">★ 𝕽 𝖆 𝖛 𝖊 𝖓 ★</text>

        <text x="20" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ffffff">4.12</tspan><tspan dy="12" x="20">K/D Rate</tspan></text>
        <text x="115" y="12" text-anchor="middle"><tspan font-weight="800" fill="#fbbf24">68.5%</tspan><tspan dy="12" x="115">HS-Rate</tspan></text>
        <text x="205" y="12" text-anchor="middle"><tspan font-weight="800" fill="#ff7a00">1.8k</tspan><tspan dy="12" x="205">Booyah 👑</tspan></text>

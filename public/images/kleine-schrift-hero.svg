<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="smallHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121626"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="purpleGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2034" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111422" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softHeroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#smallHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="180" r="260" fill="#818cf8" fill-opacity="0.12"/>
  <circle cx="920" cy="480" r="280" fill="#c084fc" fill-opacity="0.10"/>

  <!-- Subtle Minimal Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="3 6">
    <line x1="100" y1="100" x2="1100" y2="100"/>
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="580" x2="1100" y2="580"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#a5b4fc" letter-spacing="2">💎 SMALL CAPS &amp; MINI TEXT</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Kleine Schrift: <tspan fill="url(#purpleGlowGrad)">Kleine Buchstaben zum Kopieren</tspan>
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Small Caps (Kapitälchen), hochgestellte &amp; tiefgestellte Unicode-Buchstaben im Überblick
  </text>

  <!-- Main Multi-Device Showcase Card -->
  <g transform="translate(100, 215)" filter="url(#softHeroShadow)">
    <rect width="1000" height="400" rx="28" fill="url(#cardGrad2)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Top Window Bar -->
    <rect width="1000" height="52" rx="28" fill="#151929"/>
    <rect y="28" width="1000" height="24" fill="#151929"/>
    <circle cx="35" cy="26" r="6" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="55" cy="26" r="6" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="75" cy="26" r="6" fill="#22c55e" fill-opacity="0.8"/>
    <rect x="340" y="13" width="320" height="26" rx="13" fill="#0c0e18" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="500" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" font-weight="500">schriftarten.io/schrift/kleine-schrift</text>

    <!-- 4 Comparison Rows -->
    <g transform="translate(60, 80)">
      
      <!-- Row 1: Normal -->
      <g transform="translate(0, 0)">
        <rect width="880" height="60" rx="14" fill="#0d101c" stroke="#ffffff" stroke-opacity="0.06"/>
        <rect x="20" y="17" width="110" height="26" rx="8" fill="#ffffff" fill-opacity="0.08"/>
        <text x="75" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">NORMAL</text>
        <text x="160" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Kleine Schrift zum Kopieren</text>
        <text x="860" y="36" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Standard Standardtext</text>
      </g>

      <!-- Row 2: Small Caps (Featured) -->
      <g transform="translate(0, 75)">
        <rect width="880" height="68" rx="14" fill="#171b2e" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
        <rect x="20" y="19" width="130" height="30" rx="8" fill="#818cf8" fill-opacity="0.2"/>
        <text x="85" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a5b4fc">SMALL CAPS</text>
        <text x="175" y="43" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1.5">ᴋʟᴇɪɴᴇ ꜱᴄʜʀɪꜰᴛ ᴢᴜᴍ ᴋᴏᴘɪᴇʀᴇɴ</text>
        <text x="860" y="41" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8">Empfohlen für Bios &amp; Profile</text>
      </g>

      <!-- Row 3: Hochgestellt (Superscript) -->
      <g transform="translate(0, 158)">
        <rect width="880" height="60" rx="14" fill="#0d101c" stroke="#ffffff" stroke-opacity="0.06"/>
        <rect x="20" y="17" width="130" height="26" rx="8" fill="#c084fc" fill-opacity="0.15"/>
        <text x="85" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">HOCHGESTELLT</text>
        <text x="175" y="38" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#e2e8f0">ᴷˡᵉⁱⁿᵉ ˢᶜʰʳⁱᶠᵗ ᶻᵘᵐ ᴷᵒᵖⁱᵉʳᵉⁿ</text>
        <text x="860" y="36" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Superscript Akzente</text>
      </g>

      <!-- Row 4: Tiefgestellt (Subscript) -->
      <g transform="translate(0, 233)">
        <rect width="880" height="60" rx="14" fill="#0d101c" stroke="#ffffff" stroke-opacity="0.06"/>
        <rect x="20" y="17" width="130" height="26" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="85" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">TIEFGESTELLT</text>
        <text x="175" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">ₖₗₑᵢₙₑ ₛcₕᵣᵢfₜ ᵤₘ ₖₒₚᵢₑᵣₑₙ</text>
        <text x="860" y="36" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Subscript Zierzeilen</text>
      </g>
    </g>
  </g>
</svg>

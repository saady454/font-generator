<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ttStepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0d111c"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="ttCyanStep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#25f4ee"/>
    </linearGradient>
    <linearGradient id="ttPinkStep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#ff0050"/>
    </linearGradient>
    <filter id="ttStepShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#ttStepBg)"/>

  <!-- Ambient Glows -->
  <circle cx="250" cy="220" r="240" fill="#25f4ee" fill-opacity="0.08"/>
  <circle cx="950" cy="450" r="260" fill="#fe2c55" fill-opacity="0.08"/>

  <!-- Badge &amp; Header -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#141926" stroke="#25f4ee" stroke-opacity="0.35"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#25f4ee" letter-spacing="1.5">SCHRITT-FÜR-SCHRITT ANLEITUNG</text>
  </g>

  <text x="600" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff">
    So erstellst du stylische TikTok-Schriftarten
  </text>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    In 4 einfachen Schritten vom Standardtext zur fertigen Unicode-Bio
  </text>

  <!-- 4 Step Cards Grid -->
  <g transform="translate(70, 200)">
    
    <!-- Step 1: Text eingeben -->
    <g transform="translate(0, 0)" filter="url(#ttStepShadow)">
      <rect width="245" height="400" rx="20" fill="#0f1422" stroke="#25f4ee" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="url(#ttCyanStep)"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#05070d">1</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Text eingeben</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" width="200">
        Tippe deinen Profilnamen, Bio oder Caption in das Generatorfeld ein.
      </text>

      <!-- Mock Visual 1 -->
      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#080a10" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">INPUT FIELD</text>
        <rect x="15" y="42" width="175" height="40" rx="8" fill="#141a2a" stroke="#25f4ee" stroke-opacity="0.4"/>
        <text x="26" y="67" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Gaming Queen</text>
        <line x1="128" y1="52" x2="128" y2="72" stroke="#25f4ee" stroke-width="2"/>
        
        <rect x="15" y="100" width="175" height="85" rx="8" fill="#141a2a" stroke="#ffffff" stroke-opacity="0.04"/>
        <text x="26" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Zeichenzähler: 12 / 80</text>
        <rect x="26" y="135" width="153" height="6" rx="3" fill="#1e273e"/>
        <rect x="26" y="135" width="23" height="6" rx="3" fill="#25f4ee"/>
        <text x="26" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#25f4ee">✓ 80-Limit optimal</text>
      </g>
    </g>

    <!-- Step 2: Stil auswählen -->
    <g transform="translate(270, 0)" filter="url(#ttStepShadow)">
      <rect width="245" height="400" rx="20" fill="#0f1422" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="#1e273e" stroke="#25f4ee" stroke-width="2"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#25f4ee">2</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Stil wählen</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Vergleiche fette, kursive, gotische &amp; Schreibschrift-Vorschauen in Echtzeit.
      </text>

      <!-- Mock Visual 2 -->
      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#080a10" stroke="#ffffff" stroke-opacity="0.06"/>
        
        <rect x="15" y="15" width="175" height="42" rx="8" fill="#141a2a" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="25" y="41" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">𝗚𝗮𝗺𝗶𝗻𝗴 𝗤𝘂𝗲𝗲𝗻</text>
        
        <rect x="15" y="66" width="175" height="42" rx="8" fill="#1c2438" stroke="#25f4ee" stroke-width="1.5"/>
        <text x="25" y="92" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#25f4ee">𝒢𝒶𝓂𝒾𝓃𝑔 𝒬𝓊𝑒𝑒𝓃</text>
        <circle cx="175" cy="87" r="6" fill="#25f4ee"/>

        <rect x="15" y="117" width="175" height="42" rx="8" fill="#141a2a" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="25" y="143" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#ffffff">𝔊𝔞𝔪𝔦𝔫𝔤 𝔔𝔲𝔢𝔢𝔫</text>

        <rect x="15" y="168" width="175" height="30" rx="6" fill="#141a2a"/>
        <text x="102" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">+ 500 weitere Stile...</text>
      </g>
    </g>

    <!-- Step 3: Kopieren -->
    <g transform="translate(540, 0)" filter="url(#ttStepShadow)">
      <rect width="245" height="400" rx="20" fill="#0f1422" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="#1e273e" stroke="#fe2c55" stroke-width="2"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fe2c55">3</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">1-Klick Kopieren</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Klicke auf den Button und übertrage den Unicode-Text in deine Zwischenablage.
      </text>

      <!-- Mock Visual 3 -->
      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#080a10" stroke="#ffffff" stroke-opacity="0.06"/>
        
        <rect x="25" y="30" width="155" height="80" rx="10" fill="#141a2a" stroke="#fe2c55" stroke-opacity="0.3"/>
        <text x="102" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff">𝒢𝒶𝓂𝒾𝓃𝑔 𝒬𝓊𝑒𝑒𝓃</text>
        <text x="102" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Unicode UTF-8</text>

        <rect x="25" y="130" width="155" height="46" rx="10" fill="url(#ttPinkStep)"/>
        <text x="102" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">📋 Kopiert!</text>
      </g>
    </g>

    <!-- Step 4: Bei TikTok einfügen -->
    <g transform="translate(810, 0)" filter="url(#ttStepShadow)">
      <rect width="245" height="400" rx="20" fill="#0f1422" stroke="#fe2c55" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="22" fill="url(#ttPinkStep)"/>
      <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">4</text>
      
      <text x="80" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">In TikTok einfügen</text>
      <text x="24" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        Öffne Profil bearbeiten, füge den Text in Name/Bio ein und speichere ab.
      </text>

      <!-- Mock Visual 4 -->
      <g transform="translate(20, 150)">
        <rect width="205" height="210" rx="12" fill="#080a10" stroke="#fe2c55" stroke-opacity="0.2"/>
        
        <circle cx="102" cy="45" r="24" fill="#141a2a" stroke="#fe2c55" stroke-width="2"/>
        <text x="102" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">👑</text>

        <rect x="20" y="85" width="165" height="34" rx="6" fill="#141a2a" stroke="#25f4ee" stroke-opacity="0.4"/>
        <text x="102" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#ffffff">𝒢𝒶𝓂𝒾𝓃𝑔 𝒬𝓊𝑒𝑒𝓃</text>

        <rect x="20" y="130" width="165" height="60" rx="6" fill="#141a2a" stroke="#ffffff" stroke-opacity="0.06"/>
        <text x="30" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#25f4ee">Bio aktiv:</text>
        <text x="30" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">𝗧ä𝗴𝗹𝗶𝗰𝗵 𝗟𝗶𝘃𝗲 🎮</text>
        <text x="30" y="180" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">TikTok Bio gespeichert ✓</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="allHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#14142b"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="allHeroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="allHeroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#allHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#fbbf24" fill-opacity="0.08"/>
  <circle cx="920" cy="460" r="260" fill="#818cf8" fill-opacity="0.08"/>

  <!-- Top Badge -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-210" y="-16" width="420" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">★ 14 KOSTENLOSE SCHRIFTGENERATOREN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Alle Schriftstile auf einen Blick: <tspan fill="url(#allHeroGrad)">Direkt zum Kopieren</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Fette, kursive, gotische, Bubble-, Tattoo- und Handschrift-Stile für Social Media &amp; Games
    </text>
  </g>

  <!-- Central Mockup Window -->
  <g transform="translate(100, 145)" filter="url(#allHeroShadow)">
    <rect width="1000" height="460" rx="22" fill="#111827" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Top Browser Header Bar -->
    <g transform="translate(25, 20)">
      <circle cx="15" cy="15" r="6" fill="#ef4444"/>
      <circle cx="35" cy="15" r="6" fill="#f59e0b"/>
      <circle cx="55" cy="15" r="6" fill="#10b981"/>
      
      <!-- Input Mockup -->
      <rect x="90" y="0" width="860" height="36" rx="10" fill="#0b0f19" stroke="#fbbf24" stroke-opacity="0.4"/>
      <text x="110" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Eingabe: <tspan fill="#fbbf24">Schriftarten online kopieren</tspan></text>
      <text x="930" y="23" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981">⚡ 14 STILE AKTIV</text>
    </g>

    <!-- 6 Preview Cards Showcase -->
    <g transform="translate(25, 75)">
      
      <!-- Card 1: Fette Schrift -->
      <g transform="translate(0, 0)">
        <rect width="300" height="165" rx="14" fill="#161f30" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">1. FETTE SCHRIFT</text>
        <text x="20" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">𝗦𝗰𝗵𝗿𝗶𝗳𝘁𝗮𝗿𝘁𝗲𝗻</text>
        <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Ideal für Namen &amp; Bios</text>
        <rect x="20" y="118" width="260" height="32" rx="8" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="150" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">KOPIEREN 📋</text>
      </g>

      <!-- Card 2: Gotische Schrift -->
      <g transform="translate(325, 0)">
        <rect width="300" height="165" rx="14" fill="#161f30" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#818cf8">2. GOTISCH (FRAKTUR)</text>
        <text x="20" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">𝕾𝖈𝖍𝖗𝖎𝖋𝖙𝖆𝖗𝖙𝖊𝖓</text>
        <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Historisch &amp; markant</text>
        <rect x="20" y="118" width="260" height="32" rx="8" fill="#818cf8" fill-opacity="0.15"/>
        <text x="150" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#818cf8">KOPIEREN 📋</text>
      </g>

      <!-- Card 3: Kursive Schrift -->
      <g transform="translate(650, 0)">
        <rect width="300" height="165" rx="14" fill="#161f30" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f43f5e">3. KURSIVE SCHRIFT</text>
        <text x="20" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">𝓢𝓬𝓱𝓻𝓲𝓯𝓽𝓪𝓻𝓽𝓮𝓷</text>
        <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Elegant für Zitate</text>
        <rect x="20" y="118" width="260" height="32" rx="8" fill="#f43f5e" fill-opacity="0.15"/>
        <text x="150" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f43f5e">KOPIEREN 📋</text>
      </g>

      <!-- Card 4: Bubble Schrift -->
      <g transform="translate(0, 185)">
        <rect width="300" height="165" rx="14" fill="#161f30" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">4. BUBBLE SCHRIFT</text>
        <text x="20" y="70" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">Ⓢⓒⓗⓡⓘⓕⓣⓐⓡⓣⓔⓝ</text>
        <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Verspielt &amp; auffällig</text>
        <rect x="20" y="118" width="260" height="32" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="150" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">KOPIEREN 📋</text>
      </g>

      <!-- Card 5: Glitch Schrift -->
      <g transform="translate(325, 185)">
        <rect width="300" height="165" rx="14" fill="#161f30" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a855f7">5. GLITCH (ZALGO)</text>
        <text x="20" y="70" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">S̶c̶h̶r̶i̶f̶t̶a̶r̶t̶e̶n̶</text>
        <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Cyber &amp; Gaming-Look</text>
        <rect x="20" y="118" width="260" height="32" rx="8" fill="#a855f7" fill-opacity="0.15"/>
        <text x="150" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a855f7">KOPIEREN 📋</text>
      </g>

      <!-- Card 6: Handschrift -->
      <g transform="translate(650, 185)">
        <rect width="300" height="165" rx="14" fill="#161f30" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">6. HANDSCHRIFT</text>
        <text x="20" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">𝒮𝒸𝒽𝓇𝒾𝒻𝓉𝒶𝓇𝓉𝑒𝓃</text>
        <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Persönliche Grüße</text>
        <rect x="20" y="118" width="260" height="32" rx="8" fill="#22c55e" fill-opacity="0.15"/>
        <text x="150" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">KOPIEREN 📋</text>
      </g>

    </g>

  </g>
</svg>

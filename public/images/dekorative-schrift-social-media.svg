      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1e1832"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">✓ Visueller Trenner</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Strukturiert Bio-Abschnitte elegant</text>

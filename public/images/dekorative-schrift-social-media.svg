<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="decoSocialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14"/>
      <stop offset="50%" stop-color="#141226"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <filter id="socialShadowDeco" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#decoSocialBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#ec4899" fill-opacity="0.1"/>
  <circle cx="920" cy="450" r="260" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">PRAXIS &amp; PLATTFORMEN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Dekorative Schrift in <tspan fill="#f472b6">Instagram, Discord &amp; Gaming</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Auffällige Ornamente für Bios, Clan-Namen, Status-Meldungen und Überschriften
    </text>
  </g>

  <!-- 3 Application Mockup Cards -->
  <g transform="translate(80, 160)">
    
    <!-- Phone 1: Instagram Aesthetic Bio Mockup -->
    <g transform="translate(0, 0)" filter="url(#socialShadowDeco)">
      <rect width="325" height="440" rx="24" fill="#141226" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#1e1832"/>
      <rect y="20" width="325" height="20" fill="#1e1832"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6">📸 INSTAGRAM BIO &amp; STECKBRIEF</text>

      <g transform="translate(20, 55)">
        <rect width="285" height="290" rx="14" fill="#0b0816" stroke="#ec4899" stroke-opacity="0.3"/>
        
        <circle cx="45" cy="40" r="20" fill="#ec4899" fill-opacity="0.2"/>
        <text x="45" y="47" text-anchor="middle" font-size="16">🌸</text>
        <text x="75" y="38" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#ffffff">꧁ 𝐿𝒶𝓊𝓇𝒶 ꧂</text>
        <text x="75" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">@laura.aesthetic</text>

        <!-- Bio Lines -->
        <g transform="translate(20, 80)">
          <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">✧ 𝒞𝓇𝑒𝒶𝓉𝒾𝓋𝑒 𝑀𝒾𝓃𝒹 ✧</text>
          <text x="0" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">📍 𝕭𝖊𝖗𝖑𝖎𝖓 &amp;bull; 𝕬𝖗𝖙 &amp; 𝕯𝖊𝖘𝖎𝖌𝖓</text>
          <text x="0" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#f472b6">♡ 𝒩𝑒𝓌 𝒫𝑜𝓈𝓉 𝑒𝓋𝑒𝓇𝓎 𝒮𝓊𝓃𝒹𝒶𝓎 ♡</text>
          
          <line x1="0" y1="90" x2="245" y2="90" stroke="#ffffff" stroke-opacity="0.1"/>
          
          <rect x="0" y="105" width="245" height="35" rx="8" fill="#1e1832"/>
          <text x="122" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">🔗 linktr.ee/laura_art</text>

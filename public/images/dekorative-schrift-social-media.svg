        <rect width="285" height="290" rx="14" fill="#0b0816" stroke="#fbbf24" stroke-opacity="0.3"/>
        
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">VICTORY ROYALE PLAYERS:</text>
        
        <rect x="15" y="45" width="255" height="48" rx="8" fill="#1b1730" stroke="#fbbf24" stroke-opacity="0.3"/>
        <text x="25" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#fbbf24">👑 ꧁ 𝕾𝖍𝖆𝖉𝖔𝖜 ꧂ 👑</text>
        <text x="255" y="74" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22c55e">Rank #1</text>

        <rect x="15" y="102" width="255" height="45" rx="8" fill="#121020"/>
        <text x="25" y="130" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">★彡 𝓥𝓪𝓵𝓸𝓻𝓪𝓷𝓽𝓟𝓻𝓸 彡★</text>

        <rect x="15" y="155" width="255" height="45" rx="8" fill="#121020"/>
        <text x="25" y="183" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">『 𝕯𝖊𝖆𝖙𝖍𝕾𝖙𝖗𝖎𝖐𝖊 』</text>

        <rect x="15" y="215" width="255" height="55" rx="8" fill="#1b1730"/>
        <text x="25" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Tipp für Fortnite &amp; Roblox:</text>
        <text x="25" y="256" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Kombiniere Flügel (꧁) mit Kronen (👑)</text>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1e1832"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">✓ Hoher Wiedererkennungswert</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Unverwechselbare Killfeed-Präsenz</text>
    </g>

    <!-- Phone 3: Discord Server Roles Mockup -->
    <g transform="translate(710, 0)" filter="url(#socialShadowDeco)">
      <rect width="325" height="440" rx="24" fill="#141226" stroke="#5865f2" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect width="325" height="40" rx="24" fill="#1e1832"/>
      <rect y="20" width="325" height="20" fill="#1e1832"/>
      <text x="162" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#5865f2">🎮 DISCORD ROLLEN &amp; KANÄLE</text>


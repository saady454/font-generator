        <rect width="285" height="290" rx="14" fill="#0b0816" stroke="#5865f2" stroke-opacity="0.3"/>
        
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SERVER-ROLLEN:</text>
        
        <g transform="translate(15, 45)">
          <rect width="255" height="35" rx="8" fill="#5865f2" fill-opacity="0.2"/>
          <text x="20" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8">👑 ꧁ SERVER OWNER ꧂</text>
        </g>

        <g transform="translate(15, 90)">
          <rect width="255" height="35" rx="8" fill="#ec4899" fill-opacity="0.2"/>
          <text x="20" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6">💎 ✧ VIP BOOSTER ✧</text>
        </g>

        <g transform="translate(15, 135)">
          <rect width="255" height="35" rx="8" fill="#22c55e" fill-opacity="0.2"/>
          <text x="20" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">🛡️ 〖 MODERATOR 〗</text>
        </g>

        <g transform="translate(15, 180)">
          <rect width="255" height="35" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
          <text x="20" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">🌸 𝒲𝒾𝓁𝓁𝓀𝑜𝓂𝓂𝑒𝓃𝓈-𝒦𝒶𝓃𝒶𝓁</text>
        </g>
      </g>

      <rect x="20" y="365" width="285" height="55" rx="12" fill="#1e1832"/>
      <text x="35" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#5865f2">✓ Server-Hierarchie</text>
      <text x="35" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Macht Kanäle &amp; Rollen übersichtlich</text>
    </g>

  </g>
</svg>

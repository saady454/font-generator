<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="starBioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080914"/>
      <stop offset="50%" stop-color="#121630"/>
      <stop offset="100%" stop-color="#060710"/>
    </linearGradient>
    <linearGradient id="starBioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="starBioShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#starBioBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#ec4899" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e1f38" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">SOCIAL MEDIA PROFIL-IDEEN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Sternsymbole für <tspan fill="url(#starBioGrad)">Instagram, TikTok &amp; Bios</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie du Namen, Profiltexte und Statusmeldungen stilvoll hervorhebst
    </text>
  </g>

  <!-- 3 Profile Cards (Minimal, Aesthetic, Verspielt) -->
  <g transform="translate(60, 150)">
    
    <!-- Card 1: Minimalistisch -->
    <g transform="translate(0, 0)" filter="url(#starBioShadow)">
      <rect width="340" height="440" rx="22" fill="#13172e" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="140" height="26" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="70" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">1. MINIMALISTISCH</text>
        
        <circle cx="145" cy="85" r="32" fill="#1e1f38" stroke="#fbbf24" stroke-width="2"/>
        <text x="145" y="93" text-anchor="middle" font-size="24">☕</text>

        <text x="145" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">★ Sarah ★</text>
        <text x="145" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">@sarah.minimal</text>

        <rect y="185" width="290" height="135" rx="12" fill="#080a15"/>
        <g transform="translate(15, 20)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="14">★ Coffee &amp; Design Lover</text>
          <text x="0" y="38">★ Berlin &amp;bull; Architecture</text>
          <text x="0" y="62">★ Less is more ☆</text>
          <text x="0" y="92" font-size="11" fill="#fbbf24 font-weight=700">sarah-portfolio.de ↗</text>
        </g>

        <rect y="340" width="290" height="36" rx="8" fill="#1e1f38"/>
        <text x="145" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Stil: ★ Name ★</text>
      </g>
    </g>

    <!-- Card 2: Aesthetic / Dekorativ -->
    <g transform="translate(370, 0)" filter="url(#starBioShadow)">
      <rect width="340" height="440" rx="22" fill="#13172e" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="130" height="26" rx="6" fill="#c084fc" fill-opacity="0.15"/>
        <text x="65" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">2. AESTHETIC</text>
        
        <circle cx="145" cy="85" r="32" fill="#1e1f38" stroke="#c084fc" stroke-width="2"/>
        <text x="145" y="93" text-anchor="middle" font-size="24">🌙</text>

        <text x="145" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">✦ 𝓛𝓾𝓷𝓪 ✦</text>
        <text x="145" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c084fc">@luna.vibes</text>

        <rect y="185" width="290" height="135" rx="12" fill="#080a15"/>
        <g transform="translate(15, 20)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="14">⋆｡°✩ Night Sky &amp; Poetry ✩°｡⋆</text>
          <text x="0" y="38">✧ Photography &amp; Art ✧</text>
          <text x="0" y="62">✩₊˚.⋆ dreaming in purple ⋆⁺₊✧</text>
          <text x="0" y="92" font-size="11" fill="#c084fc font-weight=700">luna-art.com ↗</text>
        </g>

        <rect y="340" width="290" height="36" rx="8" fill="#1e1f38"/>
        <text x="145" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Stil: ✦ Name ✦ &amp;bull; ⋆｡°✩</text>
      </g>
    </g>

    <!-- Card 3: Verspielt / Emojis -->
    <g transform="translate(740, 0)" filter="url(#starBioShadow)">
      <rect width="340" height="440" rx="22" fill="#13172e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="130" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="65" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">3. VERSPIELT</text>
        
        <circle cx="145" cy="85" r="32" fill="#1e1f38" stroke="#38bdf8" stroke-width="2"/>
        <text x="145" y="93" text-anchor="middle" font-size="24">🎮</text>

        <text x="145" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">⭐ Leo ⭐</text>
        <text x="145" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">@leo.gaming</text>

        <rect y="185" width="290" height="135" rx="12" fill="#080a15"/>
        <g transform="translate(15, 20)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="14">🌟 Daily Streams &amp; Gaming</text>
          <text x="0" y="38">✨ Booyah &amp; Premier Highlights</text>
          <text x="0" y="62">⭐ Community Server Active</text>
          <text x="0" y="92" font-size="11" fill="#38bdf8 font-weight=700">twitch.tv/leogaming ↗</text>
        </g>

        <rect y="340" width="290" height="36" rx="8" fill="#1e1f38"/>
        <text x="145" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Stil: ⭐ Name ⭐ &amp;bull; ✨</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="splitHandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="50%" stop-color="#121426"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <filter id="splitHandShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#splitHandBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="300" r="260" fill="#c084fc" fill-opacity="0.10"/>
  <circle cx="920" cy="300" r="260" fill="#38bdf8" fill-opacity="0.10"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#d8b4fe" letter-spacing="2">TECHNOLOGIE-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Kopierbare Unicode-Handschrift vs. <tspan fill="#d8b4fe">Echte Font-Datei</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Der fundamentale Unterschied zwischen mathematischen Script-Zeichen und Schriftdateien (.TTF/.OTF)
    </text>
  </g>

  <!-- Split Comparison (Left: Unicode Text / Right: Installed Font) -->
  <g transform="translate(80, 160)">
    
    <!-- LEFT CARD: Unicode-Handschrift (Copy &amp; Paste) -->
    <g transform="translate(0, 0)" filter="url(#splitHandShadow)">
      <rect width="500" height="420" rx="24" fill="#121526" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.5"/>
      
      <!-- Top Badge -->
      <rect x="25" y="24" width="240" height="28" rx="14" fill="#c084fc" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#d8b4fe">📋 UNICODE-HANDSCHRIFT</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#c084fc" font-weight="700">Reiner Text</text>

      <!-- Smartphone / Screen Mockup Area -->
      <rect x="25" y="68" width="450" height="150" rx="16" fill="#080a12" stroke="#c084fc" stroke-opacity="0.2"/>
      
      <text x="225" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-style="italic" font-weight="700" fill="#ffffff">𝒮𝒸𝒽ö𝓃𝑒 𝒢𝓇üß𝑒</text>
      <text x="225" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#d8b4fe" font-weight="600">✓ Direktes Copy &amp; Paste in Bio und Chat</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Besteht aus mathematischen Script-Codepoints (U+1D49C)</text>

      <!-- Feature List -->
      <g transform="translate(25, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften &amp; Vorteile:</text>
        
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#c084fc"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Funktioniert sofort ohne Download oder Software</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#c084fc"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Für Instagram-Bios, WhatsApp &amp; TikTok-Profile</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#c084fc"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Keine Ligaturen oder dynamische Wortverbindungen</text>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: Echte Font-Datei (.otf / .ttf) -->
    <g transform="translate(540, 0)" filter="url(#splitHandShadow)">
      <rect width="500" height="420" rx="24" fill="#121526" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      
      <!-- Top Badge -->
      <rect x="25" y="24" width="240" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="38" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">📁 ECHTE SCHRIFTDATEI (.TTF/.OTF)</text>
      <text x="475" y="43" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">Vektor-Glyphen</text>

      <!-- Desktop Design App Mockup Area -->
      <rect x="25" y="68" width="450" height="150" rx="16" fill="#080a12" stroke="#38bdf8" stroke-opacity="0.2"/>
      
      <text x="225" y="125" text-anchor="middle" font-family="Brush Script MT, cursive, Georgia" font-size="44" font-weight="700" fill="#38bdf8">Schöne Grüße</text>
      <text x="225" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="600">✓ Echtes Lettering mit perfekten Wortverbindungen</text>
      <text x="225" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Wird in Photoshop, Illustrator, Canva &amp; Word gerendert</text>

      <!-- Feature List -->
      <g transform="translate(25, 240)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eigenschaften &amp; Vorteile:</text>
        
        <g transform="translate(0, 15)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">100% flüssige Ligaturen wie echte Handschrift</text>
        </g>
        <g transform="translate(0, 45)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Perfekt für Druck, Logos, Karten &amp; Werbemittel</text>
        </g>
        <g transform="translate(0, 75)">
          <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
          <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Muss im Betriebssystem / Programm geladen werden</text>
        </g>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="rowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2233"/>
      <stop offset="100%" stop-color="#121622"/>
    </linearGradient>
    <filter id="rowShadow" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#compBg)"/>

  <!-- Top Title -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff">
      Vergleich: <tspan fill="#94a3b8">Normaler Text</tspan> vs. <tspan fill="#f59e0b">Fette Schriftarten</tspan>
    </text>
    <text y="32" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Derselbe deutsche Beispielsatz in unterschiedlichen Schriftschnitten und Formatierungen
    </text>
  </g>

  <!-- Comparison Rows -->
  <g transform="translate(100, 140)">
    
    <!-- Row 1: Normaler Standardtext -->
    <g transform="translate(0, 0)" filter="url(#rowShadow)">
      <rect width="1000" height="95" rx="16" fill="url(#rowGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="25" y="32" width="130" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <text x="90" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">STANDARD TEXT</text>
      
      <text x="200" y="56" font-family="system-ui, sans-serif" font-size="22" fill="#e2e8f0">Fette Schrift zum Kopieren und Einfügen</text>
      <text x="890" y="54" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="end">Basis / Fließtext</text>
    </g>

    <!-- Row 2: Fette Sans-Serif (Bold Sans) -->
    <g transform="translate(0, 115)" filter="url(#rowShadow)">
      <rect width="1000" height="95" rx="16" fill="url(#rowGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="25" y="32" width="130" height="30" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="90" y="52" font-family="sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">FETT SANS</text>
      
      <text x="200" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">𝗙𝗲𝘁𝘁𝗲 𝗦𝗰𝗵𝗿𝗶𝗳𝘁 𝘇𝘂𝗺 𝗞𝗼𝗽𝗶𝗲𝗿𝗲𝗻 𝘂𝗻𝗱 𝗘𝗶𝗻𝗳ü𝗴𝗲𝗻</text>
      <text x="890" y="54" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="end">🔥 Höchste Lesbarkeit</text>
    </g>

    <!-- Row 3: Fette Serif (Bold Serif) -->
    <g transform="translate(0, 230)" filter="url(#rowShadow)">
      <rect width="1000" height="95" rx="16" fill="url(#rowGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="25" y="32" width="130" height="30" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="90" y="52" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">FETT SERIF</text>
      
      <text x="200" y="56" font-family="'Times New Roman', serif" font-size="23" font-weight="800" fill="#ffffff">𝐅𝐞𝐭𝐭𝐞 𝐒𝐜𝐡𝐫𝐢𝐟𝐭 𝐳𝐮𝐦 𝐊𝐨𝐩𝐢𝐞𝐫𝐞𝐧 𝐮𝐧𝐝 𝐄𝐢𝐧𝐟ü𝐠𝐞𝐧</text>
      <text x="890" y="54" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="end">Klassisch &amp; Redaktionell</text>
    </g>

    <!-- Row 4: Fette Kursiv (Bold Italic) -->
    <g transform="translate(0, 345)" filter="url(#rowShadow)">
      <rect width="1000" height="95" rx="16" fill="url(#rowGrad)" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="25" y="32" width="130" height="30" rx="8" fill="#ec4899" fill-opacity="0.15"/>
      <text x="90" y="52" font-family="sans-serif" font-size="12" font-weight="800" fill="#f472b6" text-anchor="middle">FETT KURSIV</text>
      
      <text x="200" y="56" font-family="sans-serif" font-size="22" font-weight="800" font-style="italic" fill="#ffffff">𝑭𝒆𝒕𝒕𝒆 𝑺𝒄𝒉𝒓𝒊𝒇𝒕 𝒛𝒖𝒎 𝑲𝒐𝒑𝒊𝒆𝒓𝒆𝒏 𝒖𝒏𝒅 𝑬𝒊𝒏𝒇ü𝒈𝒆𝒏</text>
      <text x="890" y="54" font-family="sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="end">Dynamisch &amp; Elegant</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <text x="600" y="635" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">
    Alle gezeigten Schriftstile können ohne Installation direkt über die Zwischenablage eingefügt werden.
  </text>
</svg>

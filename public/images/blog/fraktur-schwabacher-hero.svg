<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="frakHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0907"/>
      <stop offset="50%" stop-color="#17140f"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>
    <linearGradient id="frakGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="frakHeroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#frakHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="220" r="280" fill="#f59e0b" fill-opacity="0.08"/>
  <circle cx="920" cy="450" r="280" fill="#d97706" fill-opacity="0.08"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-220" y="-18" width="440" height="36" rx="18" fill="#1e1b15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">DEUTSCHE TYPOGRAFIEGESCHICHTE</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Fraktur &amp; Schwabacher: <tspan fill="url(#frakGoldGrad)">Geschichte der altdeutschen Schrift</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
    Von Gutenbergs Buchdruck und Kaiser Maximilian I. bis zum modernen Digitaldesign
  </text>

  <!-- Main Container Visual Mockup -->
  <g transform="translate(100, 205)" filter="url(#frakHeroShadow)">
    <rect width="1000" height="420" rx="26" fill="#14120e" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Parchment-like Container -->
    <rect x="25" y="25" width="950" height="370" rx="18" fill="#0c0a08" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Schwabacher Showcase -->
    <g transform="translate(55, 55)">
      <rect width="410" height="310" rx="16" fill="#1a1610" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <g transform="translate(20, 20)">
        <rect width="160" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="80" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">15. JAHRHUNDERT</text>
      </g>

      <!-- Content Box -->
      <g transform="translate(20, 60)">
        <rect width="370" height="110" rx="12" fill="#0c0a08" stroke="#f59e0b" stroke-opacity="0.2"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">DIE SCHWABACHER:</text>
        <text x="15" y="68" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff">𝔖𝔠𝔥𝔴𝔞𝔟𝔞𝔠𝔥𝔢𝔯</text>
        <text x="15" y="96" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">Runde, offene Formen &amp;bull; Lutherbibel 1522</text>
      </g>

      <!-- Description -->
      <g transform="translate(20, 185)">
        <rect width="370" height="95" rx="12" fill="#221e17"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">MERKMALE:</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Relativ breite, volkstümliche Buchstaben.</text>
        <text x="15" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Prägte den frühen deutschen Buchdruck (Schedel).</text>
      </g>
    </g>

    <!-- Right: Fraktur Showcase -->
    <g transform="translate(535, 55)">
      <rect width="410" height="310" rx="16" fill="#1a1610" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <g transform="translate(20, 20)">
        <rect width="160" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="80" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">16. BIS 20. JHD.</text>
      </g>

      <!-- Content Box -->
      <g transform="translate(20, 60)">
        <rect width="370" height="110" rx="12" fill="#0c0a08" stroke="#f59e0b" stroke-opacity="0.2"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">DIE FRAKTURSCHRIFT:</text>
        <text x="15" y="68" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff">𝔉𝔯𝔞𝔨𝔱𝔲𝔯𝔰𝔠𝔥𝔯𝔦𝔣𝔱</text>
        <text x="15" y="96" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">Starke Brechungen &amp;bull; Theuerdank 1517</text>
      </g>

      <!-- Description -->
      <g transform="translate(20, 185)">
        <rect width="370" height="95" rx="12" fill="#221e17"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">MERKMALE:</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Elefantenrüssel an Versalien, hoher Kontrast.</text>
        <text x="15" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Dominierende Druckschrift über 400 Jahre lang.</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bfsgSrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="bfsgSrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="bfsgSrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bfsgSrBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="220" r="260" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="940" cy="450" r="260" fill="#f472b6" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">ASSISTIVE TECHNOLOGIEN IM DETAIL</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Wie Screenreader <tspan fill="url(#bfsgSrGrad)">Text verarbeiten</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Der direkte Vergleich von Sprachausgaben bei normalem vs. dekorativem Text
    </text>
  </g>

  <!-- 2 Large Audio Output Comparison Cards -->
  <g transform="translate(80, 150)">
    
    <!-- Left: Screenreader Standard Text -->
    <g transform="translate(0, 0)" filter="url(#bfsgSrShadow)">
      <rect width="500" height="440" rx="22" fill="#111827" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(30, 30)">
        <rect width="210" height="26" rx="6" fill="#22c55e" fill-opacity="0.15"/>
        <text x="105" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">🔊 NORMALER HTML-TEXT</text>

        <!-- HTML Code Box -->
        <rect y="45" width="440" height="70" rx="12" fill="#080d1a" stroke="#22c55e" stroke-opacity="0.2"/>
        <text x="20" y="32" font-family="monospace" font-size="11" fill="#94a3b8">HTML-QUELLCODE:</text>
        <text x="20" y="55" font-family="monospace" font-size="15" font-weight="bold" fill="#ffffff">&lt;h2&gt;Angebote und Neuigkeiten&lt;/h2&gt;</text>

        <!-- Waveform Simulation -->
        <g transform="translate(0, 130)">
          <rect width="440" height="60" rx="10" fill="#080d1a"/>
          <g transform="translate(20, 30)" stroke="#22c55e" stroke-width="3" stroke-linecap="round">
            <line x1="0" y1="-8" x2="0" y2="8"/>
            <line x1="15" y1="-18" x2="15" y2="18"/>
            <line x1="30" y1="-12" x2="30" y2="12"/>
            <line x1="45" y1="-22" x2="45" y2="22"/>
            <line x1="60" y1="-15" x2="60" y2="15"/>
            <line x1="75" y1="-25" x2="75" y2="25"/>
            <line x1="90" y1="-10" x2="90" y2="10"/>
            <line x1="105" y1="-18" x2="105" y2="18"/>
            <line x1="120" y1="-6" x2="120" y2="6"/>
          </g>
          <text x="160" y="36" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22c55e">Flüssige, natürliche Sprachsynthese</text>
        </g>

        <!-- Speech Bubble -->
        <g transform="translate(0, 205)">
          <rect width="440" height="110" rx="14" fill="#1e293b" stroke="#22c55e" stroke-opacity="0.3"/>
          <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">AKUSTISCHE AUSGABE (NVDA / JAWS):</text>
          <text x="20" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">„Überschrift Ebene 2: Angebote und Neuigkeiten.“</text>
          <text x="20" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Dauer: ca. 1,5 Sekunden &amp;bull; Sofort verständlich</text>
        </g>

        <rect y="335" width="440" height="35" rx="8" fill="#22c55e" fill-opacity="0.15"/>
        <text x="220" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#22c55e">✓ Barrierefrei nach WCAG 2.1 / EN 301 549</text>
      </g>
    </g>

    <!-- Right: Screenreader Decorative Unicode -->
    <g transform="translate(540, 0)" filter="url(#bfsgSrShadow)">
      <rect width="500" height="440" rx="22" fill="#111827" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(30, 30)">
        <rect width="230" height="26" rx="6" fill="#f43f5e" fill-opacity="0.15"/>
        <text x="115" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fb7185">⚠ VOLLSTÄNDIGER UNICODE</text>

        <!-- HTML Code Box -->
        <rect y="45" width="440" height="70" rx="12" fill="#080d1a" stroke="#f43f5e" stroke-opacity="0.2"/>
        <text x="20" y="32" font-family="monospace" font-size="11" fill="#94a3b8">HTML-QUELLCODE:</text>
        <text x="20" y="55" font-family="monospace" font-size="14" font-weight="bold" fill="#fb7185">&lt;h2&gt;𝓐𝓷𝓰𝓮𝓫𝓸𝓽𝓮 𝓾𝓷𝓭 𝓝𝓮𝓾𝓲𝓰𝓴𝓮𝓲𝓽𝓮𝓷&lt;/h2&gt;</text>

        <!-- Waveform Simulation -->
        <g transform="translate(0, 130)">
          <rect width="440" height="60" rx="10" fill="#080d1a"/>
          <g transform="translate(20, 30)" stroke="#f43f5e" stroke-width="3" stroke-linecap="round">
            <line x1="0" y1="-6" x2="0" y2="6"/>
            <line x1="10" y1="-6" x2="10" y2="6"/>
            <line x1="20" y1="-6" x2="20" y2="6"/>
            <line x1="30" y1="-6" x2="30" y2="6"/>
            <line x1="40" y1="-6" x2="40" y2="6"/>
            <line x1="50" y1="-6" x2="50" y2="6"/>
            <line x1="60" y1="-6" x2="60" y2="6"/>
          </g>
          <text x="95" y="36" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fb7185">Abgehacktes Einzel-Buchstabieren</text>
        </g>

        <!-- Speech Bubble -->
        <g transform="translate(0, 205)">
          <rect width="440" height="110" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.3"/>
          <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fb7185">AKUSTISCHE AUSGABE (NVDA / JAWS):</text>
          <text x="20" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">„Mathematisches Schreibschrift A, mathematisches...“</text>
          <text x="20" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">„...Schreibschrift n, mathematisches Schreibschrift g...“</text>
          <text x="20" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Dauer: über 18 Sekunden &amp;bull; Extrem mühsam</text>
        </g>

        <rect y="335" width="440" height="35" rx="8" fill="#f43f5e" fill-opacity="0.15"/>
        <text x="220" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fb7185">⚠ Barriere für sehbehinderte Nutzer</text>
      </g>
    </g>

  </g>
</svg>

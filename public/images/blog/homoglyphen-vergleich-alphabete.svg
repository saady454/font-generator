<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="gridShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#gridBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#ef4444" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">UNICODE CONFUSABLES MATRIX</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Vergleich der <tspan fill="url(#gridGrad)">visuellen Doppelgänger</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie sich lateinische, kyrillische und griechische Zeichen in Codepoints unterscheiden
    </text>
  </g>

  <!-- 3 Columns Layout -->
  <g transform="translate(70, 150)">
    
    <!-- 1. Lateinisches Alphabet -->
    <g transform="translate(0, 0)" filter="url(#gridShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="150" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="75" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">1. LATEINISCH (ASCII)</text>

        <!-- Rows -->
        <g transform="translate(0, 40)" font-family="monospace" font-size="15">
          
          <rect y="0" width="270" height="50" rx="8" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
          <text x="20" y="32" font-size="22" font-weight="bold" fill="#ffffff">a</text>
          <text x="250" y="31" text-anchor="end" font-size="12" fill="#38bdf8">U+0061</text>

          <rect y="60" width="270" height="50" rx="8" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
          <text x="20" y="92" font-size="22" font-weight="bold" fill="#ffffff">e</text>
          <text x="250" y="91" text-anchor="end" font-size="12" fill="#38bdf8">U+0065</text>

          <rect y="120" width="270" height="50" rx="8" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
          <text x="20" y="152" font-size="22" font-weight="bold" fill="#ffffff">o</text>
          <text x="250" y="151" text-anchor="end" font-size="12" fill="#38bdf8">U+006F</text>

          <rect y="180" width="270" height="50" rx="8" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
          <text x="20" y="212" font-size="22" font-weight="bold" fill="#ffffff">p</text>
          <text x="250" y="211" text-anchor="end" font-size="12" fill="#38bdf8">U+0070</text>

          <rect y="240" width="270" height="50" rx="8" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
          <text x="20" y="272" font-size="22" font-weight="bold" fill="#ffffff">c</text>
          <text x="250" y="271" text-anchor="end" font-size="12" fill="#38bdf8">U+0063</text>

        </g>

        <rect y="350" width="270" height="34" rx="8" fill="#1e293b"/>
        <text x="135" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Standard Web-Zeichen</text>
      </g>
    </g>

    <!-- 2. Kyrillisches Alphabet -->
    <g transform="translate(370, 0)" filter="url(#gridShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="180" height="26" rx="6" fill="#ef4444" fill-opacity="0.15"/>
        <text x="90" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ef4444">2. KYRILLISCH (CYRILLIC)</text>

        <!-- Rows -->
        <g transform="translate(0, 40)" font-family="monospace" font-size="15">
          
          <rect y="0" width="270" height="50" rx="8" fill="#080d1a" stroke="#ef4444" stroke-opacity="0.2"/>
          <text x="20" y="32" font-size="22" font-weight="bold" fill="#ef4444">а</text>
          <text x="250" y="31" text-anchor="end" font-size="12" fill="#ef4444">U+0430</text>

          <rect y="60" width="270" height="50" rx="8" fill="#080d1a" stroke="#ef4444" stroke-opacity="0.2"/>
          <text x="20" y="92" font-size="22" font-weight="bold" fill="#ef4444">е</text>
          <text x="250" y="91" text-anchor="end" font-size="12" fill="#ef4444">U+0435</text>

          <rect y="120" width="270" height="50" rx="8" fill="#080d1a" stroke="#ef4444" stroke-opacity="0.2"/>
          <text x="20" y="152" font-size="22" font-weight="bold" fill="#ef4444">о</text>
          <text x="250" y="151" text-anchor="end" font-size="12" fill="#ef4444">U+043E</text>

          <rect y="180" width="270" height="50" rx="8" fill="#080d1a" stroke="#ef4444" stroke-opacity="0.2"/>
          <text x="20" y="212" font-size="22" font-weight="bold" fill="#ef4444">р</text>
          <text x="250" y="211" text-anchor="end" font-size="12" fill="#ef4444">U+0440</text>

          <rect y="240" width="270" height="50" rx="8" fill="#080d1a" stroke="#ef4444" stroke-opacity="0.2"/>
          <text x="20" y="272" font-size="22" font-weight="bold" fill="#ef4444">с</text>
          <text x="250" y="271" text-anchor="end" font-size="12" fill="#ef4444">U+0441</text>

        </g>

        <rect y="350" width="270" height="34" rx="8" fill="#1e293b"/>
        <text x="135" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ef4444">Hohes Täuschungspotenzial</text>
      </g>
    </g>

    <!-- 3. Griechisches Alphabet -->
    <g transform="translate(740, 0)" filter="url(#gridShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="160" height="26" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="80" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">3. GRIECHISCH (GREEK)</text>

        <!-- Rows -->
        <g transform="translate(0, 40)" font-family="monospace" font-size="15">
          
          <rect y="0" width="270" height="50" rx="8" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
          <text x="20" y="32" font-size="22" font-weight="bold" fill="#fbbf24">α</text>
          <text x="250" y="31" text-anchor="end" font-size="12" fill="#fbbf24">U+03B1</text>

          <rect y="60" width="270" height="50" rx="8" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
          <text x="20" y="92" font-size="22" font-weight="bold" fill="#fbbf24">ε</text>
          <text x="250" y="91" text-anchor="end" font-size="12" fill="#fbbf24">U+03B5</text>

          <rect y="120" width="270" height="50" rx="8" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
          <text x="20" y="152" font-size="22" font-weight="bold" fill="#fbbf24">ο</text>
          <text x="250" y="151" text-anchor="end" font-size="12" fill="#fbbf24">U+03BF</text>

          <rect y="180" width="270" height="50" rx="8" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
          <text x="20" y="212" font-size="22" font-weight="bold" fill="#fbbf24">ρ</text>
          <text x="250" y="211" text-anchor="end" font-size="12" fill="#fbbf24">U+03C1</text>

          <rect y="240" width="270" height="50" rx="8" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
          <text x="20" y="272" font-size="22" font-weight="bold" fill="#fbbf24">ν</text>
          <text x="250" y="271" text-anchor="end" font-size="12" fill="#fbbf24">U+03BD</text>

        </g>

        <rect y="350" width="270" height="34" rx="8" fill="#1e293b"/>
        <text x="135" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Griechische Doppelgänger</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="flowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#flowBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#22c55e" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">WORKFLOW-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Der Prozess im <tspan fill="url(#flowGrad)">direkten Vergleich</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Schritt-für-Schritt von der Texteingabe bis zum fertigen Ergebnis
    </text>
  </g>

  <!-- 2 Workflow Columns -->
  <g transform="translate(80, 140)">
    
    <!-- Left Column: Generator Workflow -->
    <g transform="translate(0, 0)" filter="url(#flowShadow)">
      <rect width="500" height="465" rx="20" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="210" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="105" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">1. SCHRIFTARTEN-GENERATOR</text>

        <!-- 4 Step Boxes -->
        <g transform="translate(0, 45)">
          
          <!-- Step 1 -->
          <g transform="translate(0, 0)">
            <rect width="450" height="60" rx="10" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
            <circle cx="30" cy="30" r="14" fill="#38bdf8" fill-opacity="0.2"/>
            <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#38bdf8">1</text>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Normalen Text online eingeben</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">z. B. "Hallo Welt" im Browserfenster</text>
          </g>

          <!-- Step 2 -->
          <g transform="translate(0, 75)">
            <rect width="450" height="60" rx="10" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
            <circle cx="30" cy="30" r="14" fill="#38bdf8" fill-opacity="0.2"/>
            <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#38bdf8">2</text>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Unicode-Stil aus Vorschau wählen</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Fett, Kursiv, Fraktur, Bubble etc.</text>
          </g>

          <!-- Step 3 -->
          <g transform="translate(0, 150)">
            <rect width="450" height="60" rx="10" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
            <circle cx="30" cy="30" r="14" fill="#38bdf8" fill-opacity="0.2"/>
            <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#38bdf8">3</text>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">1-Klick „Kopieren“ Button</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Wird direkt in die Zwischenablage gelegt</text>
          </g>

          <!-- Step 4 -->
          <g transform="translate(0, 225)">
            <rect width="450" height="60" rx="10" fill="#080d1a" stroke="#22c55e" stroke-opacity="0.3"/>
            <circle cx="30" cy="30" r="14" fill="#22c55e" fill-opacity="0.2"/>
            <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#22c55e">✓</text>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#22c55e">In Social Media / App einfügen</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Instagram, TikTok, WhatsApp, Discord</text>
          </g>

        </g>

        <rect y="365" width="450" height="38" rx="8" fill="#1e293b"/>
        <text x="225" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Dauer: ca. 5 Sekunden &amp;bull; Keine Software nötig</text>
      </g>
    </g>

    <!-- Right Column: TTF/OTF Workflow -->
    <g transform="translate(540, 0)" filter="url(#flowShadow)">
      <rect width="500" height="465" rx="20" fill="#111827" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="190" height="26" rx="6" fill="#818cf8" fill-opacity="0.15"/>
        <text x="95" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#818cf8">2. SCHRIFTDATEI (.TTF / .OTF)</text>

        <!-- 4 Step Boxes -->
        <g transform="translate(0, 45)">
          
          <!-- Step 1 -->
          <g transform="translate(0, 0)">
            <rect width="450" height="60" rx="10" fill="#080d1a" stroke="#818cf8" stroke-opacity="0.2"/>
            <circle cx="30" cy="30" r="14" fill="#818cf8" fill-opacity="0.2"/>
            <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#818cf8">1</text>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Font-Datei (.ttf / .otf) herunterladen</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Von Google Fonts, Adobe Fonts etc.</text>
          </g>

          <!-- Step 2 -->
          <g transform="translate(0, 75)">
            <rect width="450" height="60" rx="10" fill="#080d1a" stroke="#818cf8" stroke-opacity="0.2"/>
            <circle cx="30" cy="30" r="14" fill="#818cf8" fill-opacity="0.2"/>
            <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#818cf8">2</text>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Im Betriebssystem installieren</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Rechtsklick ➔ „Für alle Benutzer installieren“</text>
          </g>

          <!-- Step 3 -->
          <g transform="translate(0, 150)">
            <rect width="450" height="60" rx="10" fill="#080d1a" stroke="#818cf8" stroke-opacity="0.2"/>
            <circle cx="30" cy="30" r="14" fill="#818cf8" fill-opacity="0.2"/>
            <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#818cf8">3</text>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">In Word / Photoshop Schrift auswählen</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Steht nun in allen Desktop-Programmen bereit</text>
          </g>

          <!-- Step 4 -->
          <g transform="translate(0, 225)">
            <rect width="450" height="60" rx="10" fill="#080d1a" stroke="#22c55e" stroke-opacity="0.3"/>
            <circle cx="30" cy="30" r="14" fill="#22c55e" fill-opacity="0.2"/>
            <text x="30" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#22c55e">✓</text>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#22c55e">Dokument layouten &amp; als PDF drucken</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Bücher, Flyer, Berichte &amp; Vektordesigns</text>
          </g>

        </g>

        <rect y="365" width="450" height="38" rx="8" fill="#1e293b"/>
        <text x="225" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8">Dauer: 2–5 Minuten &amp;bull; Für professionellen Satz</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="uniGenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="uniGenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="uniGenShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#uniGenBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#34d399" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">FUNKTIONSWEISE EINES GENERATORS</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Von Tastatureingabe zu <tspan fill="url(#uniGenGrad)">Unicode-Zierschrift</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Der technische Ablauf: Eingabe ➔ Codepoint-Mapping ➔ Ausgabe in die Zwischenablage
    </text>
  </g>

  <!-- 3 Stage Process Cards (Input -> Lookup -> Output) -->
  <g transform="translate(70, 150)">
    
    <!-- Stage 1: Input -->
    <g transform="translate(0, 0)" filter="url(#uniGenShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="120" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="60" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">1. EINGABE</text>

        <rect y="40" width="270" height="90" rx="12" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">NORMALER TEXT:</text>
        <text x="20" y="70" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff">Hallo</text>

        <g transform="translate(0, 155)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#38bdf8">Zeichen-Parsing:</text>
          <text x="0" y="24">Der Generator liest</text>
          <text x="0" y="44">die einzelnen Standard-</text>
          <text x="0" y="64">Zeichen: H, a, l, l, o</text>
          <text x="0" y="94" font-family="monospace" fill="#94a3b8">U+0048, U+0061...</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">ASCII Tastatureingabe</text>
      </g>
    </g>

    <!-- Stage 2: Mapping / Lookup -->
    <g transform="translate(370, 0)" filter="url(#uniGenShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="130" height="26" rx="6" fill="#818cf8" fill-opacity="0.15"/>
        <text x="65" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#818cf8">2. MAPPING</text>

        <rect y="40" width="270" height="90" rx="12" fill="#080d1a" stroke="#818cf8" stroke-opacity="0.2"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">OFFSET-TABELLE:</text>
        <text x="20" y="65" font-family="monospace" font-size="14" font-weight="bold" fill="#818cf8">'H' ➔ U+1D43B (𝓗)</text>
        <text x="20" y="85" font-family="monospace" font-size="14" font-weight="bold" fill="#818cf8">'a' ➔ U+1D4EA (𝓪)</text>

        <g transform="translate(0, 155)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#818cf8">Zeichentausch:</text>
          <text x="0" y="24">Keine Font-Generierung,</text>
          <text x="0" y="44">sondern direkter</text>
          <text x="0" y="64">Austausch durch</text>
          <text x="0" y="84">mathematische Symbole.</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8">Unicode-Zeichentausch</text>
      </g>
    </g>

    <!-- Stage 3: Output -->
    <g transform="translate(740, 0)" filter="url(#uniGenShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="110" height="26" rx="6" fill="#34d399" fill-opacity="0.15"/>
        <text x="55" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">3. AUSGABE</text>

        <rect y="40" width="270" height="90" rx="12" fill="#080d1a" stroke="#34d399" stroke-opacity="0.2"/>
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">KOPIERBARER TEXT:</text>
        <text x="20" y="65" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">𝓗𝓪𝓵𝓵𝓸 / 𝐇𝐚𝐥𝐥𝐨</text>
        <text x="20" y="85" font-family="monospace" font-size="16" font-weight="bold" fill="#34d399">𝕳𝖆𝖑𝖑𝖔 / Ⓗⓐⓛⓛⓞ</text>

        <g transform="translate(0, 155)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#34d399">Copy &amp; Paste:</text>
          <text x="0" y="24">Text landet in der</text>
          <text x="0" y="44">Zwischenablage und</text>
          <text x="0" y="64">kann in Instagram &amp;</text>
          <text x="0" y="84">WhatsApp eingefügt werden.</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">1-Klick Zwischenablage</text>
      </g>
    </g>

  </g>
</svg>

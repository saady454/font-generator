<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="uniHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="uniGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="uniHeroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#uniHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="220" r="280" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="920" cy="450" r="280" fill="#818cf8" fill-opacity="0.08"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-210" y="-18" width="420" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">UNICODE 17.0 &amp;bull; 159.801 CODEPOINTS</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Was ist Unicode? <tspan fill="url(#uniGrad)">Schriftgeneratoren erklärt</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Codepunkte, Glyphen, UTF-8 &amp; mathematische Symbole verständlich aufgeschlüsselt
  </text>

  <!-- Main Container Visual Mockup -->
  <g transform="translate(100, 205)" filter="url(#uniHeroShadow)">
    <rect width="1000" height="420" rx="26" fill="#111827" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Grid Workspace -->
    <rect x="25" y="25" width="950" height="370" rx="18" fill="#090d16" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Unicode Character Architecture -->
    <g transform="translate(55, 55)">
      <rect width="410" height="310" rx="16" fill="#161f30" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <g transform="translate(20, 20)">
        <rect width="160" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="80" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">UNICODE-STANDARD</text>
      </g>

      <!-- Codepoint Showcase -->
      <g transform="translate(20, 60)">
        <rect width="370" height="110" rx="12" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.2"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">CODEPUNKT-MAPPING:</text>
        <text x="15" y="68" font-family="system-ui, monospace" font-size="28" font-weight="900" fill="#ffffff">U+0041 <tspan fill="#38bdf8">➔ 'A'</tspan></text>
        <text x="15" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">LATIN CAPITAL LETTER A (Standard)</text>
      </g>

      <!-- Sub Mapping -->
      <g transform="translate(20, 185)">
        <rect width="370" height="95" rx="12" fill="#1e293b"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">MATHEMATICAL SCRIPT A:</text>
        <text x="15" y="55" font-family="system-ui, monospace" font-size="22" font-weight="900" fill="#c084fc">U+1D49C ➔ '𝓐'</text>
        <text x="15" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Eigener Codepunkt &amp;bull; Kein echter Font-Download nötig</text>
      </g>
    </g>

    <!-- Right: How Generators Work -->
    <g transform="translate(535, 55)">
      <rect width="410" height="310" rx="16" fill="#161f30" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <g transform="translate(20, 20)">
        <rect width="180" height="26" rx="6" fill="#c084fc" fill-opacity="0.15"/>
        <text x="90" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">SCHRIFTGENERATOR</text>
      </g>

      <!-- Input/Output Simulation -->
      <g transform="translate(20, 60)">
        <rect width="370" height="110" rx="12" fill="#0b1120" stroke="#c084fc" stroke-opacity="0.2"/>
        <text x="15" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">TEXT-UMWANDLUNG:</text>
        <text x="15" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Eingabe: <tspan fill="#38bdf8">Hallo</tspan></text>
        <text x="15" y="82" font-family="system-ui, monospace" font-size="18" font-weight="bold" fill="#c084fc">Ausgabe: 𝓗𝓪𝓵𝓵𝓸 / 𝐇𝐚𝐥𝐥𝐨</text>
        <text x="15" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e">✓ Mit 1 Klick überall einfügbar</text>
      </g>

      <!-- Tech Note -->
      <g transform="translate(20, 185)">
        <rect width="370" height="95" rx="12" fill="#1e293b"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">WIE ES FUNKTIONIERT:</text>
        <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">1. Liest Buchstaben A–Z</text>
        <text x="15" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">2. Rechnet Offset auf mathematische Codepoints</text>
        <text x="15" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">3. UTF-8 kodiert für plattformübergreifendes Copy-Paste</text>
      </g>
    </g>

  </g>
</svg>

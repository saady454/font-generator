<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tofuCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="tofuCompGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="tofuCompShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#tofuCompBg)"/>

  <!-- Ambient Glows -->
  <circle cx="240" cy="200" r="240" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="960" cy="450" r="240" fill="#fbbf24" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">PLATTFORM-VERGLEICH</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Identischer Text auf <tspan fill="url(#tofuCompGrad)">verschiedenen Geräten</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Warum ein dekorativer Text auf dem Handy perfekt aussieht, am PC aber Kästchen erzeugt
    </text>
  </g>

  <!-- 3 Device Cards -->
  <g transform="translate(70, 150)">
    
    <!-- 1. Modern Smartphone -->
    <g transform="translate(0, 0)" filter="url(#tofuCompShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="170" height="26" rx="6" fill="#22c55e" fill-opacity="0.15"/>
        <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">1. MODERNES SMARTPHONE</text>

        <rect y="40" width="270" height="100" rx="12" fill="#080d1a" stroke="#22c55e" stroke-opacity="0.2"/>
        <text x="135" y="78" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff">꧁༺ 𝓛𝓾𝓷𝓪 ༻꧂</text>
        <text x="135" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">✓ Perfekt gerendert</text>

        <g transform="translate(0, 165)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#22c55e">Status:</text>
          <text x="0" y="24">Aktuelle Systemschriften</text>
          <text x="0" y="44">auf iOS 17+ und Android 14+</text>
          <text x="0" y="64">enthalten alle mathematischen</text>
          <text x="0" y="84">und asiatischen Schmuckzeichen.</text>
          <text x="0" y="114" font-weight="700" fill="#22c55e">100 % Erfolgsquote</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#22c55e">Volle Unterstützung</text>
      </g>
    </g>

    <!-- 2. Modern Desktop -->
    <g transform="translate(370, 0)" filter="url(#tofuCompShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="150" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="75" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">2. DESKTOP BROWSER</text>

        <rect y="40" width="270" height="100" rx="12" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
        <text x="135" y="78" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff">꧁༺ 𝓛𝓾𝓷𝓪 ༻꧂</text>
        <text x="135" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">✓ Web-Engine Fallback</text>

        <g transform="translate(0, 165)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#38bdf8">Status:</text>
          <text x="0" y="24">Chrome &amp; Firefox nutzen</text>
          <text x="0" y="44">intelligente Fallback-</text>
          <text x="0" y="64">Font-Ketten, um fehlende</text>
          <text x="0" y="84">Glyphen zu ergänzen.</text>
          <text x="0" y="114" font-weight="700" fill="#38bdf8">Sehr hohe Kompatibilität</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Font-Fallback Kette</text>
      </g>
    </g>

    <!-- 3. Legacy System / Restricted Game -->
    <g transform="translate(740, 0)" filter="url(#tofuCompShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="175" height="26" rx="6" fill="#ef4444" fill-opacity="0.15"/>
        <text x="87" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ef4444">3. ÄLTERES GERÄT / SPIEL</text>

        <rect y="40" width="270" height="100" rx="12" fill="#080d1a" stroke="#ef4444" stroke-opacity="0.2"/>
        <text x="135" y="78" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ef4444">☐☐ Luna ☐☐</text>
        <text x="135" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444">⚠ Tofu-Platzhalter</text>

        <g transform="translate(0, 165)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#ef4444">Status:</text>
          <text x="0" y="24">Spiele wie Roblox oder</text>
          <text x="0" y="44">ältere Windows-Versionen</text>
          <text x="0" y="64">filtern exotische Blöcke</text>
          <text x="0" y="84">oder besitzen keinen Font.</text>
          <text x="0" y="114" font-weight="700" fill="#ef4444">Eingeschränkte Anzeige</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ef4444">Fehlende Glyphen</text>
      </g>
    </g>

  </g>
</svg>

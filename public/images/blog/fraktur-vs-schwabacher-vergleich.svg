<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0907"/>
      <stop offset="50%" stop-color="#17140f"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>
    <linearGradient id="compGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="compShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#compBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="200" r="260" fill="#f59e0b" fill-opacity="0.08"/>
  <circle cx="920" cy="450" r="260" fill="#d97706" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e1b15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2">TYPOGRAFISCHER VERGLEICH</text>
    <text y="48" font-family="Georgia, serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Schwabacher <tspan fill="url(#compGold)">versus</tspan> Fraktur
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Formensprache, Brechungen, Zierbögen und anatomische Unterschiede im Detail
    </text>
  </g>

  <!-- 2 Large Specimen Cards -->
  <g transform="translate(80, 145)">
    
    <!-- Left: Schwabacher Details -->
    <g transform="translate(0, 0)" filter="url(#compShadow)">
      <rect width="500" height="450" rx="20" fill="#14120e" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="160" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="80" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">SCHWABACHER</text>

        <!-- Specimen letters -->
        <rect y="40" width="450" height="110" rx="12" fill="#0c0a08" stroke="#f59e0b" stroke-opacity="0.2"/>
        <text x="225" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#ffffff">𝔞 𝔟 𝔠 𝔡 𝔢 𝔣 𝔤 𝔬</text>

        <!-- Anatomical Highlights -->
        <g transform="translate(0, 175)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#fbbf24">Typische Kennzeichen:</text>
          
          <text x="0" y="30" font-weight="700" fill="#ffffff">• Rundes kleines „o“:</text>
          <text x="170" y="30" fill="#94a3b8">Bauchige, flüssigere Rundungen</text>
          
          <text x="0" y="65" font-weight="700" fill="#ffffff">• Charakteristisches „g“:</text>
          <text x="170" y="65" fill="#94a3b8">Unten kreuzförmig geschlossen</text>
          
          <text x="0" y="100" font-weight="700" fill="#ffffff">• Breiter Duktus:</text>
          <text x="170" y="100" fill="#94a3b8">Horizontale Betonung, volkstümlich</text>
          
          <text x="0" y="135" font-weight="700" fill="#ffffff">• Weniger Zierschwünge:</text>
          <text x="170" y="135" fill="#94a3b8">Schlichtere Großbuchstaben</text>
        </g>

        <rect y="355" width="450" height="40" rx="8" fill="#221e17"/>
        <text x="225" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Optischer Eindruck: Warm, offen, bauchig</text>
      </g>
    </g>

    <!-- Right: Fraktur Details -->
    <g transform="translate(540, 0)" filter="url(#compShadow)">
      <rect width="500" height="450" rx="20" fill="#14120e" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="140" height="26" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="70" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">FRAKTUR</text>

        <!-- Specimen letters -->
        <rect y="40" width="450" height="110" rx="12" fill="#0c0a08" stroke="#fbbf24" stroke-opacity="0.2"/>
        <text x="225" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#ffffff">𝔄 𝔅 ℭ 𝔇 𝔈 𝔉 𝔊 𝔒</text>

        <!-- Anatomical Highlights -->
        <g transform="translate(0, 175)" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#fbbf24">Typische Kennzeichen:</text>
          
          <text x="0" y="30" font-weight="700" fill="#ffffff">• Gebrochene Schäfte:</text>
          <text x="170" y="30" fill="#94a3b8">Bögen sind oben &amp; unten eckig gebrochen</text>
          
          <text x="0" y="65" font-weight="700" fill="#ffffff">• „Elefantenrüssel“:</text>
          <text x="170" y="65" fill="#94a3b8">Schwungvolle Zierbögen an Versalien (A, V, W)</text>
          
          <text x="0" y="100" font-weight="700" fill="#ffffff">• Hoher Kontrast:</text>
          <text x="170" y="100" fill="#94a3b8">Extremer Wechsel aus Haarlinie &amp; Schatten</text>
          
          <text x="0" y="135" font-weight="700" fill="#ffffff">• Vertikale Rhythmik:</text>
          <text x="170" y="135" fill="#94a3b8">Schlanke, kaiserliche Eleganz</text>
        </g>

        <rect y="355" width="450" height="40" rx="8" fill="#221e17"/>
        <text x="225" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Optischer Eindruck: Vornehm, straff, geometrisch</text>
      </g>
    </g>

  </g>
</svg>

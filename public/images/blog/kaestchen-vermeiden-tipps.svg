<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tofuFixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="tofuFixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="tofuFixShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#tofuFixBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="200" r="260" fill="#22c55e" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-200" y="-16" width="400" height="32" rx="16" fill="#1e293b" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#22c55e" letter-spacing="2">4-PUNKTE LÖSUNGSPLAN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Kästchen &amp; Tofu <tspan fill="url(#tofuFixGrad)">erfolgreich beheben</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Schritt-für-Schritt zur fehlerfreien Darstellung auf allen Endgeräten
    </text>
  </g>

  <!-- 4 Actionable Cards (2x2 Grid) -->
  <g transform="translate(80, 145)">
    
    <!-- 1. Schriftart wechseln -->
    <g transform="translate(0, 0)" filter="url(#tofuFixShadow)">
      <rect width="500" height="210" rx="18" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 20)">
        <circle cx="16" cy="16" r="15" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#38bdf8">1</text>
        <text x="45" y="21" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Andere Schriftart verwenden</text>

        <rect y="45" width="450" height="70" rx="10" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Große Unicode-Abdeckung:</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Fonts wie Arial Unicode MS, Segoe UI Symbol oder Noto Sans decken Millionen Zeichen ab.</text>

        <text x="0" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Löst Probleme bei seltenen Symbolen und fremden Schriftsystemen sofort.</text>
      </g>
    </g>

    <!-- 2. System updaten -->
    <g transform="translate(540, 0)" filter="url(#tofuFixShadow)">
      <rect width="500" height="210" rx="18" fill="#111827" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 20)">
        <circle cx="16" cy="16" r="15" fill="#818cf8" fill-opacity="0.15"/>
        <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#818cf8">2</text>
        <text x="45" y="21" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Betriebssystem &amp; Apps updaten</text>

        <rect y="45" width="450" height="70" rx="10" fill="#080d1a" stroke="#818cf8" stroke-opacity="0.2"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#818cf8">Aktuelle Unicode-Tabellen:</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Updates für iOS, Android und Windows installieren neue Glyphen und Emojis nach.</text>

        <text x="0" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Verhindert Tofu bei brandneuen Unicode-Spezifikationen.</text>
      </g>
    </g>

    <!-- 3. Einfacheren Stil wählen -->
    <g transform="translate(0, 230)" filter="url(#tofuFixShadow)">
      <rect width="500" height="210" rx="18" fill="#111827" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 20)">
        <circle cx="16" cy="16" r="15" fill="#22c55e" fill-opacity="0.15"/>
        <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#22c55e">3</text>
        <text x="45" y="21" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Robuste Unicode-Stile nutzen</text>

        <rect y="45" width="450" height="70" rx="10" fill="#080d1a" stroke="#22c55e" stroke-opacity="0.2"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#22c55e">99,9 % Kompatibilität:</text>
        <text x="15" y="52" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">Fette Sans-Serif (𝐅𝐞𝐭𝐭) &amp; Kursivschrift (𝘒𝘶𝘳𝘴𝘪𝘷)</text>

        <text x="0" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Funktioniert selbst auf älteren Handys und einfachen Bildschirmen.</text>
      </g>
    </g>

    <!-- 4. Plattform-Test -->
    <g transform="translate(540, 230)" filter="url(#tofuFixShadow)">
      <rect width="500" height="210" rx="18" fill="#111827" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 20)">
        <circle cx="16" cy="16" r="15" fill="#fbbf24" fill-opacity="0.15"/>
        <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#fbbf24">4</text>
        <text x="45" y="21" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Zielplattform vorab testen</text>

        <rect y="45" width="450" height="70" rx="10" fill="#080d1a" stroke="#fbbf24" stroke-opacity="0.2"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Live-Check vor dem Posten:</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Text in WhatsApp, Discord oder Bio einfügen und Vorschau prüfen.</text>

        <text x="0" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Stellt sicher, dass Follower den Text ohne Kästchen sehen.</text>
      </g>
    </g>

  </g>
</svg>

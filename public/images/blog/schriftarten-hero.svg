<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2130" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#141722" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Lights -->
  <circle cx="200" cy="150" r="300" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="350" fill="#3b82f6" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Typographic Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 6">
    <line x1="100" y1="120" x2="1100" y2="120"/>
    <line x1="100" y1="260" x2="1100" y2="260"/>
    <line x1="100" y1="400" x2="1100" y2="400"/>
    <line x1="100" y1="540" x2="1100" y2="540"/>
    <line x1="200" y1="60" x2="200" y2="615"/>
    <line x1="600" y1="60" x2="600" y2="615"/>
    <line x1="1000" y1="60" x2="1000" y2="615"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(600, 70)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="2">TYPOGRAFIE &amp; STILE GUIDE</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Die Welt der <tspan fill="url(#amberGrad)">Schriftarten</tspan>
  </text>
  <text x="600" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Von klassischen Fonts (Serif &amp; Sans) bis zu modernen, kopierbaren Unicode-Stilen
  </text>

  <!-- Specimen Cards Grid (5 Font Styles) -->
  <g transform="translate(80, 220)">
    
    <!-- Card 1: Serif -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="190" height="260" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <rect x="15" y="15" width="65" height="22" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="47" y="30" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">SERIF</text>
      
      <text x="95" y="115" font-family="'Times New Roman', Times, serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">Aa</text>
      <text x="95" y="155" font-family="'Times New Roman', Times, serif" font-size="18" fill="#cbd5e1" text-anchor="middle">Schriftart</text>
      
      <line x1="20" y1="185" x2="170" y2="185" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="95" y="210" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Klassisch &amp; Buch</text>
      <text x="95" y="230" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Mit Endstrichen</text>
    </g>

    <!-- Card 2: Sans-Serif -->
    <g transform="translate(210, 0)" filter="url(#shadow)">
      <rect width="190" height="260" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <rect x="15" y="15" width="85" height="22" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="57" y="30" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">SANS-SERIF</text>
      
      <text x="95" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">Aa</text>
      <text x="95" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">Schriftart</text>
      
      <line x1="20" y1="185" x2="170" y2="185" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="95" y="210" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Modern &amp; Klar</text>
      <text x="95" y="230" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Web &amp; UI Design</text>
    </g>

    <!-- Card 3: Script / Kursiv -->
    <g transform="translate(420, 0)" filter="url(#shadow)">
      <rect width="190" height="260" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <rect x="15" y="15" width="70" height="22" rx="6" fill="#ec4899" fill-opacity="0.15"/>
      <text x="50" y="30" font-family="sans-serif" font-size="10" font-weight="700" fill="#f472b6" text-anchor="middle">SCRIPT</text>
      
      <text x="95" y="115" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="46" fill="#ffffff" text-anchor="middle">Aa</text>
      <text x="95" y="155" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="22" fill="#cbd5e1" text-anchor="middle">Schriftart</text>
      
      <line x1="20" y1="185" x2="170" y2="185" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="95" y="210" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Elegant &amp; Schwung</text>
      <text x="95" y="230" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Zitate &amp; Einladungen</text>
    </g>

    <!-- Card 4: Gotisch / Fraktur -->
    <g transform="translate(630, 0)" filter="url(#shadow)">
      <rect width="190" height="260" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <rect x="15" y="15" width="75" height="22" rx="6" fill="#a855f7" fill-opacity="0.15"/>
      <text x="52" y="30" font-family="sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">GOTISCH</text>
      
      <text x="95" y="115" font-family="'UnifrakturMaguntia', 'Old English Text MT', serif" font-size="44" fill="#ffffff" text-anchor="middle">𝔄𝔞</text>
      <text x="95" y="155" font-family="'UnifrakturMaguntia', 'Old English Text MT', serif" font-size="20" fill="#cbd5e1" text-anchor="middle">𝔖𝖈𝖍𝖗𝖎𝖋𝖙𝖆𝖗𝖙</text>
      
      <line x1="20" y1="185" x2="170" y2="185" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="95" y="210" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Fraktur &amp; Vintage</text>
      <text x="95" y="230" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Gaming &amp; Tattoos</text>
    </g>

    <!-- Card 5: Unicode Generator -->
    <g transform="translate(840, 0)" filter="url(#shadow)">
      <rect width="200" height="260" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="15" y="15" width="90" height="22" rx="6" fill="#f59e0b" fill-opacity="0.25"/>
      <text x="60" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">✨ UNICODE</text>
      
      <text x="100" y="115" font-family="sans-serif" font-size="40" font-weight="900" fill="#fbbf24" text-anchor="middle">𝕾𝖈𝖍</text>
      <text x="100" y="155" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">𝐒𝐜𝐡𝐫𝐢𝐟𝐭 📋</text>
      
      <line x1="20" y1="185" x2="180" y2="185" stroke="#f59e0b" stroke-opacity="0.2"/>
      <text x="100" y="210" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">1-Klick Kopieren</text>
      <text x="100" y="230" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Instagram, TikTok &amp; Co.</text>
    </g>
  </g>

  <!-- Studio Bottom Bar -->
  <g transform="translate(600, 570)" text-anchor="middle">
    <rect x="-320" y="-18" width="640" height="36" rx="18" fill="#141722" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
      💡 <tspan fill="#ffffff" font-weight="600">Entscheidend:</tspan> Klassische Fonts für Print &amp; Web • Unicode-Schriften für Social Media &amp; Games
    </text>
  </g>
</svg>

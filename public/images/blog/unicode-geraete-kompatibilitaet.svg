<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="uniKompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="uniKompGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="uniKompShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#uniKompBg)"/>

  <!-- Ambient Glows -->
  <circle cx="240" cy="200" r="240" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="960" cy="450" r="240" fill="#fbbf24" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">PLATTFORM-DARSTELLUNG</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Warum Unicode auf Geräten <tspan fill="url(#uniKompGrad)">variiert</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie Systemschriftarten, Browser-Engines und fehlende Glyphen die Darstellung prägen
    </text>
  </g>

  <!-- 3 Device Comparison Cards -->
  <g transform="translate(70, 150)">
    
    <!-- 1. Desktop / Modern Browser -->
    <g transform="translate(0, 0)" filter="url(#uniKompShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="140" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="70" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">DESKTOP / MAC</text>

        <rect y="40" width="270" height="100" rx="12" fill="#080d1a" stroke="#38bdf8" stroke-opacity="0.2"/>
        <text x="135" y="80" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">𝐇𝐚𝐥𝐥𝐨 𝕎𝕖𝕝𝕥 ✨</text>
        <text x="135" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">✓ Vollständige Glyphen</text>

        <g transform="translate(0, 165)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#38bdf8">Eigenschaften:</text>
          <text x="0" y="24">Umfangreiche System-</text>
          <text x="0" y="44">schriften (Segoe UI,</text>
          <text x="0" y="64">Apple Color Emoji,</text>
          <text x="0" y="84">Arial Unicode MS).</text>
          <text x="0" y="114" font-weight="700" fill="#22c55e">100 % Unterstützung</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Windows 11 / macOS</text>
      </g>
    </g>

    <!-- 2. Modern Smartphone (iOS / Android) -->
    <g transform="translate(370, 0)" filter="url(#uniKompShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="160" height="26" rx="6" fill="#c084fc" fill-opacity="0.15"/>
        <text x="80" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#c084fc">SMARTPHONE (APP)</text>

        <rect y="40" width="270" height="100" rx="12" fill="#080d1a" stroke="#c084fc" stroke-opacity="0.2"/>
        <text x="135" y="80" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff">𝓗𝓪𝓵𝓵𝓸 𝓦𝓮𝓵𝓽 ✨</text>
        <text x="135" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc">✓ Native App-Darstellung</text>

        <g transform="translate(0, 165)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#c084fc">Eigenschaften:</text>
          <text x="0" y="24">WhatsApp, Instagram &amp;</text>
          <text x="0" y="44">TikTok nutzen native</text>
          <text x="0" y="64">Rendering-Engines mit</text>
          <text x="0" y="84">hoher Farbtreue.</text>
          <text x="0" y="114" font-weight="700" fill="#c084fc">Sehr hohe Kompatibilität</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">iOS 17+ / Android 14+</text>
      </g>
    </g>

    <!-- 3. Older OS / Restricted Fallback -->
    <g transform="translate(740, 0)" filter="url(#uniKompShadow)">
      <rect width="320" height="440" rx="22" fill="#111827" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <rect width="175" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="87" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">ÄLTERE GERÄTE / SPIELE</text>

        <rect y="40" width="270" height="100" rx="12" fill="#080d1a" stroke="#f59e0b" stroke-opacity="0.2"/>
        <text x="135" y="80" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">Hallo ☐☐☐</text>
        <text x="135" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b">⚠ Tofu-Ersatzzeichen</text>

        <g transform="translate(0, 165)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="0" font-weight="800" fill="#fbbf24">Eigenschaften:</text>
          <text x="0" y="24">Fehlt eine Glyphe im</text>
          <text x="0" y="44">Betriebssystem, zeigt</text>
          <text x="0" y="64">das Gerät ein leeres</text>
          <text x="0" y="84">Rechteck (☐ Tofu) an.</text>
          <text x="0" y="114" font-weight="700" fill="#fbbf24">Vorab testen empfohlen</text>
        </g>

        <rect y="340" width="270" height="36" rx="8" fill="#1e293b"/>
        <text x="135" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Eingeschränkte Glyphen</text>
      </g>
    </g>

  </g>
</svg>

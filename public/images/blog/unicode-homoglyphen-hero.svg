<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="secHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="secHeroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="secHeroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#secHeroBg)"/>

  <!-- Ambient Glows -->
  <circle cx="280" cy="220" r="280" fill="#ef4444" fill-opacity="0.08"/>
  <circle cx="920" cy="450" r="280" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Top Badge -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-220" y="-18" width="440" height="36" rx="18" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f87171" letter-spacing="2">🔒 CYBER-SECURITY &amp;bull; HOMOGLYPHEN-SCHUTZ</text>
  </g>

  <!-- Central Title -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Unicode-Homoglyphen: <tspan fill="url(#secHeroGrad)">Visuelle Doppelgänger im Web</tspan>
  </text>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
    Wie ähnlich aussehende Zeichen für Phishing genutzt werden und wie du sie erkennst
  </text>

  <!-- Main Container Visual Mockup -->
  <g transform="translate(100, 205)" filter="url(#secHeroShadow)">
    <rect width="1000" height="420" rx="26" fill="#111827" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Inner Workspace Container -->
    <rect x="25" y="25" width="950" height="370" rx="18" fill="#090d16" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- Left: Echte Domain (Lateinische Zeichen) -->
    <g transform="translate(55, 55)">
      <rect width="410" height="310" rx="16" fill="#161f30" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <g transform="translate(20, 20)">
        <rect width="160" height="26" rx="6" fill="#22c55e" fill-opacity="0.15"/>
        <text x="80" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">✓ ECHTE DOMAIN</text>
      </g>

      <!-- Content Box -->
      <g transform="translate(20, 60)">
        <rect width="370" height="110" rx="12" fill="#0b1120" stroke="#22c55e" stroke-opacity="0.2"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">LATEINISCHES ALPHABET:</text>
        <text x="15" y="68" font-family="monospace" font-size="22" font-weight="900" fill="#ffffff">https://google.com</text>
        <text x="15" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">Codepoints: U+0067 &amp;bull; U+006F &amp;bull; U+006F &amp;bull; U+0067 &amp;bull; U+006C &amp;bull; U+0065</text>
      </g>

      <!-- Description -->
      <g transform="translate(20, 185)">
        <rect width="370" height="95" rx="12" fill="#1e293b"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#22c55e">SICHERHEITSBEWERTUNG:</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Ausschließlich lateinische ASCII-Zeichen.</text>
        <text x="15" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Keine Täuschung oder Confusable-Warnung.</text>
      </g>
    </g>

    <!-- Right: Homoglyphen Fake Domain (Kyrillisches 'о' &amp; 'е') -->
    <g transform="translate(535, 55)">
      <rect width="410" height="310" rx="16" fill="#161f30" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <g transform="translate(20, 20)">
        <rect width="210" height="26" rx="6" fill="#ef4444" fill-opacity="0.15"/>
        <text x="105" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ef4444">⚠ HOMOGLYPH SPOOFING</text>
      </g>

      <!-- Content Box -->
      <g transform="translate(20, 60)">
        <rect width="370" height="110" rx="12" fill="#0b1120" stroke="#ef4444" stroke-opacity="0.2"/>
        <text x="15" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">KYRILLISCHE DOPPELGÄNGER:</text>
        <text x="15" y="68" font-family="monospace" font-size="22" font-weight="900" fill="#ef4444">https://g<tspan fill="#fbbf24">оо</tspan>gl<tspan fill="#fbbf24">е</tspan>.com</text>
        <text x="15" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444">Punycode: xn--ggl-dda60da.com &amp;bull; U+043E, U+0435</text>
      </g>

      <!-- Description -->
      <g transform="translate(20, 185)">
        <rect width="370" height="95" rx="12" fill="#1e293b"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ef4444">SICHERHEITSRISIKO:</text>
        <text x="15" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Sieht für das Auge 100 % identisch aus, führt</text>
        <text x="15" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">aber auf einen fremden Phishing-Server.</text>
      </g>
    </g>

  </g>
</svg>

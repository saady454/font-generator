<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="valTippsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070d"/>
      <stop offset="50%" stop-color="#120e1f"/>
      <stop offset="100%" stop-color="#050408"/>
    </linearGradient>
    <linearGradient id="valTippsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4655"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="valTippsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#valTippsBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="180" r="240" fill="#ff4655" fill-opacity="0.08"/>
  <circle cx="940" cy="460" r="260" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Header Section -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e111d" stroke="#ff4655" stroke-opacity="0.4" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ff4655" letter-spacing="2">PROFI-LEITFADEN</text>
    <text y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      5 Tipps für einen <tspan fill="url(#valTippsGrad)">besseren Valorant Nickname</tspan>
    </text>
    <text y="78" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Wie du einen einprägsamen, professionellen Gamertag für Ranked &amp; Premier entwickelst
    </text>
  </g>

  <!-- 5 Tip Cards (2 top, 3 bottom) -->
  <g transform="translate(60, 145)">
    
    <!-- Tip 1 -->
    <g transform="translate(0, 0)" filter="url(#valTippsShadow)">
      <rect width="525" height="150" rx="18" fill="#130f21" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="45" cy="42" r="20" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="45" y="49" text-anchor="middle" font-size="16">👁️</text>
      
      <text x="80" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">1. Halte ihn maximal lesbar</text>
      <text x="80" y="56" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">Schnelle Erkennbarkeit im Matchmaking</text>

      <g transform="translate(20, 85)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Ein Name sollte auch in hektischen Runden und im Kill-Feed</text>
        <text x="0" y="36" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">sofort von Mitspielern per Voice-Callout angesagt werden können.</text>
      </g>
    </g>

    <!-- Tip 2 -->
    <g transform="translate(555, 0)" filter="url(#valTippsShadow)">
      <rect width="525" height="150" rx="18" fill="#130f21" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="45" cy="42" r="20" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="45" y="49" text-anchor="middle" font-size="16">🔢</text>
      
      <text x="80" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2. Vermeide unnötige Zahlen</text>
      <text x="80" y="56" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">Zufällige Nummernfolgen wirken beliebig</text>

      <g transform="translate(20, 85)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Statt <tspan fill="#f87171">Vanta8921</tspan> lieber <tspan fill="#34d399">VantaAim</tspan> oder eine Tagline wie <tspan fill="#38bdf8">#EUW</tspan> nutzen.</text>
        <text x="0" y="36" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Das wirkt deutlich professioneller und aufgeräumter.</text>
      </g>
    </g>

    <!-- Tip 3 -->
    <g transform="translate(0, 175)" filter="url(#valTippsShadow)">
      <rect width="340" height="290" rx="18" fill="#130f21" stroke="#ff4655" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="40" cy="42" r="18" fill="#ff4655" fill-opacity="0.15"/>
      <text x="40" y="49" text-anchor="middle" font-size="15">🎯</text>
      
      <text x="70" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">3. Taktisches Thema</text>
      <text x="70" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#ff4655">Inspiration durchs Game</text>

      <g transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="14">Nutze Begriffe aus Rollen,</text>
        <text x="0" y="36">Fähigkeiten oder Maps:</text>
        <text x="0" y="64" font-weight="700" fill="#ffffff">&amp;bull; Crosshair &amp;bull; Clutch</text>
        <text x="0" y="88" font-weight="700" fill="#ffffff">&amp;bull; Site &amp;bull; Phantom &amp;bull; Void</text>
        <text x="0" y="118" fill="#94a3b8" font-size="11">Erzeugt sofort Taktik-Flair.</text>
      </g>
    </g>

    <!-- Tip 4 -->
    <g transform="translate(370, 175)" filter="url(#valTippsShadow)">
      <rect width="340" height="290" rx="18" fill="#130f21" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="40" cy="42" r="18" fill="#c084fc" fill-opacity="0.15"/>
      <text x="40" y="49" text-anchor="middle" font-size="15">📝</text>
      
      <text x="70" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">4. 5–10 Varianten testen</text>
      <text x="70" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc">Nicht die erste Idee nehmen</text>

      <g transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="14">Schreibe mehrere Versionen auf</text>
        <text x="0" y="36">und lies sie laut vor.</text>
        <text x="0" y="64">Streiche alles, was schwer</text>
        <text x="0" y="86">auszusprechen ist.</text>
        <text x="0" y="118" fill="#94a3b8" font-size="11">So bleibt nur das Beste übrig.</text>
      </g>
    </g>

    <!-- Tip 5 -->
    <g transform="translate(740, 175)" filter="url(#valTippsShadow)">
      <rect width="340" height="290" rx="18" fill="#130f21" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="40" cy="42" r="18" fill="#34d399" fill-opacity="0.15"/>
      <text x="40" y="49" text-anchor="middle" font-size="15">🛡️</text>
      
      <text x="70" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">5. Riot-Regeln prüfen</text>
      <text x="70" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">3 bis 16 Zeichen Limit</text>

      <g transform="translate(20, 85)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text x="0" y="14">Riot verlangt für den Alias</text>
        <text x="0" y="36">alphanumerische Zeichen.</text>
        <text x="0" y="64">Prüfe den Namen vorab</text>
        <text x="0" y="86">im Riot-Konto.</text>
        <text x="0" y="118" fill="#34d399" font-size="11 font-weight=700">Verhindert böse Überraschungen.</text>
      </g>
    </g>

  </g>
</svg>
